[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dacksim"
version = "0.1.0"
description = "Deterministic deck-comparison simulator foundation for DACK"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "DACK simulator contributors"}]
dependencies = []

[project.scripts]
dacksim = "dacksim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["dacksim*"]
