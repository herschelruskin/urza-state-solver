name: Phase 5 Caverns opening context

on:
  push:
    branches:
      - phase5-opening-environment-caverns
  pull_request:
    branches:
      - phase5-adaptive-mulligan-q
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile opening environment slice
        run: |
          python -m py_compile phase5_mulligan.py phase5_adaptive_mulligan.py phase5_caverns_opening_smoke.py phase5_commander_seat_mixture_smoke.py
      - name: Seat and Gemstone Caverns regression
        run: python phase5_caverns_opening_smoke.py\n          python phase5_commander_seat_mixture_smoke.py
      - name: Parent adaptive and London regressions
        run: |
          python phase5_adaptive_mulligan_smoke.py
          python phase5_mulligan_smoke.py
          python phase5_selective_tutor_q_smoke.py
          python phase5_monte_carlo_cache_smoke.py
      - name: Strategic key and benchmark regressions
        run: |
          python strategic_value_state_smoke.py
          python non_oracle_runtime_value_key_smoke.py
          python human_benchmark_fixture_smoke.py
          python phase1_acceptance_smoke.py
      - name: Diff check
        run: git diff --check
