name: DACK counterfactual v1 isolated smoke

on:
  push:
    branches:
      - dack-counterfactual-engine-v1-20261030
    paths:
      - 'dack_counterfactual_rules_v1_20261030.py'
      - 'dack_counterfactual_rules_v2_strict_key_20261030.py'
      - 'dack_paired_counterfactual_v1_20261030.py'
      - 'pool_dack_paired_counterfactual_v1_20261030.py'
      - 'dack_simulator/configs/physical99_20261030.json'
      - 'dack_simulator/configs/onekey_artifact_cut_screen_v1.json'
      - 'dack_simulator/validation/audit_physical99_20261030.py'
      - 'dack_simulator/validation/test_paired_v1.py'
      - 'dack_simulator/validation/test_pool_v1.py'
      - 'dack_simulator/validation/state_key_collision_witness_v1.py'
      - '.github/workflows/dack_counterfactual_v1_smoke.yml'
  workflow_dispatch:
    inputs:
      run_single_game:
        description: 'Run one slow full-game reference E2E for the 34-land control'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile isolated code and tests
        run: |
          python -m compileall -q dack_counterfactual_rules_v1_20261030.py dack_counterfactual_rules_v2_strict_key_20261030.py dack_paired_counterfactual_v1_20261030.py pool_dack_paired_counterfactual_v1_20261030.py dack_simulator/validation/audit_physical99_20261030.py dack_simulator/validation/test_paired_v1.py dack_simulator/validation/test_pool_v1.py
      - name: Freeze and validate the physical 99
        run: python dack_simulator/validation/audit_physical99_20261030.py
      - name: Test Treasure Vault and Staff semantics
        run: python dack_counterfactual_rules_v1_20261030.py
      - name: Demonstrate the inherited collision risk
        run: python dack_simulator/validation/state_key_collision_witness_v1.py
      - name: Test opt-in strict state key v2
        run: python dack_counterfactual_rules_v2_strict_key_20261030.py
      - name: Audit paired deck variants and policy
        run: python dack_paired_counterfactual_v1_20261030.py --audit
      - name: Run deterministic lightweight unit tests
        run: python -m unittest discover -s dack_simulator/validation -p test_paired_v1.py -v
      - name: Strict pooled-results contract tests
        run: python -m unittest discover -s dack_simulator/validation -p test_pool_v1.py -v
      - name: Optional single-game end-to-end
        if: github.event_name == 'workflow_dispatch' && inputs.run_single_game == true
        run: python dack_paired_counterfactual_v1_20261030.py --single-variant one_key_34 --start 0
