name: DACK v48c combo library and natural draw risk verification
on:
  push:
    branches: [dack-v48-turn-aware-legal-mana-features-20261101]
    paths:
      - ".github/workflows/dack_v48c_combo_risk_smoke.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  risk:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python dack_turn_aware_combo_draw_integrity_v48c_20261101.py
