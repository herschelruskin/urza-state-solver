name: DACK real-label offline learned London v8 pilot 32 plus 32
on:
  push:
    branches: [dack-counterfactual-engine-v1-20261030]
    paths:
      - '.github/workflows/dack_learned_london_v8_real_pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  labels:
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - split: train
            start: 20000
          - split: train
            start: 20004
          - split: train
            start: 20008
          - split: train
            start: 20012
          - split: train
            start: 20016
          - split: train
            start: 20020
          - split: train
            start: 20024
          - split: train
            start: 20028
          - split: calibration
            start: 30000
          - split: calibration
            start: 30004
          - split: calibration
            start: 30008
          - split: calibration
            start: 30012
          - split: calibration
            start: 30016
          - split: calibration
            start: 30020
          - split: calibration
            start: 30024
          - split: calibration
            start: 30028
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate truly sampled beam-160 outcome labels
        run: |
          python -u dack_simulator/validation/generate_offline_london_labels_v8.py \
            --split ${{ matrix.split }} --start ${{ matrix.start }} \
            --games 4 --candidates 2 --draws 4 \
            --out datasets/offline_${{ matrix.split }}_${{ matrix.start }}.jsonl.gz
      - name: Check positive label count and group boundaries
        run: |
          python - <<'PY'
          import gzip,glob,json
          f=glob.glob('datasets/offline_*.jsonl.gz')
          assert len(f)==1,f
          with gzip.open(f[0],'rt') as h:lines=[json.loads(s) for s in h]
          assert lines[0]['type']=='metadata'
          n=sum(x['type']=='label' for x in lines[1:])
          assert n>=4,n
          gids={x['game_id'] for x in lines[1:]}
          assert len(gids)==4,gids
          assert all('actual_library' not in x and
                     'first3' not in x and 'hidden_order' not in x
                     for x in lines[1:])
          print('REAL_OFFLINE_SHARD_PASS',f[0],'n_labels',n,flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-v8-${{ matrix.split }}-${{ matrix.start }}
          path: datasets/
          retention-days: 10

  train_and_calibrate:
    needs: labels
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: offline-v8-*
          merge-multiple: true
          path: corpus/
      - name: Install offline-only model dependencies
        run: python -m pip install 'scikit-learn>=1.4,<2'
      - name: Check independent T1/T2/T3 class coverage before fitting
        id: coverage
        run: |
          python - <<'PY'
          from collections import Counter
          from pathlib import Path
          import gzip,glob,json,os
          result={'schema':'dack_real_outcome_label_coverage_v8',
                  'pilot_only':True,'per_split':{}}
          for split in ('train','calibration'):
              files=glob.glob(f'corpus/offline_{split}_*.jsonl.gz')
              assert len(files)==8,(split,len(files))
              counts=Counter();groups=set()
              for path in files:
                  with gzip.open(path,'rt') as f:
                      meta=json.loads(next(f))
                      assert meta['split']==split
                      for line in f:
                          x=json.loads(line)
                          assert x['type']=='label'
                          counts[x['label_turn']]+=1
                          groups.add(x['game_id'])
              result['per_split'][split]={
                  'n_groups':len(groups),'n_labels':sum(counts.values()),
                  'class_counts':{str(k):counts[k] for k in range(4)}}
              assert len(groups)==32
          ready=all(min(int(v['class_counts'][str(k)]) for k in range(4))>=8
                    for v in result['per_split'].values())
          result['ready_for_experimental_fit']=ready
          result['required_each_class_per_split']=8
          result['status']='SUFFICIENT_PILOT_COVERAGE' if ready else 'MORE_LABELS_REQUIRED'
          out=Path('benchmark_results/real_outcome_label_coverage_v8.json')
          out.parent.mkdir(exist_ok=True)
          out.write_text(json.dumps(result,indent=2)+'\n')
          with open(os.environ['GITHUB_OUTPUT'],'at') as f:
              f.write(f"ready={'true' if ready else 'false'}\n")
          print('OFFLINE_REAL_LABEL_COVERAGE',json.dumps(result),flush=True)
          PY
      - name: Fit and independently calibrate experimental real-outcome model
        if: steps.coverage.outputs.ready == 'true'
        run: |
          python -u dack_simulator/validation/train_offline_london_v8.py \
            --train corpus/offline_train_*.jsonl.gz \
            --calibration corpus/offline_calibration_*.jsonl.gz \
            --model models/experimental_real_outcomes_v8.json \
            --report benchmark_results/experimental_real_outcomes_v8_calibration.json
      - name: Derive all-nine-deck seat-specific London DP without beam
        if: steps.coverage.outputs.ready == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from dack_paired_counterfactual_v1_20261030 import VARIANTS
          from dack_simulator.validation.derive_learned_london_dp_v8 import calibrate
          model=json.loads(Path('models/experimental_real_outcomes_v8.json').read_text())
          for name in VARIANTS:
              dp=calibrate(model,name,samples=16,start=50000)
              Path(f'models/dack_london_v8_dp_{name}.json').write_text(json.dumps(dp))
          print('EXPERIMENTAL_REAL_MODEL_DP_READY',len(VARIANTS),flush=True)
          PY
      - name: Audit model artifact and all DP tables without evaluating holdout
        if: steps.coverage.outputs.ready == 'true'
        run: |
          python dack_paired_counterfactual_v8_learned_london_20261031.py \
            --model models/experimental_real_outcomes_v8.json \
            --continuations-dir models --audit
          echo 'EXPERIMENTAL_MODEL_ONLY: not validated, not promoted'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dack-v8-experimental-real-outcomes-model-and-calibration
          path: |
            models/
            benchmark_results/*.json
          retention-days: 10
