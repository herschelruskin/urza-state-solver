name: Phase 5I X-artifact slot stability fix

on:
  push:
    branches:
      - phase5i-x-slot-stability-fix
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply stable permanent commitment patch
        run: |
          python phase5i_apply_x_slot_stability_fix.py
          python phase5i_apply_x_slot_stability_fix_cleanup.py
      - name: Compile patched X-artifact modules
        run: |
          python -m py_compile x_artifact_search_adapter.py
          python -m py_compile non_oracle_x_artifact_tutor_runtime.py
          python -m py_compile x_artifact_search_adapter_smoke.py
          python -m py_compile x_artifact_tutor_runtime_smoke.py
      - name: Phase-1 X-artifact regressions
        run: python x_artifact_search_adapter_smoke.py
      - name: Typed Phase-2 X-artifact regressions
        run: python x_artifact_tutor_runtime_smoke.py
      - name: Phase 5H Q regressions
        run: |
          python phase5_adaptive_confidence_q_smoke.py
          python phase5_contingent_tutor_q_smoke.py
      - name: Diff check
        run: git diff --check
      - name: Commit patched sources
        run: |
          if git diff --quiet; then
            echo 'No source changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add x_artifact_search_adapter.py non_oracle_x_artifact_tutor_runtime.py x_artifact_search_adapter_smoke.py x_artifact_tutor_runtime_smoke.py
          git commit -m 'Stabilize Reshape and Whir permanent commitments across payment'
          git push origin HEAD:phase5i-x-slot-stability-fix
