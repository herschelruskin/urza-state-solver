name: DACK core3 weak-slot N128 wave B

on:
  push:
    branches:
      - dack-full-deck-accel-calibration-20261003
    paths:
      - .github/workflows/dack_core3_weakslot_n128_wave_b.yml

permissions:
  contents: write

concurrency:
  group: dack-core3-weakslot-search-n128-B
  cancel-in-progress: true

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run core3 baseline
        run: |
          mkdir -p shard
          python dack_core3_weakslot_search_n128.py \
            --candidate "__BASE__" \
            --cut "__NONE__" \
            --shard ${{ matrix.shard }} \
            --games 32 \
            --out "shard/core3_base_${{ matrix.shard }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: "dack-core3-wave-B-base-${{ matrix.shard }}"
          path: "shard/*.json"
          retention-days: 14

  grid:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        candidate:
          - "Urza's Incubator"
          - "Worn Powerstone"
          - "Chromatic Lantern"
          - "Honor-Worn Shaku"
        cut:
          - "Prismatic Lens"
          - "The Mind Stone"
          - "Everflowing Chalice"
          - "Mind Stone"
          - "Tooth of Ramos"
          - "Basalt Monolith"
          - "Implements of Sacrifice"
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run weak-slot candidate shard
        run: |
          mkdir -p shard
          python dack_core3_weakslot_search_n128.py \
            --candidate "${{ matrix.candidate }}" \
            --cut "${{ matrix.cut }}" \
            --shard ${{ matrix.shard }} \
            --games 32 \
            --out "shard/result_${{ strategy.job-index }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: "dack-core3-wave-B-grid-${{ strategy.job-index }}"
          path: "shard/*.json"
          retention-days: 14

  pool:
    needs: [baseline, grid]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dack-core3-wave-B-*
          path: shards
          merge-multiple: true
      - name: Pool wave B
        run: |
          mkdir -p results
          python pool_dack_core3_weakslot_search_n128.py \
            --glob 'shards/*.json' \
            --expected-games 128 \
            --json-out results/dack_core3_weakslot_n128_wave_b.json \
            --csv-out results/dack_core3_weakslot_n128_wave_b.csv
      - name: Commit results
        run: |
          git config user.name "DACK Simulator Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f results/dack_core3_weakslot_n128_wave_b.json results/dack_core3_weakslot_n128_wave_b.csv
          git commit -m "Add core3 weak-slot N128 wave B results" || exit 0
          git pull --rebase origin dack-full-deck-accel-calibration-20261003
          git push origin HEAD:dack-full-deck-accel-calibration-20261003
      - uses: actions/upload-artifact@v4
        with:
          name: dack-core3-wave-B-pooled
          path: |
            results/dack_core3_weakslot_n128_wave_b.json
            results/dack_core3_weakslot_n128_wave_b.csv
          retention-days: 30
