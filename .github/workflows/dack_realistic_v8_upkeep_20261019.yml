name: Dack V8 Mana Vault Upkeep Decision N32
on:
  push:
    branches: [dack-realistic-v8-upkeep-ev-20261019]
    paths:
      - 'dack_realistic_v8_upkeep_policy_20261019.py'
      - 'dack_realistic_v8_upkeep_pool_20261019.py'
      - '.github/workflows/dack_realistic_v8_upkeep_20261019.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
env:
  PYTHONHASHSEED: '0'
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check legal upkeep branches and library order invariance
        run: |
          python -m py_compile dack_realistic_v8_upkeep_policy_20261019.py dack_realistic_v8_upkeep_pool_20261019.py
          python -u dack_realistic_v8_upkeep_policy_20261019.py --audit
      - name: Evaluate one complete World Map and Bucknard game
        run: |
          for variant in current buck_worldmap; do
            python -u dack_realistic_v8_upkeep_policy_20261019.py \
              --variant "$variant" --shard 0 --games 1 \
              --forecast-beam 42 --forecast-depth 18 \
              --out "smoke_$variant.json.gz"
          done
      - name: Verify paired seeds and valid game outcome
        run: |
          python - <<'PY'
          import gzip,json
          with gzip.open('smoke_current.json.gz','rt') as f:a=json.load(f)
          with gzip.open('smoke_buck_worldmap.json.gz','rt') as f:b=json.load(f)
          for q in (a,b):
              assert q['schema']=='dack_upkeep_legal_ev_v8'
              assert q['rows'][0]['game_id']==0 and 0<=q['rows'][0]['win_turn']<=3
              assert q['actual_beam']==120 and q['forecast_beam']==42
          assert a['rows'][0]['seat']==b['rows'][0]['seat']
          print('DACK_V8_UPKEEP_PAIR_SMOKE_PASS',flush=True)
          PY
  shards:
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        variant: [current, buck_worldmap]
        shard: [0,1,2,3,4,5,6,7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Four matched games with pre-draw upkeep chance evaluation
        run: |
          mkdir -p v8
          python -u dack_realistic_v8_upkeep_policy_20261019.py \
            --variant "${{ matrix.variant }}" --shard "${{ matrix.shard }}" --games 4 \
            --forecast-beam 42 --forecast-depth 18 \
            --out "v8/${{ matrix.variant }}_shard_${{ matrix.shard }}.json.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: dack-v8-upkeep-${{ matrix.variant }}-${{ matrix.shard }}
          path: v8/*.json.gz
          retention-days: 90
          if-no-files-found: error
  pool:
    needs: [smoke,shards]
    if: ${{ needs.smoke.result == 'success' && needs.shards.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dack-v8-upkeep-*
          merge-multiple: true
          path: v8
      - name: Recover exact matched v6 game archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p v6
          gh run download 39338026707 --repo "${{ github.repository }}" \
            --pattern 'dack-v6-stratified-*' --dir v6
          test "$(find v6 -name '*.json.gz' | wc -l)" -eq 16
          test "$(find v8 -name '*.json.gz' | wc -l)" -eq 16
      - name: Pool paired T1 T2 T3 and audit every nonheuristic upkeep decision
        run: |
          python -u dack_realistic_v8_upkeep_pool_20261019.py \
            --v6 v6 --v8 v8 --n 32 \
            --out dack_v8_upkeep_ev_n32_20261019.json
      - uses: actions/upload-artifact@v4
        with:
          name: dack-v8-upkeep-n32-paired
          path: dack_v8_upkeep_ev_n32_20261019.json
          retention-days: 90
      - name: Publish v8 matched decision experiment
        run: |
          mkdir -p benchmark_results
          cp dack_v8_upkeep_ev_n32_20261019.json benchmark_results/dack_v8_upkeep_ev_n32_20261019.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add benchmark_results/dack_v8_upkeep_ev_n32_20261019.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publish Realistic Beam v8 information-aware upkeep experiment'
            git pull --rebase origin dack-realistic-v8-upkeep-ev-20261019
            git push
          fi
