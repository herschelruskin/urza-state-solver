name: Post-R7 modeling completeness gate

on:
  push:
    branches:
      - rust-engine-rebuild
    paths:
      - '.github/workflows/post-r7-modeling-completeness-gate.yml'
      - 'rust/data/goldfish_model_gate.v1.tsv'
      - 'rust/crates/urza-cards/**'
      - 'rust/crates/urza-rules/**'
      - 'rust/crates/urza-policy-bridge/**'
      - 'rust/crates/urza-mulligan/src/bin/post-r7-modeling-completeness-gate.rs'
      - 'rust/POST_R7_MODELING_COMPLETENESS_GATE.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  modeling-completeness:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@1.89
        with:
          components: rustfmt, clippy
      - name: Format check
        working-directory: rust
        run: cargo fmt --all -- --check
      - name: Gate unit test
        working-directory: rust
        run: cargo test --locked -p urza-mulligan --bin post-r7-modeling-completeness-gate
      - name: Compile gate surface
        working-directory: rust
        run: cargo check --locked -p urza-mulligan --bin post-r7-modeling-completeness-gate
      - name: Strict Clippy gate surface
        working-directory: rust
        run: cargo clippy --locked -p urza-mulligan --bin post-r7-modeling-completeness-gate -- -D warnings
      - name: Record current completeness inventory
        working-directory: rust
        run: cargo run --quiet --locked -p urza-mulligan --bin post-r7-modeling-completeness-gate -- --inventory > POST_R7_MODELING_COMPLETENESS_GATE_RESULT.md
      - name: Commit inventory result
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rust/POST_R7_MODELING_COMPLETENESS_GATE_RESULT.md
          if git diff --cached --quiet; then
            echo 'inventory result unchanged'
          else
            git commit -m '[R7] Record modeling completeness gate result'
            git push
          fi
      - name: Enforce modeling completeness
        working-directory: rust
        run: cargo run --quiet --locked -p urza-mulligan --bin post-r7-modeling-completeness-gate -- --enforce
