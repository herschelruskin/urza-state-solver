name: R7 signal-boundary diagnostic

on:
  push:
    branches: [rust-engine-rebuild]
    paths:
      - "rust/**"
      - "decklist.txt"
      - ".github/workflows/rust-r7-signal-boundary.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signal-boundary:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, '[r7-boundary]')
    strategy:
      fail-fast: false
      matrix:
        case:
          - pa-basalt-terminal
          - pa-basalt-stack
          - pa-basalt-one-hand
          - pa-basalt-two-hand
          - basalt-gadgeteer-terminal
          - basalt-gadgeteer-stack
          - basalt-gadgeteer-one-hand
          - basalt-gadgeteer-two-hand
          - top-chip-terminal
          - top-chip-stack
          - top-chip-one-hand
          - top-chip-two-hand
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
      - name: Locked dependency graph
        working-directory: rust
        run: cargo metadata --locked --format-version 1 --no-deps > /dev/null
      - name: Generate R7 signal-boundary case
        working-directory: rust
        run: |
          output="../r7-signal-boundary-${{ matrix.case }}.tsv"
          printf 'REPOSITORY_SHA\t%s\n' "$GITHUB_SHA" > "$output"
          printf 'REPOSITORY_DIRTY\tfalse\n' >> "$output"
          cargo run --locked -p urza-mulligan --bin r7-signal-boundary-case -- "${{ matrix.case }}" | tee -a "$output"
      - name: Upload R7 signal-boundary case
        uses: actions/upload-artifact@v4
        with:
          name: r7-signal-boundary-${{ matrix.case }}-${{ github.sha }}
          path: r7-signal-boundary-${{ matrix.case }}.tsv
          if-no-files-found: error
