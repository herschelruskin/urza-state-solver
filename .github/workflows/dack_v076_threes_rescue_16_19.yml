name: DACK v0.76 threes rescue 16-19
on:
  push:
    branches: [dack-simulator-v0.75-current99]
    paths:
      - .github/workflows/dack_v076_threes_rescue_16_19.yml
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        gid: [16,17,18,19]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          mkdir -p paired
          python dack_artifact_paired_v076.py --group threes --start ${{ matrix.gid }} --games 1 --out paired/threes_${{ matrix.gid }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: rescue-threes-${{ matrix.gid }}
          path: paired/threes_${{ matrix.gid }}.json
