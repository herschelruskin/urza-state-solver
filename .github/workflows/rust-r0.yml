name: Rust foundation gates

on:
  push:
    branches: [rust-engine-rebuild]
    paths:
      - "rust/**"
      - "decklist.txt"
      - "benchmarks/human/human_mulligan_exact_hands.json"
      - ".github/workflows/rust-r0.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy
      - name: Locked dependency graph
        working-directory: rust
        run: cargo metadata --locked --format-version 1 --no-deps > /dev/null
      - name: Format check
        working-directory: rust
        run: cargo fmt --all -- --check
      - name: Clippy
        working-directory: rust
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Tests
        working-directory: rust
        run: cargo test --locked --workspace --all-targets
      - name: Bench compile
        working-directory: rust
        run: cargo check --locked --workspace --benches
      - name: R0 audit report
        working-directory: rust
        run: cargo run --locked -p urza-cli -- r0-audit
      - name: R1 catalog audit
        working-directory: rust
        run: cargo run --locked -p urza-cli -- r1-audit
      - name: R2 core audit
        working-directory: rust
        run: cargo run --locked -p urza-cli -- r2-audit
      - name: R3 staged-search audit
        working-directory: rust
        run: cargo run --locked -p urza-cli -- r3-audit
      - name: R4 engine/win audit
        working-directory: rust
        run: cargo run --locked -p urza-cli -- r4-audit
      - name: R5 policy audit
        working-directory: rust
        run: cargo run --locked -p urza-cli -- r5-audit
      - name: R6 mulligan acceptance audit
        working-directory: rust
        run: cargo run --locked -p urza-mulligan --bin r6-audit
      - name: R7 teacher viability probe
        working-directory: rust
        run: cargo run --locked -p urza-mulligan --bin r7-viability
      - name: R7 teacher keep-value sidecar smoke
        working-directory: rust
        run: cargo run --locked -p urza-mulligan --bin r7-teacher-sidecar
      - name: R7 pilot corpus generation
        working-directory: rust
        run: |
          printf 'REPOSITORY_SHA\t%s\n' "$GITHUB_SHA" > ../r7-pilot-corpus.tsv
          printf 'REPOSITORY_DIRTY\tfalse\n' >> ../r7-pilot-corpus.tsv
          printf 'GENERATION_WORKERS\t1\n' >> ../r7-pilot-corpus.tsv
          cargo run --locked -p urza-mulligan --bin r7-corpus -- pilot | tee -a ../r7-pilot-corpus.tsv
      - name: Upload R7 pilot corpus
        uses: actions/upload-artifact@v4
        with:
          name: r7-pilot-corpus-${{ github.sha }}
          path: r7-pilot-corpus.tsv
          if-no-files-found: error
