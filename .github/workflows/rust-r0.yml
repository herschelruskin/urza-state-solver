name: Rust foundation gates

on:
  push:
    branches: [rust-engine-rebuild]
    paths:
      - "rust/**"
      - "decklist.txt"
      - "benchmarks/human/human_mulligan_exact_hands.json"
      - ".github/workflows/rust-r0.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy
      - name: Locked dependency graph
        working-directory: rust
        run: cargo metadata --locked --format-version 1 --no-deps > /dev/null
      - name: Format check
        working-directory: rust
        run: cargo fmt --all -- --check
      - name: Clippy
        working-directory: rust
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Tests
        working-directory: rust
        run: cargo test --locked --workspace --all-targets
      - name: Bench compile
        working-directory: rust
        run: cargo check --locked --workspace --benches
      - name: R0 audit report
        working-directory: rust
        run: cargo run --locked -p urza-cli -- r0-audit
      - name: R1 catalog audit
        working-directory: rust
        run: cargo run --locked -p urza-cli -- r1-audit
