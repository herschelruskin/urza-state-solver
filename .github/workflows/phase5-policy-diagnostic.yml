name: Phase 5 base-policy diagnostic

on:
  push:
    branches:
      - phase5-mulligan-dp
  workflow_dispatch:

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run human-kept hand trajectories
        run: python phase5_policy_diagnostic.py
      - uses: actions/upload-artifact@v4
        with:
          name: phase5-policy-diagnostic
          path: phase5_policy_diagnostic.json
