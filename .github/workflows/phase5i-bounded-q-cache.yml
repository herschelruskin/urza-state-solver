name: Phase 5I bounded Q cache validation

on:
  push:
    branches:
      - phase5i-bounded-q-cache
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile changed runtime
        run: |
          python -m py_compile phase5_monte_carlo.py
          python -m py_compile phase5_production_policy.py
          python -m py_compile phase5i_mulligan.py
          python -m py_compile phase5i_hand12_world_eval.py
          python -m py_compile phase5_decision_cache_smoke.py
      - name: Cache and production regressions
        run: |
          python phase5_decision_cache_smoke.py
          python phase5_monte_carlo_cache_smoke.py
          python phase5_adaptive_confidence_q_smoke.py
          python phase5_contingent_tutor_q_smoke.py
          python phase5i_mulligan_smoke.py
          python phase5i_stage_factorization_smoke.py
      - name: Source check
        run: git diff --check

  hand12_world0:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONHASHSEED: '0'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Evaluate exact OOM coordinate with bounded cache
        shell: bash
        run: |
          set -uo pipefail
          python phase5i_hand12_world_eval.py --sample-id 0 &
          pid=$!
          echo "PYTHON_PID=$pid"
          while kill -0 "$pid" 2>/dev/null; do
            echo "RESOURCE_SAMPLE $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            ps -o pid,ppid,%cpu,%mem,rss,vsz,etime,cmd -p "$pid" || true
            free -m || true
            sleep 15
          done
          wait "$pid"
      - uses: actions/upload-artifact@v4
        with:
          name: phase5i-hand12-world-0-bounded-cache
          path: phase5i_hand12_world_0.json
