name: R5 candidate bridge finalize

on:
  push:
    branches: [rust-engine-rebuild]
    paths:
      - ".github/workflows/r5-candidate-bridge-finalize.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rust-engine-rebuild
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy
      - name: Patch bridge integration surfaces
        run: |
          python - <<'PY'
          from pathlib import Path

          info = Path('rust/crates/urza-info/src/lib.rs')
          text = info.read_text()
          old = '''pub fn resolve_canonical_object(
              state: &TrueState,
              canonical: CanonicalObjectId,
          ) -> Result<Option<ObjectId>, ObservationError> {
              state.validate()?;
              Ok(canonical_object_classes(state)
                  .into_iter()
                  .filter_map(|(object, class)| (class == canonical).then_some(object))
                  .min())
          }
          '''
          new = '''pub fn resolve_canonical_objects(
              state: &TrueState,
              canonical: CanonicalObjectId,
          ) -> Result<Vec<ObjectId>, ObservationError> {
              state.validate()?;
              let mut objects: Vec<_> = canonical_object_classes(state)
                  .into_iter()
                  .filter_map(|(object, class)| (class == canonical).then_some(object))
                  .collect();
              objects.sort_unstable();
              Ok(objects)
          }

          pub fn resolve_canonical_object(
              state: &TrueState,
              canonical: CanonicalObjectId,
          ) -> Result<Option<ObjectId>, ObservationError> {
              Ok(resolve_canonical_objects(state, canonical)?.into_iter().next())
          }
          '''
          if old not in text:
              raise SystemExit('resolve_canonical_object block not found')
          info.write_text(text.replace(old, new, 1))

          main = Path('rust/crates/urza-cli/src/main.rs')
          text = main.read_text()
          text = text.replace(
              'use urza_policy::{POLICY_PHASE, POLICY_VERSION};\n',
              'use urza_policy::{POLICY_PHASE, POLICY_VERSION};\nuse urza_policy_bridge::{\n    CANDIDATE_BRIDGE_VERSION, CONTINGENT_ACTION_FAMILY_COUNT, ORDINARY_ACTION_FAMILY_COUNT,\n};\n',
              1,
          )
          old = '''fn run_r5_audit() {
              validate_r4_database().expect("accepted R4 database remains frozen for R5");

              let report = json!({
                  "phase": "R5-start",
                  "policy_phase": POLICY_PHASE,
                  "policy_version": POLICY_VERSION,
                  "rules_version": RULES_VERSION,
                  "model_version": MODEL_VERSION,
                  "information_schema_version": INFORMATION_SCHEMA_VERSION,
                  "value_key_schema_version": VALUE_KEY_SCHEMA_VERSION,
                  "policy_input_boundary": "InformationState plus a public legal-candidate set; urza-policy has no direct dependency on urza-core/TrueState",
                  "selection_contract": "pending contingent decisions are mandatory; otherwise action class then public semantic key determine the choice; opaque execution token is only the final tie-break",
                  "hidden_information_contract": "unknown library order and raw execution ObjectId identity are unavailable to the policy crate",
                  "current_scope": "deterministic one-step policy selection kernel only",
                  "next_r5_work": "build the public ordinary-action candidate bridge over the accepted R4 execution actions, then deterministic rollout sequencing and Monte Carlo integration",
              });

              println!(
                  "{}",
                  serde_json::to_string_pretty(&report).expect("serializable R5 audit report")
              );
          }
          '''
          new = '''fn run_r5_audit() {
              validate_r4_database().expect("accepted R4 database remains frozen for R5");

              let report = json!({
                  "phase": "R5-candidate-bridge",
                  "policy_phase": POLICY_PHASE,
                  "policy_version": POLICY_VERSION,
                  "candidate_bridge_version": CANDIDATE_BRIDGE_VERSION,
                  "rules_version": RULES_VERSION,
                  "model_version": MODEL_VERSION,
                  "information_schema_version": INFORMATION_SCHEMA_VERSION,
                  "value_key_schema_version": VALUE_KEY_SCHEMA_VERSION,
                  "ordinary_action_families": ORDINARY_ACTION_FAMILY_COUNT,
                  "contingent_action_families": CONTINGENT_ACTION_FAMILY_COUNT,
                  "policy_input_boundary": "urza-policy still consumes only InformationState plus public PolicyCandidate records; execution-state and urza-rules dependencies live in the separate urza-policy-bridge crate",
                  "bridge_contract": "all accepted R4 Action families are mapped to collision-free public semantic keys and opaque decision-local tokens; selected tokens round-trip to exact execution Actions",
                  "selection_contract": "pending contingent decisions are mandatory; Transmute Artifact difference-payment preserves legal mana activations inside the contingent set; otherwise action class and exact public semantic key determine the choice",
                  "hidden_information_contract": "ordinary candidates are derived from InformationState-visible zones and canonical object classes; unknown library order and raw ObjectId numbering cannot affect public candidate identity",
                  "current_scope": "R5 public candidate bridge complete over the frozen R4 action surface",
                  "next_r5_work": "build deterministic multi-step rollout sequencing over CandidateBridge, then connect sampled-world Monte Carlo evaluation",
              });

              println!(
                  "{}",
                  serde_json::to_string_pretty(&report).expect("serializable R5 audit report")
              );
          }
          '''
          if old not in text:
              raise SystemExit('run_r5_audit block not found')
          main.write_text(text.replace(old, new, 1))
          PY
          sed -i 's/use urza_rules::{CardDatabase, apply_action};/use urza_rules::apply_action;/' rust/crates/urza-policy-bridge/src/lib.rs
      - name: Refresh lockfile
        working-directory: rust
        run: cargo check --workspace
      - name: Format
        working-directory: rust
        run: cargo fmt --all
      - name: Locked dependency graph
        working-directory: rust
        run: cargo metadata --locked --format-version 1 --no-deps > /dev/null
      - name: Strict clippy
        working-directory: rust
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Workspace tests
        working-directory: rust
        run: cargo test --locked --workspace --all-targets
      - name: Bench compile
        working-directory: rust
        run: cargo check --locked --workspace --benches
      - name: R0 through R5 audits
        working-directory: rust
        run: |
          cargo run --locked -p urza-cli -- r0-audit >/dev/null
          cargo run --locked -p urza-cli -- r1-audit >/dev/null
          cargo run --locked -p urza-cli -- r2-audit >/dev/null
          cargo run --locked -p urza-cli -- r3-audit >/dev/null
          cargo run --locked -p urza-cli -- r4-audit >/dev/null
          cargo run --locked -p urza-cli -- r5-audit
      - name: Record R5 candidate bridge checkpoint
        run: |
          cat > rust/R5_CANDIDATE_BRIDGE_CHECKPOINT.md <<'EOF'
          # R5 candidate bridge checkpoint

          ## Scope

          This checkpoint completes the public execution-to-policy candidate bridge over the frozen accepted R4 action surface. It does not broaden R4 rules or card coverage, and it does not begin multi-step rollout or Monte Carlo evaluation.

          ## Architecture boundary

          `urza-policy` remains isolated from `urza-core` and `urza-rules`. The separate `urza-policy-bridge` crate owns execution-side enumeration and exact `Action` round-tripping.

          Policy receives only `InformationState` plus `PolicyCandidate` records. Unknown library order, physical `ObjectId` numbering, and execution RNG provenance are not policy inputs.

          ## Exhaustive accepted action mapping

          The bridge maps the complete frozen R4 `Action` enum: 26 ordinary action families and 8 contingent action families. Every variant has a distinct public action-kind code.

          Public candidate identity preserves all strategically distinct public parameters, including six-component mana payments, canonical sources/targets/sacrifices, X values, Whir improvise multisets with multiplicity, permission slots/faces, Top reorder sequences, Scry top/bottom sequences, and optional/may choices.

          Equivalent physical actions collapse only when they have the same public canonical semantics. The selected opaque `ActionToken` maps back to one exact legal execution `Action` representative.

          ## Legality ownership

          The bridge does not duplicate the Rust rules engine. It generates choices from public visible state, then delegates final legality to the authoritative accepted R4 transition API on a cloned state. This dry-run RNG context is execution-only and never enters policy identity.

          During `Transmute Artifact` difference payment, mana abilities that are legal while the pending cost is unresolved remain in the candidate set and are classified as contingent choices, so the policy cannot accidentally filter them out.

          ## Canonical multiplicity

          `urza-info` now exposes an execution-side `resolve_canonical_objects` helper so a canonical equivalence class can map to all corresponding physical objects. This is necessary for costs such as Whir improvise that may consume multiple publicly equivalent permanents. `InformationState` itself is unchanged, so the frozen R4 information schema remains `information_state_v7_r4`.

          ## Namespaces

          - rules: `r4_acceptance_v6`;
          - model: `urza_model_r4c_2026_09_04`;
          - information: `information_state_v7_r4`;
          - ValueKey: `value_key_v7_r4`;
          - policy: `r5_candidate_contract_v2`;
          - candidate bridge: `r5_public_candidate_bridge_v1`.

          ## Acceptance

          Acceptance requires raw-ObjectId renaming invariance, hidden-library permutation invariance, exact payment/X/improvise preservation, canonical deduplication of equivalent source objects, pending Transmute mana continuation, full token round-trip, strict Clippy, workspace tests, benchmark compilation, and cumulative R0-R5 audits.

          ## Next R5 block

          Build deterministic multi-step rollout sequencing using `CandidateBridge` at every public decision point. Only after rollout determinism and replayability are accepted should `urza-mc` begin sampled-world evaluation.

          Python gameplay/policy logic remains out of scope.
          EOF
          cat >> rust/DEVELOPMENT_LOG.md <<'EOF'

          ## R5 candidate bridge

          Added the isolated `urza-policy-bridge` execution layer over the frozen R4 action surface. The bridge canonicalizes exact legal actions into public collision-free policy candidates, preserves all public payment/target/X/ordered-choice distinctions, deduplicates raw-object-equivalent choices, and round-trips opaque tokens to exact execution actions. Transmute difference-payment mana continuations are explicitly retained. R4 rules/model/info/value namespaces remain frozen; deterministic multi-step rollout is next.
          EOF
      - name: Remove temporary workflows
        run: git rm .github/workflows/r5-bridge-inspect.yml .github/workflows/r5-candidate-bridge-finalize.yml
      - name: Commit validated R5 candidate bridge
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rust .github/workflows
          git commit -m 'Checkpoint R5 public candidate bridge'
          git push origin HEAD:rust-engine-rebuild
