name: DACK v0.75 current-99 pooled simulation

on:
  push:
    branches:
      - dack-simulator-v0.75-current99
    paths:
      - dack_v0740_oracle_mana_audit.py
      - dack_v075_current99.py
      - dack_current99_batch.py
      - pool_dack_current99.py
      - .github/workflows/dack_v075_current99.yml

permissions:
  contents: write

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run selftest
        run: python dack_v075_current99.py
      - name: Run deterministic shard
        run: |
          mkdir -p shard
          python dack_current99_batch.py --shard ${{ matrix.shard }} --games 16 --out shard/shard_${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: dack-current99-shard-${{ matrix.shard }}
          path: shard/shard_${{ matrix.shard }}.json
          retention-days: 7

  pool:
    needs: simulate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dack-current99-shard-*
          path: shards
          merge-multiple: true
      - name: Pool compatible shards
        run: |
          python pool_dack_current99.py --glob 'shards/*.json' --json-out results/dack_v075_current99_n128.json --csv-out results/dack_v075_current99_n128_games.csv
      - name: Commit pooled checkpoint
        run: |
          git config user.name "DACK Simulator Bot"
          git config user.email "actions@users.noreply.github.com"
          git add results/dack_v075_current99_n128.json results/dack_v075_current99_n128_games.csv
          git commit -m "Add v0.75 current-99 N=128 pooled results" || exit 0
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: dack-current99-pooled-n128
          path: |
            results/dack_v075_current99_n128.json
            results/dack_v075_current99_n128_games.csv
          retention-days: 14
