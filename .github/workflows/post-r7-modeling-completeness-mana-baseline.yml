name: Post-R7 baseline mana completeness

on:
  push:
    branches:
      - rust-engine-rebuild
    paths:
      - '.github/workflows/post-r7-modeling-completeness-mana-baseline.yml'
      - 'rust/scripts/post_r7_modeling_completeness_mana_baseline_patch.py'
      - 'rust/crates/urza-cards/tests/post_r7_modeling_completeness_mana_baseline.rs'
      - 'rust/crates/urza-mulligan/src/bin/post-r7-modeling-completeness-gate.rs'
      - 'rust/data/goldfish_model_gate.v1.tsv'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  baseline-mana:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@1.89
        with:
          components: rustfmt, clippy
      - name: Apply baseline completeness promotion
        run: python rust/scripts/post_r7_modeling_completeness_mana_baseline_patch.py
      - name: Format check
        working-directory: rust
        run: cargo fmt --all -- --check
      - name: Baseline mana fixtures
        working-directory: rust
        run: cargo test --locked -p urza-cards --test post_r7_modeling_completeness_mana_baseline
      - name: Gate unit test
        working-directory: rust
        run: cargo test --locked -p urza-mulligan --bin post-r7-modeling-completeness-gate
      - name: Strict Clippy
        working-directory: rust
        run: |
          cargo clippy --locked -p urza-cards --tests -- -D warnings
          cargo clippy --locked -p urza-mulligan --bin post-r7-modeling-completeness-gate -- -D warnings
      - name: Record updated inventory
        working-directory: rust
        run: cargo run --quiet --locked -p urza-mulligan --bin post-r7-modeling-completeness-gate -- --inventory > POST_R7_MODELING_COMPLETENESS_GATE_RESULT.md
      - name: Assert expected remaining red gate
        working-directory: rust
        run: |
          set -euo pipefail
          if cargo run --quiet --locked -p urza-mulligan --bin post-r7-modeling-completeness-gate -- --enforce > ../modeling-enforce.txt 2>&1; then
            echo 'gate unexpectedly green before backlog is cleared' >&2
            exit 1
          fi
          grep -q $'MODELING_COMPLETENESS_GATE\ttotal=95\tresolved=4\tunresolved=91' ../modeling-enforce.txt
          grep -q 'MODELING_COMPLETENESS_GATE_RED: 91 unresolved active identities remain' ../modeling-enforce.txt
      - name: Commit baseline promotion
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            rust/data/goldfish_model_gate.v1.tsv \
            rust/crates/urza-mulligan/src/bin/post-r7-modeling-completeness-gate.rs \
            rust/POST_R7_MODELING_COMPLETENESS_GATE_RESULT.md
          git commit -m '[R7] Resolve baseline mana completeness tranche'
          git push
