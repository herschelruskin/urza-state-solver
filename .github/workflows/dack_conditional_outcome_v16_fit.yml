name: DACK v16 conditional outcome forest vs constant win-rate prior
on:
  push:
    branches: [dack-counterfactual-engine-v1-20261030]
    paths:
      - '.github/workflows/dack_conditional_outcome_v16_fit.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fit:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dack-counterfactual-engine-v1-20261030
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify new outcome learner is purely information-set conditional
        run: |
          python -m compileall -q dack_mulligan_outcome_forest_v16_20261031.py dack_simulator/validation/train_conditional_outcome_forest_v16.py
          python dack_mulligan_outcome_forest_v16_20261031.py
      - name: Install fit-only scikit-learn
        run: python -m pip install 'scikit-learn>=1.4,<2'
      - name: Fit T1 T2 T3 probabilistic classifier with 144 independent train hands and 40 validation hands
        run: |
          python -u dack_simulator/validation/train_conditional_outcome_forest_v16.py \
            --root datasets/true_v5_kept_futures_v14 \
            --model models/dack_v16_conditional_outcomes_EXPERIMENTAL.json \
            --report benchmark_results/v16_true_outcome_forest_diagnostic.json
      - name: Ensure no model promotion and explicit comparison to constant-prior predictor
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('models/dack_v16_conditional_outcomes_EXPERIMENTAL.json').read_text())
          r=json.loads(Path('benchmark_results/v16_true_outcome_forest_diagnostic.json').read_text())
          assert m['deployed_policy_approved'] is False
          assert r['distinct_train_hands']==144 and r['distinct_validation_hands']==40
          assert r['outcome_labels_train']==576 and r['outcome_labels_validation']==160
          assert len(m['trees'])==96
          assert r['model_approved'] is False
          assert 'constant_class_rate_baseline' in r['validation_results']
          print('V16_CONDITIONAL_OUTCOME_FIT_PHYSICAL_PASS',r['Brier_forest_minus_constant'],flush=True)
          PY
      - name: Archive diagnostic probability model and separate conditional-outcome validation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f models/dack_v16_conditional_outcomes_EXPERIMENTAL.json benchmark_results/v16_true_outcome_forest_diagnostic.json
          git commit -m "Archive v16 conditional T1/T2/T3 outcome forest and independent v5-kept-hand baseline comparison"
          git pull --rebase origin dack-counterfactual-engine-v1-20261030
          git push origin HEAD:dack-counterfactual-engine-v1-20261030
      - uses: actions/upload-artifact@v4
        with:
          name: dack-v16-conditional-outcome-probability-diagnostic
          path: |
            models/dack_v16_conditional_outcomes_EXPERIMENTAL.json
            benchmark_results/v16_true_outcome_forest_diagnostic.json
          retention-days: 21
