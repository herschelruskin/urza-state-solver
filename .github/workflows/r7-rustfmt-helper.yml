name: R7 rustfmt helper

on:
  push:
    branches: [rust-engine-rebuild]
    paths:
      - '.github/workflows/r7-rustfmt-helper.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89
        with:
          components: rustfmt
      - name: Repair Rust 1.89 constness
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/^const fn search_target_rank(/fn search_target_rank(/' rust/crates/urza-policy/src/lib.rs
      - name: Format workspace
        working-directory: rust
        run: cargo fmt --all
      - name: Commit repair if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No repair changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust
          git commit -m "[R7] Fix policy constness and keep workspace formatted"
          git push
