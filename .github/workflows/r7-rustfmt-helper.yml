name: R7 rustfmt helper

on:
  push:
    branches: [rust-engine-rebuild]
    paths:
      - '.github/workflows/r7-rustfmt-helper.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89
        with:
          components: rustfmt
      - name: Format workspace
        working-directory: rust
        run: cargo fmt --all
      - name: Commit formatting if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No formatting changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust
          git commit -m "[R7] Apply rustfmt after policy diagnostics"
          git push
