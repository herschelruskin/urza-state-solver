name: DACK exact terminal witness v4 parity

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m compileall -q dack_mulligan_terminal_witness_v1_20261031.py dack_paired_counterfactual_v4_witness_20261031.py dack_simulator/validation/test_terminal_witness_v1.py dack_simulator/validation/benchmark_terminal_witness_parity_v1.py
          python -m unittest discover -s dack_simulator/validation -p test_terminal_witness_v1.py -v
          python dack_paired_counterfactual_v4_witness_20261031.py --audit

  parity:
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        include:
          - game_id: 0
            variant: one_key_34
          - game_id: 1
            variant: one_key_34
          - game_id: 2
            variant: everflow_plains_35
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compare strict v3 vs accelerated v4 on all London decisions
        run: |
          python -u dack_simulator/validation/benchmark_terminal_witness_parity_v1.py \
            --game-id ${{ matrix.game_id }} --variant ${{ matrix.variant }}
