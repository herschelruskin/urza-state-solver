name: R5 adaptive cache finalize

on:
  push:
    branches:
      - rust-engine-rebuild
    paths:
      - .github/workflows/r5-adaptive-cache-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rust-engine-rebuild
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy
      - name: Apply adaptive integration
        run: python3 .github/r5_adaptive_patch.py
      - name: Refresh lockfile
        working-directory: rust
        run: cargo generate-lockfile
      - name: Format
        working-directory: rust
        run: cargo fmt --all
      - name: Locked dependency graph
        working-directory: rust
        run: cargo metadata --locked --no-deps --format-version 1 > /dev/null
      - name: Strict clippy
        working-directory: rust
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Workspace tests
        working-directory: rust
        run: cargo test --workspace --all-features --locked
      - name: Bench compile
        working-directory: rust
        run: cargo bench --workspace --no-run --locked
      - name: R0 through R5 audits
        working-directory: rust
        run: |
          cargo run -p urza-cli --locked -- r0-audit
          cargo run -p urza-cli --locked -- r1-audit
          cargo run -p urza-cli --locked -- r2-audit
          cargo run -p urza-cli --locked -- r3-audit
          cargo run -p urza-cli --locked -- r4-audit
          cargo run -p urza-cli --locked -- r5-audit
      - name: Mark dedicated validation
        run: printf '\n## Validation\n\nValidated by the dedicated R5 adaptive/cache acceptance workflow. The exact run and closure commit are recorded by the follow-up branch commit after this gate is green.\n' >> rust/R5_ADAPTIVE_CACHE_CHECKPOINT.md
      - name: Remove temporary acceptance files
        run: |
          rm .github/workflows/r5-adaptive-cache-finalize.yml
          rm .github/r5_adaptive_patch.py
      - name: Commit validated adaptive cache integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Close R5 adaptive cache checkpoint'
          git push origin HEAD:rust-engine-rebuild
