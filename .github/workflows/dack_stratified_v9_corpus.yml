name: DACK v9 stratified real beam labels 32 train + 32 calibration
on:
  push:
    branches: [dack-counterfactual-engine-v1-20261030]
    paths:
      - '.github/workflows/dack_stratified_v9_corpus.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - split: train
            start: 20200
          - split: train
            start: 20204
          - split: train
            start: 20208
          - split: train
            start: 20212
          - split: train
            start: 20216
          - split: train
            start: 20220
          - split: train
            start: 20224
          - split: train
            start: 20228
          - split: calibration
            start: 30200
          - split: calibration
            start: 30204
          - split: calibration
            start: 30208
          - split: calibration
            start: 30212
          - split: calibration
            start: 30216
          - split: calibration
            start: 30220
          - split: calibration
            start: 30224
          - split: calibration
            start: 30228
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Sample naturally dealt and fast-card-conditioned seven-card hands
        run: |
          python -u dack_simulator/validation/generate_stratified_london_labels_v9.py \
            --split ${{ matrix.split }} --start ${{ matrix.start }} \
            --games 4 --candidates 2 --draws 4 \
            --out datasets/v9_${{ matrix.split }}_${{ matrix.start }}.jsonl.gz
      - name: Assert complete physical subset and enriched sampling tags
        run: |
          python - <<'PY'
          import gzip,glob,json,collections
          paths=glob.glob('datasets/*.jsonl.gz')
          assert len(paths)==1,paths
          with gzip.open(paths[0],'rt') as fp:
              m=json.loads(next(fp));rows=[json.loads(s) for s in fp]
          assert m['sampling_conditional_fast_core'] and m['not_population_representative']
          assert m['beam']==160 and m['games']==4
          assert len({x['game_id'] for x in rows})==4
          assert all(x['selection_protocol']=='DACK-OFFLINE-STRATIFIED-V9' for x in rows)
          assert all('sampled_order' not in x and 'hidden_order' not in x for x in rows)
          assert all(sum(x['unknown_counts'].values())==92 for x in rows)
          print('V9_REAL_SHARD_VALIDATED',len(rows),
                dict(collections.Counter(x['label_turn'] for x in rows)),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v9-real-${{ matrix.split }}-${{ matrix.start }}
          path: datasets/
          retention-days: 14
  coverage_and_fit:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: v9-real-*
          merge-multiple: true
          path: corpus/
      - name: Aggregate coverage and verify disjoint label groups
        id: coverage
        run: |
          python - <<'PY'
          from collections import Counter
          import gzip,glob,json,os
          from pathlib import Path
          report={'schema':'dack_real_stratified_v9_coverage',
                  'not_population_representative':True,
                  'NOT_REAL_WIN_RATE':True,'splits':{}}
          groups_by_split=[]
          for split,base in [('train',20200),('calibration',30200)]:
              files=sorted(glob.glob(f'corpus/v9_{split}_*.jsonl.gz'))
              assert len(files)==8,(split,files)
              counts=Counter();strata=Counter();ids=set()
              for path in files:
                  with gzip.open(path,'rt') as fp:
                      meta=json.loads(next(fp))
                      assert meta['split']==split and meta['sampling_protocol']=='DACK-OFFLINE-STRATIFIED-V9'
                      for line in fp:
                          row=json.loads(line)
                          assert row['type']=='label'
                          counts[row['label_turn']]+=1
                          strata[row['selection_stratum']]+=1
                          ids.add(row['game_id'])
              assert ids==set(range(base,base+32)),(split,len(ids))
              groups_by_split.append(ids)
              report['splits'][split]={
                  'n_scenarios':len(ids),'labels':sum(counts.values()),
                  'turn_counts':{str(k):counts[k] for k in range(4)},
                  'stratum_labels':dict(strata)}
          assert not groups_by_split[0]&groups_by_split[1]
          ready=all(min(v['turn_counts'].values())>=8 for v in report['splits'].values())
          report['sufficient_four_class_fit_coverage']=ready
          report['status']='EXPERIMENTAL_FIT_ALLOWED' if ready else 'MORE_RARE_CLASS_LABELS_NEEDED'
          report['warning']='Fast-card stratum oversampled; naive model calibration is mixture-specific, NOT representative of naturally dealt or policy-kept hands.'
          Path('benchmark_results').mkdir(exist_ok=True)
          Path('benchmark_results/v9_stratified_coverage.json').write_text(json.dumps(report,indent=2)+'\n')
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('fit_ready='+('true' if ready else 'false')+'\n')
          print('STRATIFIED_V9_CORPUS_COVERAGE',json.dumps(report,sort_keys=True),flush=True)
          PY
      - name: Install offline-only scikit-learn
        if: steps.coverage.outputs.fit_ready == 'true'
        run: python -m pip install 'scikit-learn>=1.4,<2'
      - name: Fit experimental enriched-mixture model, NOT a deployment-calibrated model
        if: steps.coverage.outputs.fit_ready == 'true'
        run: |
          python -u dack_simulator/validation/train_offline_london_v8.py \
            --train corpus/v9_train_*.jsonl.gz \
            --calibration corpus/v9_calibration_*.jsonl.gz \
            --model models/v9_enriched_diagnostic_only.json \
            --report benchmark_results/v9_enriched_calibration_diagnostic_only.json
      - name: Warn explicitly that enrichment is not a calibrated deployment prior
        run: |
          echo 'DO NOT PROMOTE: enriched training / calibration outcomes reflect forced fast-hand strata, not naturally dealt or policy-kept hands.'
      - uses: actions/upload-artifact@v4
        with:
          name: dack-v9-stratified-real-coverage-and-experimental-model
          path: |
            benchmark_results/
            models/
          retention-days: 14
