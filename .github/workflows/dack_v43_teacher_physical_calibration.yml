name: DACK v43 read-only physical same-hand v5-v27 calibration on 100 archived conflicts
on:
  push:
    branches: [dack-v43-v5-candidate-mechanism-20261101]
    paths:
      - '.github/workflows/dack_v43_teacher_physical_calibration.yml'
permissions:
  contents: write
jobs:
  compare_identical_hands:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dack-v43-v5-candidate-mechanism-20261101
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: No new gameplay; recover per-hand 32 physical KEEP values with exact bottom parity
        run: |
          python -m py_compile dack_simulator/validation/v43_readonly_teacher_vs_physical.py
          python -u dack_simulator/validation/v43_readonly_teacher_vs_physical.py
      - name: Archive research-only physically scored teacher/student valuation mismatch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f benchmark_results/v43_v5_v27_same_hand_physical_K_calibration.json
          git commit -m "Archive v43 original-v5 versus v27 same-hand physical-value discrepancy"
          git pull --rebase origin dack-v43-v5-candidate-mechanism-20261101
          git push origin HEAD:dack-v43-v5-candidate-mechanism-20261101
