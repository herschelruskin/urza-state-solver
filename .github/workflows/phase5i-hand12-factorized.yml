name: Phase 5I hand 12 factorized

on:
  push:
    branches:
      - phase5i-hand12-factorized
  workflow_dispatch:

jobs:
  world:
    strategy:
      fail-fast: false
      matrix:
        sample_id: [0,1,2]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile hand 12 world evaluator
        run: python -m py_compile phase5i_hand12_world_eval.py
      - name: Evaluate hand 12 world
        run: python phase5i_hand12_world_eval.py --sample-id ${{ matrix.sample_id }}
      - uses: actions/upload-artifact@v4
        with:
          name: phase5i-hand12-world-${{ matrix.sample_id }}
          path: phase5i_hand12_world_*.json

  reduce:
    needs: world
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          pattern: phase5i-hand12-world-*
          path: worlds
          merge-multiple: true
      - name: Compile reducer
        run: python -m py_compile phase5i_hand12_reduce.py
      - name: Reduce exact three-world value
        run: python phase5i_hand12_reduce.py
      - uses: actions/upload-artifact@v4
        with:
          name: phase5i-human-hand-12
          path: phase5i_human_hand_12.json
