name: Phase 5 deduced library knowledge

on:
  push:
    branches:
      - phase5-deduced-library-knowledge
  pull_request:
    branches:
      - phase5-bounded-two-step-q
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile information slice
        run: |
          python -m py_compile information_state_propagation.py
          python -m py_compile phase5_deduced_library_knowledge_smoke.py
      - name: Deduced membership regression
        run: python phase5_deduced_library_knowledge_smoke.py
      - name: Information propagation regressions
        run: |
          python information_state_propagation_smoke.py
          python opening_information_state_smoke.py
          python phase4_hidden_world_smoke.py
      - name: Strategic identity regressions
        run: |
          python strategic_value_state_smoke.py
          python non_oracle_runtime_value_key_smoke.py
      - name: Bounded Q regressions
        run: |
          python phase5_contingent_tutor_q_smoke.py
          python phase5_selective_tutor_q_smoke.py
          python phase5_monte_carlo_cache_smoke.py
      - name: Benchmark and acceptance regressions
        run: |
          python human_benchmark_fixture_smoke.py
          python phase1_acceptance_smoke.py
      - name: Diff check
        run: git diff --check
