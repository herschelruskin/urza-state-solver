name: Post-R7 targeted permission direct materialization

on:
  push:
    branches:
      - rust-modeling/shared-primitives
    paths:
      - '.github/workflows/post-r7-targeted-permission-materialize.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize-targeted-permissions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.89
        with:
          components: rustfmt, clippy
      - name: Verify exact shard ancestry
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD df19087b828dcf9b2a116a4dbe6ee65b55196a8e)" = df19087b828dcf9b2a116a4dbe6ee65b55196a8e
      - name: Materialize reviewed Rust source edits
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          RULES = Path("rust/crates/urza-rules/src/lib.rs")
          BRIDGE = Path("rust/crates/urza-policy-bridge/src/lib.rs")

          def block(*lines):
              return "\n".join(lines) + "\n"

          def replace_once(path, old, new):
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one exact match, found {count}: {old[:120]!r}")
              path.write_text(text.replace(old, new, 1))

          def regex_once(path, pattern, replacement):
              text = path.read_text()
              new, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"{path}: expected one regex match, found {count}: {pattern[:120]!r}")
              path.write_text(new)

          replace_once(
              RULES,
              'pub const POST_R7_RULES_VERSION: &str = "post_r7_modeling_completeness_v2_rules_active_repair";',
              'pub const POST_R7_RULES_VERSION: &str = "post_r7_modeling_completeness_v3_targeted_permissions";',
          )

          replace_once(
              RULES,
              block(
                  "    CastWhir {",
                  "        card: CardDefId,",
                  "        x_value: u16,",
                  "        payment: ManaPayment,",
                  "        improvise_sources: Vec<ObjectId>,",
                  "    },",
              ),
              block(
                  "    CastTargetedLibraryTop {",
                  "        card: CardDefId,",
                  "        target: CanonicalObjectId,",
                  "        payment: ManaPayment,",
                  "    },",
                  "    CastWhir {",
                  "        card: CardDefId,",
                  "        x_value: u16,",
                  "        payment: ManaPayment,",
                  "        improvise_sources: Vec<ObjectId>,",
                  "    },",
              ),
          )

          replace_once(
              RULES,
              block(
                  "    CastCommander {",
                  "        payment: ManaPayment,",
                  "    },",
              ),
              block(
                  "    PlayUrzaPermissionTargeted {",
                  "        permission_slot: u16,",
                  "        target: CanonicalObjectId,",
                  "    },",
                  "    CastCommander {",
                  "        payment: ManaPayment,",
                  "    },",
              ),
          )

          hand_arm = block(
              "        Action::CastTargetedFromHand {",
              "            card,",
              "            target,",
              "            payment,",
              "        } => {",
              "            cast_targeted_from_hand(state, cards, card, target, payment)?;",
              "            Transition::default()",
              "        }",
          )
          replace_once(
              RULES,
              hand_arm,
              hand_arm + block(
                  "        Action::CastTargetedLibraryTop {",
                  "            card,",
                  "            target,",
                  "            payment,",
                  "        } => {",
                  "            cast_targeted_library_top(state, cards, card, target, payment)?;",
                  "            Transition::default()",
                  "        }",
              ),
          )

          aura_arm = block(
              "        Action::PlayUrzaPermissionAura {",
              "            permission_slot,",
              "            target,",
              "        } => play_urza_permission_aura(state, cards, permission_slot, target)?,",
          )
          replace_once(
              RULES,
              aura_arm,
              aura_arm + block(
                  "        Action::PlayUrzaPermissionTargeted {",
                  "            permission_slot,",
                  "            target,",
                  "        } => play_urza_permission_targeted(state, cards, permission_slot, target)?,",
              ),
          )

          targeted_permission = block(
              "fn play_urza_permission_targeted<D: CardDatabase>(",
              "    state: &mut TrueState,",
              "    cards: &D,",
              "    permission_slot: u16,",
              "    target: CanonicalObjectId,",
              ") -> Result<Transition, RuleError> {",
              "    let permission_id = resolve_permission_slot(state, permission_slot)",
              "        .map_err(|error| match error {",
              "            urza_info::ObservationError::InvalidState(error) => RuleError::InvalidState(error),",
              "        })?",
              "        .ok_or(RuleError::MissingPermissionSlot(permission_slot))?;",
              "    let permission = state",
              "        .urza_permissions",
              "        .iter()",
              "        .find(|permission| permission.permission_id == permission_id)",
              "        .cloned()",
              "        .ok_or(RuleError::MissingPermissionSlot(permission_slot))?;",
              "    if permission.expires_turn < state.turn {",
              "        return Err(RuleError::MissingPermissionSlot(permission_slot));",
              "    }",
              "    if !state.exile.cards().contains(&permission.card) {",
              "        return Err(RuleError::PermissionCardNotInExile);",
              "    }",
              "    let (_, target) =",
              "        targeted_spell_profile_and_target(state, cards, permission.card, target)?;",
              "    let object_id = next_object_id(state)?;",
              "    let removed = state.exile.remove_one(permission.card);",
              "    debug_assert!(removed);",
              "    push_targeted_spell(state, cards, object_id, permission.card, target);",
              "    consume_permission(state, permission_id);",
              "    Ok(Transition::default())",
              "}",
              "",
          )
          replace_once(
              RULES,
              "fn cast_from_hand<D: CardDatabase>(\n",
              targeted_permission + "fn cast_from_hand<D: CardDatabase>(\n",
          )

          targeted_block = "\n".join([
              "fn cast_targeted_from_hand<D: CardDatabase>(",
              "    state: &mut TrueState,",
              "    cards: &D,",
              "    card: CardDefId,",
              "    target: CanonicalObjectId,",
              "    payment: ManaPayment,",
              ") -> Result<(), RuleError> {",
              "    if !state.hand.cards().contains(&card) {",
              "        return Err(RuleError::CardNotInHand(card));",
              "    }",
              "    let (profile, target) = targeted_spell_profile_and_target(state, cards, card, target)?;",
              "    let cost = profile",
              "        .mana_cost",
              "        .ok_or(RuleError::UnsupportedCardMechanic(card))?;",
              "    validate_payment(state.mana, payment, cost)?;",
              "    let object_id = next_object_id(state)?;",
              "    spend_payment(&mut state.mana, payment);",
              "    let removed = state.hand.remove_one(card);",
              "    debug_assert!(removed);",
              "    push_targeted_spell(state, cards, object_id, card, target);",
              "    Ok(())",
              "}",
              "",
              "fn cast_targeted_library_top<D: CardDatabase>(",
              "    state: &mut TrueState,",
              "    cards: &D,",
              "    card: CardDefId,",
              "    target: CanonicalObjectId,",
              "    payment: ManaPayment,",
              ") -> Result<(), RuleError> {",
              "    if !top_play_permission_active(state, cards) {",
              "        return Err(RuleError::LibraryTopPermissionUnavailable);",
              "    }",
              "    if library_cast_blocked_by_cage(state, cards) {",
              "        return Err(RuleError::LibraryCastBlockedByCage);",
              "    }",
              "    if state.library.cards().first().copied() != Some(card) {",
              "        return Err(RuleError::LibraryTopPermissionUnavailable);",
              "    }",
              "    let (profile, target) = targeted_spell_profile_and_target(state, cards, card, target)?;",
              "    let mut cost = profile",
              "        .mana_cost",
              "        .ok_or(RuleError::UnsupportedCardMechanic(card))?;",
              "    cost.generic = cost",
              "        .generic",
              "        .saturating_sub(library_spell_generic_reduction(state, cards)?);",
              "    validate_payment(state.mana, payment, cost)?;",
              "    let object_id = next_object_id(state)?;",
              "    spend_payment(&mut state.mana, payment);",
              "    remove_library_top_without_draw(state)?;",
              "    push_targeted_spell(state, cards, object_id, card, target);",
              "    Ok(())",
              "}",
              "",
              "fn targeted_spell_profile_and_target<D: CardDatabase>(",
              "    state: &TrueState,",
              "    cards: &D,",
              "    card: CardDefId,",
              "    target: CanonicalObjectId,",
              ") -> Result<(CardProfile, SourceRef), RuleError> {",
              "    ensure_priority(state)?;",
              "    ensure_no_pending_decision(state)?;",
              "    let profile = card_profile(cards, card)?;",
              "    if profile.role != R2CardRole::TargetedEffectSpell",
              "        || profile.spell_effect != SpellEffectKind::KnackBounceGrant",
              "    {",
              "        return Err(RuleError::UnsupportedCardMechanic(card));",
              "    }",
              "    let target_id = resolve_canonical_object(state, target)",
              "        .map_err(|error| match error {",
              "            urza_info::ObservationError::InvalidState(error) => RuleError::InvalidState(error),",
              "        })?",
              "        .ok_or(RuleError::MissingCanonicalPermanent(target))?;",
              "    let target_permanent = battlefield_permanent(state, target_id)?.clone();",
              "    if !permanent_is_creature(cards, &target_permanent)? {",
              "        return Err(RuleError::InvalidPermanentTarget);",
              "    }",
              "    Ok((",
              "        profile,",
              "        SourceRef {",
              "            object_id: Some(target_id),",
              "            card: target_permanent.card,",
              "        },",
              "    ))",
              "}",
              "",
              "fn push_targeted_spell<D: CardDatabase>(",
              "    state: &mut TrueState,",
              "    cards: &D,",
              "    object_id: ObjectId,",
              "    card: CardDefId,",
              "    target: SourceRef,",
              ") {",
              "    state.stack.push(StackObject::TargetedSpell {",
              "        object_id,",
              "        card,",
              "        target,",
              "    });",
              "    queue_cast_triggers(state, cards, card);",
              "    state.spell_cast_this_turn = true;",
              "    state.window = Window::Priority;",
              "}",
              "",
              "fn resolve_aura_target",
          ])
          regex_once(
              RULES,
              r"fn cast_targeted_from_hand<D: CardDatabase>\(.*?\n\}\n\nfn resolve_aura_target",
              targeted_block,
          )

          replace_once(
              BRIDGE,
              'pub const CANDIDATE_BRIDGE_VERSION: &str = "post_r7_public_candidate_bridge_v5_modeling_repair";\npub const ORDINARY_ACTION_FAMILY_COUNT: usize = 29;',
              'pub const CANDIDATE_BRIDGE_VERSION: &str = "post_r7_public_candidate_bridge_v6_targeted_permissions";\npub const ORDINARY_ACTION_FAMILY_COUNT: usize = 31;',
          )
          replace_once(
              BRIDGE,
              "const KIND_CHOOSE_TRIGGER_ORDER: u16 = 38;\n",
              "const KIND_CHOOSE_TRIGGER_ORDER: u16 = 38;\nconst KIND_CAST_TARGETED_LIBRARY_TOP: u16 = 39;\nconst KIND_PLAY_URZA_PERMISSION_TARGETED: u16 = 40;\n",
          )

          top_cast = block(
              "        if let Some(cost) = profile.mana_cost {",
              "            for payment in enumerate_payments(information.mana, cost) {",
              "                actions.push(Action::CastLibraryTop { card, payment });",
              "            }",
              "        }",
          )
          replace_once(
              BRIDGE,
              top_cast,
              top_cast + block(
                  "        if profile.spell_effect != SpellEffectKind::None {",
                  "            for target in &canonical_targets {",
                  "                for payment in &all_payments {",
                  "                    actions.push(Action::CastTargetedLibraryTop {",
                  "                        card,",
                  "                        target: *target,",
                  "                        payment: *payment,",
                  "                    });",
                  "                }",
                  "            }",
                  "        }",
              ),
          )

          permission_targets = block(
              "        for target in &canonical_targets {",
              "            actions.push(Action::PlayUrzaPermissionAura {",
              "                permission_slot: permission.permission_slot,",
              "                target: *target,",
              "            });",
              "        }",
          )
          replace_once(
              BRIDGE,
              permission_targets,
              block(
                  "        for target in &canonical_targets {",
                  "            actions.push(Action::PlayUrzaPermissionAura {",
                  "                permission_slot: permission.permission_slot,",
                  "                target: *target,",
                  "            });",
                  "            actions.push(Action::PlayUrzaPermissionTargeted {",
                  "                permission_slot: permission.permission_slot,",
                  "                target: *target,",
                  "            });",
                  "        }",
              ),
          )

          replace_once(
              BRIDGE,
              "        | Action::CastTargetedFromHand { .. }\n        | Action::CastWhir { .. }",
              "        | Action::CastTargetedFromHand { .. }\n        | Action::CastTargetedLibraryTop { .. }\n        | Action::CastWhir { .. }",
          )
          replace_once(
              BRIDGE,
              "        | Action::PlayUrzaPermissionAura { .. }\n        | Action::CastCommander { .. } => PolicyActionClass::CastSpell,",
              "        | Action::PlayUrzaPermissionAura { .. }\n        | Action::PlayUrzaPermissionTargeted { .. }\n        | Action::CastCommander { .. } => PolicyActionClass::CastSpell,",
          )

          hand_key = block(
              "        Action::CastTargetedFromHand {",
              "            card,",
              "            target,",
              "            payment,",
              "        } => spell_key(",
              "            KIND_CAST_TARGETED_FROM_HAND,",
              "            *card,",
              "            Some(*target),",
              "            None,",
              "            payment_detail(*payment),",
              "        ),",
          )
          replace_once(
              BRIDGE,
              hand_key,
              hand_key + block(
                  "        Action::CastTargetedLibraryTop {",
                  "            card,",
                  "            target,",
                  "            payment,",
                  "        } => spell_key(",
                  "            KIND_CAST_TARGETED_LIBRARY_TOP,",
                  "            *card,",
                  "            Some(*target),",
                  "            None,",
                  "            payment_detail(*payment),",
                  "        ),",
              ),
          )

          aura_key = block(
              "        Action::PlayUrzaPermissionAura {",
              "            permission_slot,",
              "            target,",
              "        } => PolicyPublicKey {",
              "            kind: KIND_PLAY_URZA_PERMISSION_AURA,",
              "            card: Some(permission_card(information, *permission_slot)?),",
              "            target: Some(*target),",
              "            parameter: Some(*permission_slot),",
              "            ..PolicyPublicKey::default()",
              "        },",
          )
          replace_once(
              BRIDGE,
              aura_key,
              aura_key + block(
                  "        Action::PlayUrzaPermissionTargeted {",
                  "            permission_slot,",
                  "            target,",
                  "        } => PolicyPublicKey {",
                  "            kind: KIND_PLAY_URZA_PERMISSION_TARGETED,",
                  "            card: Some(permission_card(information, *permission_slot)?),",
                  "            target: Some(*target),",
                  "            parameter: Some(*permission_slot),",
                  "            ..PolicyPublicKey::default()",
                  "        },",
              ),
          )
          replace_once(
              BRIDGE,
              "assert_eq!(ORDINARY_ACTION_FAMILY_COUNT, 29);",
              "assert_eq!(ORDINARY_ACTION_FAMILY_COUNT, 31);",
          )
          PY
      - name: Format check after materialization
        working-directory: rust
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
      - name: Workspace all-target compile
        working-directory: rust
        run: cargo check --locked --workspace --all-targets
      - name: Targeted permission fixtures
        working-directory: rust
        run: |
          cargo test --locked -p urza-cards --test post_r7_shared_primitives_targeted_permission_zones
          cargo test --locked -p urza-policy-bridge --test post_r7_shared_primitives_targeted_permission_zones
      - name: Shared-primitives regressions
        working-directory: rust
        run: |
          cargo test --locked -p urza-cards --test post_r7_modeling_completeness_rules_active_repair_v1
          cargo test --locked -p urza-policy-bridge --test post_r7_modeling_completeness_rules_active_repair_v1
          cargo test --locked -p urza-cards --test post_r7_modeling_completeness_forensic_gadgeteer
          cargo test --locked -p urza-rules
          cargo test --locked -p urza-cards --test r4_final_acceptance
          cargo test --locked -p urza-cards --test r4_terminal_acceptance
      - name: Strict Clippy
        working-directory: rust
        run: |
          cargo clippy --locked -p urza-core --all-targets -- -D warnings
          cargo clippy --locked -p urza-rules --all-targets -- -D warnings
          cargo clippy --locked -p urza-cards --all-targets -- -D warnings
          cargo clippy --locked -p urza-policy-bridge --all-targets -- -D warnings
      - name: Preserve authoritative completeness baseline
        run: |
          git diff --exit-code -- rust/data/goldfish_model_gate.v1.tsv rust/crates/urza-mulligan/src/bin/post-r7-modeling-completeness-gate.rs rust/POST_R7_MODELING_COMPLETENESS_GATE_RESULT.md rust/POST_R7_PARALLEL_MODELING_COMPLETENESS_TRACKER.md
      - name: Commit direct Rust source only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rust/crates/urza-rules/src/lib.rs rust/crates/urza-policy-bridge/src/lib.rs
          git diff --cached --quiet && { echo 'no source changes'; exit 1; }
          git commit -m '[R7] Unify targeted casting across permission zones'
          git push origin HEAD:rust-modeling/shared-primitives
