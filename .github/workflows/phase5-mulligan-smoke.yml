name: Phase 5 mulligan DP smoke

on:
  push:
    branches:
      - phase5-mulligan-dp
  pull_request:
    branches:
      - phase4-monte-carlo-root-eval
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile Phase 5 mulligan layer
        run: |
          python -m py_compile phase5_mulligan.py phase5_mulligan_smoke.py
      - name: Sequential London mulligan DP
        run: python phase5_mulligan_smoke.py
      - name: Phase 4B Monte Carlo regression
        run: python phase4_monte_carlo_smoke.py
      - name: Phase 4A hidden-world regression
        run: python phase4_hidden_world_smoke.py
      - name: Phase 3 value regression
        run: python phase3_value_engine_smoke.py
      - name: Human benchmark integrity
        run: python human_benchmark_fixture_smoke.py
      - name: Strategic value-key regressions
        run: |
          python strategic_value_state_smoke.py
          python non_oracle_runtime_value_key_smoke.py
          python runtime_pending_value_key_smoke.py
      - name: Phase 1/2 architecture gates
        run: |
          python phase2_runtime_smoke.py
          python phase1_acceptance_smoke.py
      - name: Diff check
        run: git diff --check
