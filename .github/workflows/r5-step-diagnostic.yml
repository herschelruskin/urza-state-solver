name: R5 rollout step diagnostic

on:
  push:
    branches:
      - rust-engine-rebuild
    paths:
      - .github/workflows/r5-step-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
      - name: Materialize exact-state comparison
        run: |
          cat > rust/crates/urza-mc/examples/r5_artifact_state_diag.rs <<'RS'
          use urza_cards::{R4CardDatabase, load_r1_catalog};
          use urza_core::{CardDefId, CardZone, ManaPool, Phase, TrueLibrary, TrueState, Window};
          use urza_mc::sample_hidden_world;
          use urza_policy::DeterministicPolicy;
          use urza_policy_bridge::CandidateBridge;
          use urza_rng::{LogicalEventId, RootSeed, WorldId};
          use urza_rules::{GameRngContext, apply_action_with_rng};

          const WORLD: WorldId = WorldId(20480);
          const ROOT_SEED_U64: u64 = 0x5235_5045_5246_0001;

          fn main() -> Result<(), Box<dyn std::error::Error>> {
              let cards = R4CardDatabase::load()?;
              let policy = DeterministicPolicy;
              let root = RootSeed::from_u64(ROOT_SEED_U64);
              let template = build_artifact_state(&cards)?;
              let sampled = sample_hidden_world(&template, root, WORLD)?;
              let bridge = CandidateBridge::build(&sampled, &cards)?;
              let mut roots = bridge.candidates().to_vec();
              roots.sort_by(|left, right| {
                  (left.class, &left.key, left.token).cmp(&(right.class, &right.key, right.token))
              });
              let root_candidate = &roots[0];
              println!("root class={:?} key={:?}", root_candidate.class, root_candidate.key);
              let root_action = bridge.resolved_action(root_candidate.token).ok_or("missing root")?;
              let mut state = sampled.clone();
              apply_action_with_rng(
                  &mut state,
                  &cards,
                  root_action,
                  GameRngContext { root, world: WORLD, logical_event: LogicalEventId(0) },
              )?;

              let mut snapshot: Option<TrueState> = None;
              for step in 1_u64..=14 {
                  let bridge = CandidateBridge::build(&state, &cards)?;
                  let token = policy.choose(bridge.information(), bridge.candidates())?.ok_or("no candidate")?;
                  let selected = bridge.candidates().iter().find(|candidate| candidate.token == token).ok_or("missing selected")?;
                  let action = bridge.resolved_action(token).ok_or("missing action")?;
                  println!(
                      "pre step={} mana={:?} stack={:?} pending={:?} battlefield={:?} hand={:?} choice_class={:?} choice_key={:?} action={:?}",
                      step,
                      state.mana,
                      state.stack,
                      state.pending,
                      state.battlefield.permanents(),
                      state.hand,
                      selected.class,
                      selected.key,
                      action,
                  );

                  if snapshot.is_none() && state.stack.is_empty() && !state.battlefield.is_empty() {
                      println!("CAPTURE step={} mana={:?}", step, state.mana);
                      snapshot = Some(state.clone());
                  }

                  apply_action_with_rng(
                      &mut state,
                      &cards,
                      action,
                      GameRngContext { root, world: WORLD, logical_event: LogicalEventId(step) },
                  )?;

                  if let Some(first) = &snapshot {
                      if state.stack.is_empty() && !state.battlefield.is_empty() {
                          println!("COMPARE after_step={} exact_equal={} mana_now={:?} mana_first={:?}", step, state == *first, state.mana, first.mana);
                          if state != *first {
                              println!(
                                  "DIFF turn={} phase={} window={} life={} library={} hand={} battlefield={} graveyard={} exile={} mana={} land={} commander={} stack={} pending={} delayed={} permissions={} spell_cast={} rng_cursor={}",
                                  state.turn == first.turn,
                                  state.phase == first.phase,
                                  state.window == first.window,
                                  state.life == first.life,
                                  state.library == first.library,
                                  state.hand == first.hand,
                                  state.battlefield == first.battlefield,
                                  state.graveyard == first.graveyard,
                                  state.exile == first.exile,
                                  state.mana == first.mana,
                                  state.land_played_this_turn == first.land_played_this_turn,
                                  state.commander == first.commander,
                                  state.stack == first.stack,
                                  state.pending == first.pending,
                                  state.delayed_events == first.delayed_events,
                                  state.urza_permissions == first.urza_permissions,
                                  state.spell_cast_this_turn == first.spell_cast_this_turn,
                                  state.rng_occurrence_cursor == first.rng_occurrence_cursor,
                              );
                          }
                      }
                  }
              }
              Ok(())
          }

          fn build_artifact_state(cards: &R4CardDatabase) -> Result<TrueState, Box<dyn std::error::Error>> {
              let catalog = load_r1_catalog()?;
              let mut library = Vec::new();
              for card in catalog.cards.iter().filter(|card| !card.commander) {
                  for _ in 0..card.deck_count {
                      library.push(CardDefId(card.id));
                  }
              }
              let names = [
                  "Mana Vault",
                  "Sol Ring",
                  "Grim Monolith",
                  "Basalt Monolith",
                  "Voltaic Key",
                  "Sensei's Divining Top",
                  "Grinding Station",
              ];
              let mut hand = Vec::new();
              for name in names {
                  let card = cards.card_id_by_name(name)?;
                  let index = library.iter().position(|candidate| *candidate == card).ok_or("benchmark card absent")?;
                  library.remove(index);
                  hand.push(card);
              }
              let state = TrueState {
                  turn: 1,
                  phase: Phase::PrecombatMain,
                  window: Window::Priority,
                  library: TrueLibrary::unknown(library),
                  hand: CardZone::new(hand),
                  mana: ManaPool { blue: 2, colorless: 4, ..ManaPool::default() },
                  ..TrueState::default()
              };
              state.validate()?;
              Ok(state)
          }
          RS
      - name: Run exact-state comparison
        working-directory: rust
        run: cargo run -p urza-mc --example r5_artifact_state_diag --release --locked
