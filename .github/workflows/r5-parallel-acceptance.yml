name: R5 parallel root-world acceptance

on:
  push:
    branches: [rust-engine-rebuild]
    paths:
      - 'rust/crates/urza-mc/**'
      - '.github/workflows/r5-parallel-acceptance.yml'

permissions:
  contents: write

jobs:
  parallel-acceptance:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rust-engine-rebuild
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/rust/target/
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all
      - name: Locked dependency graph
        run: cargo metadata --locked --format-version 1 > /dev/null
      - name: Strict Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Parallel parity regressions
        run: cargo test -p urza-mc --locked parallel::tests -- --nocapture
      - name: Full workspace tests
        run: cargo test --workspace --all-features --locked
      - name: Bench compile
        run: cargo bench --workspace --no-run --locked
      - name: Build release performance probe
        run: cargo build -p urza-mc --example r5_perf_probe --release --locked
      - name: Parallel performance matrix three times
        run: |
          for run in 1 2 3; do
            echo "=== R5_PARALLEL_PERF_RUN_${run} ==="
            ./target/release/examples/r5_perf_probe
          done
      - name: R0-R5 audits
        run: |
          cargo run -p urza-cli -- r0-audit
          cargo run -p urza-cli -- r1-audit
          cargo run -p urza-cli -- r2-audit
          cargo run -p urza-cli -- r3-audit
          cargo run -p urza-cli -- r4-audit
          cargo run -p urza-cli -- r5-audit
      - name: Record validated closure and remove temporary workflow
        working-directory: .
        run: |
          cat >> rust/R5_PARALLEL_ROOT_WORLD_CHECKPOINT.md <<EOF

          Dedicated acceptance run: GitHub Actions ${GITHUB_RUN_ID}, result PASS. The gate passed formatting, locked dependency metadata, strict all-target/all-feature Clippy, dedicated serial/parallel parity regressions, full workspace tests, benchmark compilation, three release performance probes, and cumulative R0-R5 audits.
          EOF
          cat >> rust/DEVELOPMENT_LOG.md <<EOF

          ## R5 parallel root/world evaluation

          Added deterministic scoped-thread execution for independent sampled root/world jobs while retaining serial fixed-budget evaluation as the correctness oracle. Parallel workers never mutate caches or aggregate values; completed outcomes are canonically reordered before scoring. Serial and parallel adaptive paths share cache identity and deterministic counters. Acceptance includes one/multi/oversubscribed-worker parity, world-order and hidden-order invariance, cross-scheduler cache reuse, zero-worker rejection, and representative release performance probes. Namespace: r5_parallel_root_world_v1. Dedicated validation run: ${GITHUB_RUN_ID}.
          EOF
          rm -f .github/workflows/r5-parallel-acceptance.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rust/crates/urza-mc rust/crates/urza-cli/src/main.rs rust/R5_PARALLEL_ROOT_WORLD_CHECKPOINT.md rust/DEVELOPMENT_LOG.md .github/workflows/r5-parallel-acceptance.yml
          git status --short
          git commit -m 'Close R5 parallel root-world checkpoint'
          git push origin HEAD:rust-engine-rebuild
