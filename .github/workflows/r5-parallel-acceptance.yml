name: R5 parallel root-world acceptance

on:
  push:
    branches: [rust-engine-rebuild]
    paths:
      - 'rust/crates/urza-mc/**'
      - '.github/workflows/r5-parallel-acceptance.yml'

permissions:
  contents: read

jobs:
  parallel-acceptance:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rust-engine-rebuild
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy
      - name: Locked dependency graph
        run: cargo metadata --locked --format-version 1 > /dev/null
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Strict Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Parallel parity regressions
        run: cargo test -p urza-mc --locked parallel::tests -- --nocapture
      - name: Full workspace tests
        run: cargo test --workspace --all-features --locked
      - name: Bench compile
        run: cargo bench --workspace --no-run --locked
      - name: Build release performance probe
        run: cargo build -p urza-mc --example r5_perf_probe --release --locked
      - name: Parallel performance matrix three times
        run: |
          for run in 1 2 3; do
            echo "=== R5_PARALLEL_PERF_RUN_${run} ==="
            ./target/release/examples/r5_perf_probe
          done
      - name: R0-R5 audits
        run: |
          cargo run -p urza-cli -- r0-audit
          cargo run -p urza-cli -- r1-audit
          cargo run -p urza-cli -- r2-audit
          cargo run -p urza-cli -- r3-audit
          cargo run -p urza-cli -- r4-audit
          cargo run -p urza-cli -- r5-audit
