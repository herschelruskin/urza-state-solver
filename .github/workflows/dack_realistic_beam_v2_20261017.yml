name: Dack Realistic Beam v2 T2 T3 horizon matched N32
on:
  push:
    branches: [dack-realistic-information-beam-20261017]
    paths:
      - 'dack_realistic_information_beam_v2_20261017.py'
      - 'dack_realistic_information_beam_v2_pool_20261017.py'
      - '.github/workflows/dack_realistic_beam_v2_20261017.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
env:
  PYTHONHASHSEED: '0'
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile and test secret-order invariance for two-turn horizon
        run: |
          python -m py_compile dack_realistic_information_beam_v2_20261017.py dack_realistic_information_beam_v2_pool_20261017.py
          python -u dack_realistic_information_beam_v2_20261017.py --audit
      - name: End-to-end paired T2 T3 planning smoke
        run: |
          for variant in current buck_worldmap; do
            python -u dack_realistic_information_beam_v2_20261017.py \
              --variant "$variant" --shard 0 --games 1 --beam 100 \
              --pass-cap 6 --buck-cap 2 --draw-samples 2 \
              --rollout-beam 32 --rollout-depth 14 \
              --t3-samples 2 --t2-continuations 2 \
              --out "smoke_$variant.json.gz"
          done
      - name: Validate no uncommitted roll and identical game seeds
        run: |
          python - <<'PY'
          import gzip,json
          with gzip.open('smoke_current.json.gz','rt') as f:a=json.load(f)
          with gzip.open('smoke_buck_worldmap.json.gz','rt') as f:b=json.load(f)
          x=a['rows'][0];y=b['rows'][0]
          assert x['seed']==y['seed'] and x['seat']==y['seat']
          assert x['game_id']==y['game_id']==0
          assert x['win_turn'] in range(4) and y['win_turn'] in range(4)
          assert x['rolls']==[]
          assert all(1<=roll<=4 for roll in y['rolls'])
          assert x['planning_counts']['rollout_calls']>0
          print('REALISTIC_BEAM_V2_PAIRED_SMOKE_PASS',flush=True)
          PY
  shard:
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        variant: [current, buck_worldmap]
        shard: [0,1,2,3,4,5,6,7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Evaluate 4 games with two-turn planning and hidden future draws
        run: |
          mkdir -p v2shards
          python -u dack_realistic_information_beam_v2_20261017.py \
            --variant "${{ matrix.variant }}" --shard "${{ matrix.shard }}" --games 4 \
            --beam 120 --pass-cap 9 --buck-cap 3 \
            --draw-samples 3 --rollout-beam 42 --rollout-depth 18 \
            --t3-samples 2 --t2-continuations 2 \
            --out "v2shards/${{ matrix.variant }}_shard_${{ matrix.shard }}.json.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: dack-beam-v2-${{ matrix.variant }}-${{ matrix.shard }}
          path: v2shards/*.json.gz
          retention-days: 60
          if-no-files-found: error
  pool:
    needs: [smoke,shard]
    if: ${{ needs.smoke.result == 'success' && needs.shard.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: dack-beam-v2-*
          path: v2shards
      - name: Download matched Realistic Beam v1 source-game artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p v1shards
          gh run download 39037402299 --repo "${{ github.repository }}" \
            --pattern 'realistic-beam-*' --dir v1shards
          test "$(find v1shards -name '*.json.gz' | wc -l)" -eq 32
          test "$(find v2shards -name '*.json.gz' | wc -l)" -eq 16
      - name: Pool paired v2/v1 and World Map/Bucknard rates
        run: |
          python -u dack_realistic_information_beam_v2_pool_20261017.py \
            --n 32 --v2 v2shards --v1 v1shards \
            --out dack_realistic_beam_v2_n32_20261017.json
      - uses: actions/upload-artifact@v4
        with:
          name: dack-realistic-beam-v2-n32-paired-result
          path: dack_realistic_beam_v2_n32_20261017.json
          retention-days: 90
          if-no-files-found: error
      - name: Publish v2 comparison
        run: |
          mkdir -p benchmark_results
          cp dack_realistic_beam_v2_n32_20261017.json \
             benchmark_results/dack_realistic_beam_v2_n32_20261017.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add benchmark_results/dack_realistic_beam_v2_n32_20261017.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publish realistic information beam two-turn pilot'
            git pull --rebase origin dack-realistic-information-beam-20261017
            git push
          fi
