name: R4 recurrence builder

on:
  push:
    branches: [rust-engine-rebuild]
    paths:
      - .github/workflows/r4-recurrence-builder.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rust-engine-rebuild
          fetch-depth: 0
      - name: Recover and apply R4 patcher
        shell: bash
        run: |
          git show d17c9256c30796a45e90aa91e7e646adf11dfa01:.github/workflows/r4-recurrence-builder.yml \
            | sed -n "/python3 - <<'PY'/,/^          PY$/p" \
            | sed '1d;$d;s/^          //' > /tmp/r4_builder.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('/tmp/r4_builder.py')
          text = path.read_text()
          for anchor in ["aura_target: urza_rules::AuraTargetKind::None,\\n                    native_untap_generic: None,", "top_loop_producer: false,\\n                    skip_normal_untap: false,"]:
              pos = text.find(anchor)
              if pos < 0:
                  raise SystemExit(f'missing builder anchor: {anchor}')
              tail = text.find('minimum=2)', pos)
              if tail < 0:
                  raise SystemExit(f'missing builder minimum after: {anchor}')
              text = text[:tail] + 'minimum=1)' + text[tail + len('minimum=2)'):]
          path.write_text(text)
          PY
          set +e
          python3 -m py_compile /tmp/r4_builder.py > /tmp/r4-builder.log 2>&1
          rc=$?
          if [ "$rc" -eq 0 ]; then
            python3 /tmp/r4_builder.py >> /tmp/r4-builder.log 2>&1
            rc=$?
          fi
          set -e
          cat /tmp/r4-builder.log
          if [ "$rc" -ne 0 ]; then
            cp /tmp/r4-builder.log .github/r4_builder_error.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/r4_builder_error.txt
            git commit -m "Record R4 builder failure"
            git push origin HEAD:rust-engine-rebuild
            exit "$rc"
          fi
      - name: Correct recurrence edge cases
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('rust/crates/urza-rules/src/lib.rs')
          text = path.read_text()
          text = text.replace('summoning_sick: profile.is_creature,\n            token: true,\n            counters:', 'summoning_sick: false,\n            token: true,\n            counters:', 1)
          old = '    state.stack.push(StackObject::Spell {\n        object_id,\n        card: permission.card,\n        x_value: matches!(\n            profile.special_search,\n            SpecialSearchKind::Whir | SpecialSearchKind::Reshape\n        )\n        .then_some(0),\n    });\n    state.spell_cast_this_turn = true;'
          new = old.replace('    state.spell_cast_this_turn = true;', '    queue_cast_triggers(state, cards, permission.card);\n    state.spell_cast_this_turn = true;')
          text = text.replace(old, new, 1)
          old = '    state.stack.push(StackObject::AuraSpell {\n        object_id,\n        card: permission.card,\n        target: SourceRef {\n            object_id: Some(target_object),\n            card: target_card,\n        },\n    });\n    state.spell_cast_this_turn = true;'
          new = old.replace('    state.spell_cast_this_turn = true;', '    queue_cast_triggers(state, cards, permission.card);\n    state.spell_cast_this_turn = true;')
          text = text.replace(old, new, 1)
          path.write_text(text)
          path = Path('rust/crates/urza-core/src/state.rs')
          text = path.read_text()
          old = '                StackObject::ControlledTrigger { .. }\n                | StackObject::ActivatedAbility { .. }\n                | StackObject::TargetedActivatedAbility { .. } => continue,'
          new = '                StackObject::ControlledTrigger { .. }\n                | StackObject::TargetedControlledTrigger { .. }\n                | StackObject::ActivatedAbility { .. }\n                | StackObject::TargetedActivatedAbility { .. } => continue,'
          if old not in text:
              raise SystemExit('missing exact-object targeted trigger validation anchor')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Validate Rust workspace
        shell: bash
        run: |
          set +e
          : > /tmp/r4-validation.log
          (cd rust && cargo fmt --all) >> /tmp/r4-validation.log 2>&1
          rc=$?
          if [ "$rc" -eq 0 ]; then
            (cd rust && cargo test --workspace) >> /tmp/r4-validation.log 2>&1
            rc=$?
          fi
          if [ "$rc" -eq 0 ]; then
            (cd rust && cargo clippy --workspace --all-targets -- -D warnings) >> /tmp/r4-validation.log 2>&1
            rc=$?
          fi
          set -e
          cat /tmp/r4-validation.log
          if [ "$rc" -ne 0 ]; then
            cp /tmp/r4-validation.log .github/r4_builder_error.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/r4_builder_error.txt
            git commit -m "Record R4 validation failure"
            git push origin HEAD:rust-engine-rebuild
            exit "$rc"
          fi
      - name: Commit validated recurrence slice
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/r4-recurrence-builder.yml .github/r4_builder_error.txt
          git add rust
          git commit -m "Build R4 recurrence and trigger execution"
          git push origin HEAD:rust-engine-rebuild
