name: R4 recurrence builder

on:
  push:
    branches: [rust-engine-rebuild]
    paths:
      - .github/workflows/r4-recurrence-builder.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rust-engine-rebuild
          fetch-depth: 0
      - name: Apply guarded R4 recurrence patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              found = text.count(old)
              if found < count:
                  raise SystemExit(f"{path}: expected at least {count} occurrences, found {found}: {old[:100]!r}")
              text = text.replace(old, new, count)
              p.write_text(text)

          def replace_all(path, old, new, minimum=1):
              p = Path(path)
              text = p.read_text()
              found = text.count(old)
              if found < minimum:
                  raise SystemExit(f"{path}: expected at least {minimum} occurrences, found {found}: {old[:100]!r}")
              p.write_text(text.replace(old, new))

          # Namespace bumps: observable stack/pending state expands in this slice.
          replace('rust/crates/urza-core/src/lib.rs',
                  'pub const MODEL_VERSION: &str = "urza_model_r4b_2026_09_01";',
                  'pub const MODEL_VERSION: &str = "urza_model_r4c_2026_09_04";')
          replace('rust/crates/urza-info/src/lib.rs',
                  'pub const INFORMATION_SCHEMA_VERSION: &str = "information_state_v6_r4";',
                  'pub const INFORMATION_SCHEMA_VERSION: &str = "information_state_v7_r4";')
          replace('rust/crates/urza-value/src/lib.rs',
                  'pub const VALUE_KEY_SCHEMA_VERSION: &str = "value_key_v6_r4";',
                  'pub const VALUE_KEY_SCHEMA_VERSION: &str = "value_key_v7_r4";')

          # ---- urza-core: exact targeted spell/trigger state + recurrence decisions ----
          path = 'rust/crates/urza-core/src/state.rs'
          replace(path,
              '    TezzeretTarget,\n    TriggerOrder,',
              '    TezzeretTarget,\n    ProducerUntapChoice,\n    CamTarget,\n    CamEffect,\n    TriggerOrder,')
          replace(path,
              '    TezzeretTarget {\n        source: SourceRef,\n    },\n    TriggerOrder {',
              '    TezzeretTarget {\n        source: SourceRef,\n    },\n    ProducerUntapChoice {\n        source: SourceRef,\n    },\n    CamTarget {\n        source: SourceRef,\n    },\n    CamEffect {\n        source: SourceRef,\n        target: SourceRef,\n    },\n    TriggerOrder {')
          replace(path,
              '            Self::TezzeretTarget { .. } => PendingDecisionKind::TezzeretTarget,\n            Self::TriggerOrder { .. } => PendingDecisionKind::TriggerOrder,',
              '            Self::TezzeretTarget { .. } => PendingDecisionKind::TezzeretTarget,\n            Self::ProducerUntapChoice { .. } => PendingDecisionKind::ProducerUntapChoice,\n            Self::CamTarget { .. } => PendingDecisionKind::CamTarget,\n            Self::CamEffect { .. } => PendingDecisionKind::CamEffect,\n            Self::TriggerOrder { .. } => PendingDecisionKind::TriggerOrder,')
          replace(path,
              '            | Self::TezzeretTarget { source }\n            | Self::TriggerOrder { source, .. }',
              '            | Self::TezzeretTarget { source }\n            | Self::ProducerUntapChoice { source }\n            | Self::CamTarget { source }\n            | Self::CamEffect { source, .. }\n            | Self::TriggerOrder { source, .. }')
          replace(path,
              '    AuraSpell {\n        object_id: ObjectId,\n        card: CardDefId,\n        target: SourceRef,\n    },\n    ControlledTrigger {',
              '    AuraSpell {\n        object_id: ObjectId,\n        card: CardDefId,\n        target: SourceRef,\n    },\n    TargetedSpell {\n        object_id: ObjectId,\n        card: CardDefId,\n        target: SourceRef,\n    },\n    ControlledTrigger {')
          replace(path,
              '    ControlledTrigger {\n        source: SourceRef,\n        ability: AbilityId,\n    },\n    ActivatedAbility {',
              '    ControlledTrigger {\n        source: SourceRef,\n        ability: AbilityId,\n    },\n    TargetedControlledTrigger {\n        source: SourceRef,\n        ability: AbilityId,\n        target: SourceRef,\n    },\n    ActivatedAbility {')
          replace(path,
              '                StackObject::Spell { object_id, .. } | StackObject::AuraSpell { object_id, .. } => {\n                    *object_id\n                }',
              '                StackObject::Spell { object_id, .. }\n                | StackObject::AuraSpell { object_id, .. }\n                | StackObject::TargetedSpell { object_id, .. } => *object_id,')
          replace(path,
              '            StackObject::Spell { .. } => None,\n            StackObject::AuraSpell { target, .. } => Some(*target),\n            StackObject::ControlledTrigger { source, .. }\n            | StackObject::ActivatedAbility { source, .. } => Some(*source),\n            StackObject::TargetedActivatedAbility { source, .. } => Some(*source),',
              '            StackObject::Spell { .. } => None,\n            StackObject::AuraSpell { target, .. } | StackObject::TargetedSpell { target, .. } => {\n                Some(*target)\n            }\n            StackObject::ControlledTrigger { source, .. }\n            | StackObject::TargetedControlledTrigger { source, .. }\n            | StackObject::ActivatedAbility { source, .. }\n            | StackObject::TargetedActivatedAbility { source, .. } => Some(*source),')
          replace(path,
              '            StackObject::TargetedActivatedAbility { target, .. } => Some(*target),\n            _ => None,',
              '            StackObject::TargetedControlledTrigger { target, .. }\n            | StackObject::TargetedActivatedAbility { target, .. } => Some(*target),\n            _ => None,')

          # ---- urza-info: project the new public distinctions ----
          path = 'rust/crates/urza-info/src/lib.rs'
          replace(path,
              '    AuraSpell,\n    ControlledTrigger,\n    ActivatedAbility,\n    TargetedActivatedAbility,',
              '    AuraSpell,\n    TargetedSpell,\n    ControlledTrigger,\n    TargetedControlledTrigger,\n    ActivatedAbility,\n    TargetedActivatedAbility,')
          replace(path,
              '    TezzeretTarget {\n        source: ObservedSourceRef,\n    },\n    TriggerOrder {',
              '    TezzeretTarget {\n        source: ObservedSourceRef,\n    },\n    ProducerUntapChoice {\n        source: ObservedSourceRef,\n    },\n    CamTarget {\n        source: ObservedSourceRef,\n    },\n    CamEffect {\n        source: ObservedSourceRef,\n        target: ObservedSourceRef,\n    },\n    TriggerOrder {')
          replace(path,
              '            Self::TezzeretTarget { .. } => PendingDecisionKind::TezzeretTarget,\n            Self::TriggerOrder { .. } => PendingDecisionKind::TriggerOrder,',
              '            Self::TezzeretTarget { .. } => PendingDecisionKind::TezzeretTarget,\n            Self::ProducerUntapChoice { .. } => PendingDecisionKind::ProducerUntapChoice,\n            Self::CamTarget { .. } => PendingDecisionKind::CamTarget,\n            Self::CamEffect { .. } => PendingDecisionKind::CamEffect,\n            Self::TriggerOrder { .. } => PendingDecisionKind::TriggerOrder,')
          replace(path,
              '            StackObject::AuraSpell { card, target, .. } => ObservedStackObject {\n                kind: ObservedStackKind::AuraSpell,\n                card: Some(*card),\n                source: None,\n                target: Some(observe_source(*target, &object_classes)),\n                ability: None,\n                parameter: None,\n            },\n            StackObject::ControlledTrigger { source, ability } => ObservedStackObject {',
              '            StackObject::AuraSpell { card, target, .. } => ObservedStackObject {\n                kind: ObservedStackKind::AuraSpell,\n                card: Some(*card),\n                source: None,\n                target: Some(observe_source(*target, &object_classes)),\n                ability: None,\n                parameter: None,\n            },\n            StackObject::TargetedSpell { card, target, .. } => ObservedStackObject {\n                kind: ObservedStackKind::TargetedSpell,\n                card: Some(*card),\n                source: None,\n                target: Some(observe_source(*target, &object_classes)),\n                ability: None,\n                parameter: None,\n            },\n            StackObject::ControlledTrigger { source, ability } => ObservedStackObject {')
          replace(path,
              '            StackObject::ActivatedAbility {\n                source,\n                ability,\n                parameter,\n            } => ObservedStackObject {',
              '            StackObject::TargetedControlledTrigger { source, ability, target } => {\n                ObservedStackObject {\n                    kind: ObservedStackKind::TargetedControlledTrigger,\n                    card: None,\n                    source: Some(observe_source(*source, &object_classes)),\n                    target: Some(observe_source(*target, &object_classes)),\n                    ability: Some(*ability),\n                    parameter: None,\n                }\n            }\n            StackObject::ActivatedAbility {\n                source,\n                ability,\n                parameter,\n            } => ObservedStackObject {')
          replace(path,
              '        PendingDecision::TezzeretTarget { source } => ObservedPendingDecision::TezzeretTarget {\n            source: observe_source(*source, object_classes),\n        },\n        PendingDecision::TriggerOrder {',
              '        PendingDecision::TezzeretTarget { source } => ObservedPendingDecision::TezzeretTarget {\n            source: observe_source(*source, object_classes),\n        },\n        PendingDecision::ProducerUntapChoice { source } => {\n            ObservedPendingDecision::ProducerUntapChoice {\n                source: observe_source(*source, object_classes),\n            }\n        }\n        PendingDecision::CamTarget { source } => ObservedPendingDecision::CamTarget {\n            source: observe_source(*source, object_classes),\n        },\n        PendingDecision::CamEffect { source, target } => ObservedPendingDecision::CamEffect {\n            source: observe_source(*source, object_classes),\n            target: observe_source(*target, object_classes),\n        },\n        PendingDecision::TriggerOrder {')
          replace(path,
              '            StackObject::Spell { .. } => {}\n            StackObject::AuraSpell { card, target, .. } => {',
              '            StackObject::Spell { .. } => {}\n            StackObject::AuraSpell { card, target, .. }\n            | StackObject::TargetedSpell { card, target, .. } => {')
          replace(path,
              '            StackObject::ActivatedAbility {\n                source,\n                ability,\n                parameter,\n            } => {',
              '            StackObject::TargetedControlledTrigger {\n                source,\n                ability,\n                target,\n            } => {\n                push_source_role(\n                    &mut roles,\n                    *source,\n                    ExternalRole::Stack {\n                        position,\n                        kind: 4,\n                        ability: *ability,\n                        parameter: None,\n                    },\n                );\n                push_source_role(\n                    &mut roles,\n                    *target,\n                    ExternalRole::StackAbilityTarget {\n                        position,\n                        ability: *ability,\n                    },\n                );\n            }\n            StackObject::ActivatedAbility {\n                source,\n                ability,\n                parameter,\n            } => {')
          replace(path,
              '        PendingDecision::TezzeretTarget { .. } => (11, 0, 0, Vec::new()),\n        PendingDecision::TriggerOrder { trigger_count, .. } => {',
              '        PendingDecision::TezzeretTarget { .. } => (11, 0, 0, Vec::new()),\n        PendingDecision::ProducerUntapChoice { .. } => (15, 0, 0, Vec::new()),\n        PendingDecision::CamTarget { .. } => (16, 0, 0, Vec::new()),\n        PendingDecision::CamEffect { target, .. } => (17, target.card.0, 0, Vec::new()),\n        PendingDecision::TriggerOrder { trigger_count, .. } => {')

          # ---- urza-rules: profiles, abilities, actions, execution ----
          path = 'rust/crates/urza-rules/src/lib.rs'
          replace(path, 'pub const RULES_VERSION: &str = "r4_top_access_v3";',
                        'pub const RULES_VERSION: &str = "r4_recurrence_v4";')
          replace(path,
              'pub const ABILITY_FTT_LEVEL_THREE: AbilityId = AbilityId(0x0405);',
              '''pub const ABILITY_FTT_LEVEL_THREE: AbilityId = AbilityId(0x0405);\npub const ABILITY_GRINDING_STATION_MILL: AbilityId = AbilityId(0x0406);\npub const ABILITY_ARTIFACT_ENTRY_UNTAP: AbilityId = AbilityId(0x0407);\npub const ABILITY_GADGETEER_INVESTIGATE: AbilityId = AbilityId(0x0408);\npub const ABILITY_CHROME_DOME_COPY: AbilityId = AbilityId(0x0409);\npub const ABILITY_CHROME_DOME_SACRIFICE: AbilityId = AbilityId(0x040a);\npub const ABILITY_FLOODCALLER_UNTAP: AbilityId = AbilityId(0x040b);\npub const ABILITY_CAM_TAP_UNTAP: AbilityId = AbilityId(0x040c);\npub const ABILITY_KNACK_BOUNCE: AbilityId = AbilityId(0x040d);''')
          replace(path,
              '    SearchSpell,\n    UrzaCommander,',
              '    SearchSpell,\n    TargetedEffectSpell,\n    UrzaCommander,')
          replace(path,
              '    GrindingStation,\n    BatteredGolem,',
              '    GrindingStation,\n    BatteredGolem,\n    ChromeDome,\n    ManaVault,\n    ValleyFloodcaller,')
          replace(path,
              '    GrafdiggersCage,\n}',
              '    GrafdiggersCage,\n    SewerVeillanceCam,\n}')
          insert_after = '''pub enum AuraTargetKind {\n    #[default]\n    None,\n    Artifact,\n}\n'''
          replace(path, insert_after, insert_after + '''\n#[derive(Debug, Clone, Copy, Default, PartialEq, Eq, Hash)]\npub enum SpellEffectKind {\n    #[default]\n    None,\n    KnackBounceGrant,\n}\n''')
          replace(path,
              '    pub aura_target: AuraTargetKind,\n    pub native_untap_generic: Option<u16>,',
              '    pub aura_target: AuraTargetKind,\n    pub spell_effect: SpellEffectKind,\n    pub native_untap_generic: Option<u16>,')
          replace(path,
              '    pub top_loop_producer: bool,\n    pub skip_normal_untap: bool,',
              '    pub top_loop_producer: bool,\n    pub floodcaller_untap_eligible: bool,\n    pub skip_normal_untap: bool,')
          replace(path,
              '    fn urza_construct_token_card(&self) -> CardDefId;\n}',
              '    fn urza_construct_token_card(&self) -> CardDefId;\n    fn clue_token_card(&self) -> Option<CardDefId> {\n        None\n    }\n}')
          replace(path,
              '#[derive(Debug, Clone, PartialEq, Eq, Hash)]\npub enum Action {',
              '''#[derive(Debug, Clone, Copy, PartialEq, Eq, Hash)]\npub enum CamEffectChoice {\n    Decline,\n    Tap,\n    Untap,\n}\n\n#[derive(Debug, Clone, PartialEq, Eq, Hash)]\npub enum Action {''')
          replace(path,
              '    ActivateUrzaArtifactMana {\n        artifact: ObjectId,\n    },\n    CastFromHand {',
              '''    ActivateUrzaArtifactMana {\n        artifact: ObjectId,\n    },\n    ActivateGrindingStation {\n        source: ObjectId,\n        sacrifice: CanonicalObjectId,\n    },\n    ActivateChromeDome {\n        source: ObjectId,\n        target: CanonicalObjectId,\n        payment: ManaPayment,\n    },\n    ActivateGrantedKnackBounce {\n        source: ObjectId,\n        target: CanonicalObjectId,\n    },\n    CastFromHand {''')
          replace(path,
              '    CastAuraFromHand {\n        card: CardDefId,\n        target: CanonicalObjectId,\n        payment: ManaPayment,\n    },',
              '''    CastAuraFromHand {\n        card: CardDefId,\n        target: CanonicalObjectId,\n        payment: ManaPayment,\n    },\n    CastTargetedFromHand {\n        card: CardDefId,\n        target: CanonicalObjectId,\n        payment: ManaPayment,\n    },''')
          replace(path,
              '    ChooseScry {\n        top: Vec<CardDefId>,\n        bottom: Vec<CardDefId>,\n    },\n}',
              '''    ChooseScry {\n        top: Vec<CardDefId>,\n        bottom: Vec<CardDefId>,\n    },\n    ChooseProducerUntap {\n        untap: bool,\n    },\n    ChooseCamTarget {\n        target: CanonicalObjectId,\n    },\n    ChooseCamEffect {\n        choice: CamEffectChoice,\n    },\n}''')
          replace(path,
              '    UrzaCardExiled {\n        card: CardDefId,\n    },\n}',
              '    UrzaCardExiled {\n        card: CardDefId,\n    },\n    OpponentMilled {\n        cards: u8,\n    },\n}')
          replace(path,
              '    #[error("the selected object is not a legal Reality Chip reconfigure target")]\n    InvalidReconfigureTarget,',
              '''    #[error("the selected object is not a legal Reality Chip reconfigure target")]\n    InvalidReconfigureTarget,\n    #[error("the selected object is not a legal permanent target")]\n    InvalidPermanentTarget,\n    #[error("object {0:?} is summoning sick for a granted tap ability")]\n    SummoningSick(ObjectId),\n    #[error("object {0:?} has an incoming attachment; bounce interaction is deferred")]\n    AttachedBounceDeferred(ObjectId),''')

          # Action dispatch.
          replace(path,
              '        Action::ActivateUrzaArtifactMana { artifact } => {\n            activate_urza_artifact_mana(state, cards, artifact)?;\n            Transition::default()\n        }\n        Action::CastFromHand { card, payment } => {',
              '''        Action::ActivateUrzaArtifactMana { artifact } => {\n            activate_urza_artifact_mana(state, cards, artifact)?;\n            Transition::default()\n        }\n        Action::ActivateGrindingStation { source, sacrifice } => {\n            activate_grinding_station(state, cards, source, sacrifice)?;\n            Transition::default()\n        }\n        Action::ActivateChromeDome { source, target, payment } => {\n            activate_chrome_dome(state, cards, source, target, payment)?;\n            Transition::default()\n        }\n        Action::ActivateGrantedKnackBounce { source, target } => {\n            activate_granted_knack_bounce(state, cards, source, target)?;\n            Transition::default()\n        }\n        Action::CastFromHand { card, payment } => {''')
          replace(path,
              '        Action::CastAuraFromHand {\n            card,\n            target,\n            payment,\n        } => {\n            cast_aura_from_hand(state, cards, card, target, payment)?;\n            Transition::default()\n        }',
              '''        Action::CastAuraFromHand {\n            card,\n            target,\n            payment,\n        } => {\n            cast_aura_from_hand(state, cards, card, target, payment)?;\n            Transition::default()\n        }\n        Action::CastTargetedFromHand {\n            card,\n            target,\n            payment,\n        } => {\n            cast_targeted_from_hand(state, cards, card, target, payment)?;\n            Transition::default()\n        }''')
          replace(path,
              '        Action::ChooseScry { top, bottom } => choose_scry(state, top, bottom)?,\n    };',
              '''        Action::ChooseScry { top, bottom } => choose_scry(state, top, bottom)?,\n        Action::ChooseProducerUntap { untap } => choose_producer_untap(state, untap)?,\n        Action::ChooseCamTarget { target } => choose_cam_target(state, cards, target)?,\n        Action::ChooseCamEffect { choice } => choose_cam_effect(state, choice)?,\n    };''')

          # Public contingent choices from InformationState only.
          replace(path,
              '        ObservedPendingDecision::ScryChoice { looked_at, .. } => {',
              '''        ObservedPendingDecision::ProducerUntapChoice { .. } => vec![\n            Action::ChooseProducerUntap { untap: true },\n            Action::ChooseProducerUntap { untap: false },\n        ],\n        ObservedPendingDecision::CamTarget { .. } => {\n            let mut seen = BTreeSet::new();\n            information\n                .battlefield\n                .iter()\n                .filter(|permanent| {\n                    cards\n                        .profile(permanent.card)\n                        .is_some_and(|profile| profile.is_creature)\n                })\n                .filter_map(|permanent| {\n                    seen.insert(permanent.canonical_id).then_some(Action::ChooseCamTarget {\n                        target: permanent.canonical_id,\n                    })\n                })\n                .collect()\n        }\n        ObservedPendingDecision::CamEffect { target, .. } => {\n            let tapped = target\n                .canonical_object\n                .and_then(|target_id| {\n                    information\n                        .battlefield\n                        .iter()\n                        .find(|permanent| permanent.canonical_id == target_id)\n                })\n                .map(|permanent| permanent.tapped);\n            match tapped {\n                Some(true) => vec![\n                    Action::ChooseCamEffect { choice: CamEffectChoice::Untap },\n                    Action::ChooseCamEffect { choice: CamEffectChoice::Decline },\n                ],\n                Some(false) => vec![\n                    Action::ChooseCamEffect { choice: CamEffectChoice::Tap },\n                    Action::ChooseCamEffect { choice: CamEffectChoice::Decline },\n                ],\n                None => vec![Action::ChooseCamEffect { choice: CamEffectChoice::Decline }],\n            }\n        }\n        ObservedPendingDecision::ScryChoice { looked_at, .. } => {''')

          # End-of-turn recurrence state and Chrome delayed trigger staging.
          replace(path,
              '        Phase::PrecombatMain => {\n            state.phase = Phase::EndStep;\n            state.window = Window::Priority;\n        }\n        Phase::EndStep => {\n            expire_urza_permissions(state);',
              '''        Phase::PrecombatMain => {\n            state.phase = Phase::EndStep;\n            queue_due_chrome_end_step_triggers(state);\n            state.window = Window::Priority;\n        }\n        Phase::EndStep => {\n            clear_end_of_turn_knack_grants(state);\n            expire_urza_permissions(state);''')

          # Expand the terminal catalog from 7 to 13 signatures.
          replace(path,
              '    TopGadgeteerProducer,\n}',
              '''    TopGadgeteerProducer,\n    ChromeDomeGrindingStation,\n    ChromeDomeBatteredGolem,\n    ChromeDomePaGadgeteerManaVault,\n    KnackHelixValleyFloodcaller,\n    KnackHelixBatteredGolem,\n    KnackHelixCam,\n}''')
          replace(path,
              '            Self::TopGadgeteerProducer => "Top + Gadgeteer + producer",\n        }',
              '''            Self::TopGadgeteerProducer => "Top + Gadgeteer + producer",\n            Self::ChromeDomeGrindingStation => "Chrome Dome + Grinding Station",\n            Self::ChromeDomeBatteredGolem => "Chrome Dome + Battered Golem",\n            Self::ChromeDomePaGadgeteerManaVault => "Chrome Dome + PA + Gadgeteer + Mana Vault",\n            Self::KnackHelixValleyFloodcaller => "Knack/Helix + Valley Floodcaller",\n            Self::KnackHelixBatteredGolem => "Knack/Helix + Battered Golem",\n            Self::KnackHelixCam => "Knack/Helix + Cam",\n        }''')

          # Insert new terminal checks after Urza presence and before the legacy families.
          marker = '''    if !urza_present {\n        return None;\n    }\n\n    for aura in &information.battlefield {'''
          terminal = '''    if !urza_present {\n        return None;\n    }\n\n    let chrome_permanents: Vec<_> = information\n        .battlefield\n        .iter()\n        .filter(|permanent| {\n            cards\n                .profile(permanent.card)\n                .is_some_and(|profile| profile.engine == EngineKind::ChromeDome)\n        })\n        .collect();\n    for chrome in &chrome_permanents {\n        let effective_cost = public_artifact_activation_generic_cost(information, cards, chrome, 5);\n        let mana_total = public_mana_total(information.mana);\n        let ready_station = information.battlefield.iter().any(|permanent| {\n            !permanent.tapped\n                && cards.profile(permanent.card).is_some_and(|profile| {\n                    profile.engine == EngineKind::GrindingStation\n                })\n        });\n        if ready_station && mana_total >= u32::from(effective_cost) {\n            return Some(WinFamily::ChromeDomeGrindingStation);\n        }\n        let ready_golem = information.battlefield.iter().any(|permanent| {\n            !permanent.tapped\n                && cards.profile(permanent.card).is_some_and(|profile| {\n                    profile.engine == EngineKind::BatteredGolem\n                })\n        });\n        if ready_golem && mana_total >= u32::from(effective_cost) {\n            return Some(WinFamily::ChromeDomeBatteredGolem);\n        }\n\n        let gadgeteer = information.battlefield.iter().any(|permanent| {\n            cards.profile(permanent.card).is_some_and(|profile| {\n                profile.engine == EngineKind::ForensicGadgeteer\n            })\n        });\n        let ready_vault = information.battlefield.iter().any(|permanent| {\n            !permanent.tapped\n                && cards.profile(permanent.card).is_some_and(|profile| {\n                    profile.engine == EngineKind::ManaVault\n                })\n        });\n        let power_artifact_attached = information.battlefield.iter().any(|permanent| {\n            cards.profile(permanent.card).is_some_and(|profile| {\n                profile.engine == EngineKind::PowerArtifact\n                    && permanent.attached_to == Some(chrome.canonical_id)\n            })\n        });\n        if gadgeteer && ready_vault && power_artifact_attached && effective_cost <= 2 {\n            return Some(WinFamily::ChromeDomePaGadgeteerManaVault);\n        }\n    }\n\n    let ready_granted: Vec<_> = information\n        .battlefield\n        .iter()\n        .filter(|permanent| {\n            permanent.granted_ability == Some(urza_core::GrantedAbility::KnackBounceUntilEndOfTurn)\n                && !permanent.tapped\n                && !permanent.summoning_sick\n        })\n        .collect();\n    let ready_cam = information.battlefield.iter().any(|permanent| {\n        !permanent.tapped\n            && cards.profile(permanent.card).is_some_and(|profile| {\n                profile.utility == UtilityKind::SewerVeillanceCam\n            })\n    });\n    if ready_cam && !ready_granted.is_empty() {\n        return Some(WinFamily::KnackHelixCam);\n    }\n\n    for granted in &ready_granted {\n        let Some(granted_profile) = cards.profile(granted.card) else {\n            continue;\n        };\n        let source_is_floodcaller = granted_profile.engine == EngineKind::ValleyFloodcaller;\n        let source_is_golem = granted_profile.engine == EngineKind::BatteredGolem;\n        if !source_is_floodcaller && !source_is_golem {\n            continue;\n        }\n        let replay = information.hand.iter().filter_map(|card| cards.profile(*card)).find(|profile| {\n            profile.is_artifact\n                && (!source_is_floodcaller || !profile.is_creature)\n                && profile.mana_cost.is_some_and(|cost| cost.required_total() <= 1)\n        });\n        let Some(replay) = replay else {\n            continue;\n        };\n        let positive = replay\n            .mana_cost\n            .is