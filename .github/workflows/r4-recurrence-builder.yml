name: R4 recurrence builder

on:
  push:
    branches: [rust-engine-rebuild]
    paths:
      - .github/workflows/r4-recurrence-builder.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rust-engine-rebuild
          fetch-depth: 0
      - name: Recover and apply R4 patcher
        shell: bash
        run: |
          git show d17c9256c30796a45e90aa91e7e646adf11dfa01:.github/workflows/r4-recurrence-builder.yml \
            | sed -n "/python3 - <<'PY'/,/^          PY$/p" \
            | sed '1d;$d;s/^          //' > /tmp/r4_builder.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('/tmp/r4_builder.py')
          text = path.read_text()
          for anchor in [
              "aura_target: urza_rules::AuraTargetKind::None,\\n                    native_untap_generic: None,",
              "top_loop_producer: false,\\n                    skip_normal_untap: false,",
          ]:
              pos = text.find(anchor)
              if pos < 0:
                  raise SystemExit(f'missing builder anchor: {anchor}')
              tail = text.find('minimum=2)', pos)
              if tail < 0:
                  raise SystemExit(f'missing builder minimum after: {anchor}')
              text = text[:tail] + 'minimum=1)' + text[tail + len('minimum=2)'):]
          path.write_text(text)
          PY
          set +e
          python3 -m py_compile /tmp/r4_builder.py > /tmp/r4-builder.log 2>&1
          rc=$?
          if [ "$rc" -eq 0 ]; then
            python3 /tmp/r4_builder.py >> /tmp/r4-builder.log 2>&1
            rc=$?
          fi
          set -e
          cat /tmp/r4-builder.log
          if [ "$rc" -ne 0 ]; then
            cp /tmp/r4-builder.log .github/r4_builder_error.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/r4_builder_error.txt
            git commit -m "Record R4 builder failure"
            git push origin HEAD:rust-engine-rebuild
            exit "$rc"
          fi
      - name: Correct recurrence edge cases
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('rust/crates/urza-rules/src/lib.rs')
          text = path.read_text()
          text = text.replace(
              'summoning_sick: profile.is_creature,\n            token: true,\n            counters:',
              'summoning_sick: false,\n            token: true,\n            counters:',
              1,
          )
          path.write_text(text)
          PY
      - name: Format
        working-directory: rust
        run: cargo fmt --all
      - name: Test workspace
        working-directory: rust
        run: cargo test --workspace
      - name: Strict clippy
        working-directory: rust
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Commit validated recurrence slice
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/r4-recurrence-builder.yml .github/r4_builder_error.txt
          git add rust
          git commit -m "Build R4 recurrence and trigger execution"
          git push origin HEAD:rust-engine-rebuild
