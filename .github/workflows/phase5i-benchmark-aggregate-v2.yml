name: Phase 5I benchmark aggregate v2

on:
  workflow_dispatch:

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONHASHSEED: '0'
      HUMAN_RUN_ID: '33122937057'
      REPAIR_RUN_ID: '33133641811'
      EXTRA_REPAIR_RUN_ID: '33133729255'
      HAND12_FACTOR_RUN_ID: '33135996901'
      FINAL_REPAIR_RUN_ID: '33140180346'
      STAGE_RUN_ID: '33123595522'
      STAGE_EXPANSION_RUN_ID: '33135871407'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Download completed main human-hand artifacts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.HUMAN_RUN_ID }}
          pattern: phase5i-human-hand-*
          path: human
          merge-multiple: true

      - name: Add repaired hand 14
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.REPAIR_RUN_ID }}
          name: phase5i-human-hand-14
          path: human

      - name: Add repaired hand 26
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.REPAIR_RUN_ID }}
          name: phase5i-human-hand-26
          path: human

      - name: Add repaired hand 25
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.EXTRA_REPAIR_RUN_ID }}
          name: phase5i-human-hand-25
          path: human

      - name: Download Hand 12 world 0 from repaired runtime
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.FINAL_REPAIR_RUN_ID }}
          name: phase5i-hand12-world-0-final
          path: hand12_worlds

      - name: Download Hand 12 world 1
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.HAND12_FACTOR_RUN_ID }}
          name: phase5i-hand12-world-1
          path: hand12_worlds

      - name: Download Hand 12 world 2
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.HAND12_FACTOR_RUN_ID }}
          name: phase5i-hand12-world-2
          path: hand12_worlds

      - name: Reduce exact Hand 12 value
        run: |
          python -m py_compile phase5i_hand12_reduce.py
          python phase5i_hand12_reduce.py
          mv phase5i_human_hand_12.json human/

      - name: Download factorized continuation samples 0-3
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.STAGE_RUN_ID }}
          pattern: phase5i-stage-sample-*
          path: stage_samples
          merge-multiple: true

      - name: Add repaired dead stage 3 sample 1
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.REPAIR_RUN_ID }}
          name: phase5i-stage-sample-dead-s3-n1
          path: stage_samples

      - name: Add repaired live stage 4 sample 3
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.EXTRA_REPAIR_RUN_ID }}
          name: phase5i-stage-sample-live-s4-n3
          path: stage_samples

      - name: Download continuation expansion samples 4-7
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.STAGE_EXPANSION_RUN_ID }}
          pattern: phase5i-stage-sample-*
          path: stage_samples
          merge-multiple: true

      - name: Add repaired live stage 2 sample 7
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.FINAL_REPAIR_RUN_ID }}
          name: phase5i-stage-sample-live-s2-n7-final
          path: stage_samples

      - name: Verify exact benchmark coordinate lock
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          human=sorted(Path('human').glob('phase5i_human_hand_*.json'))
          ids=[int(json.loads(path.read_text())['hand_id']) for path in human]
          expected=[i for i in range(1,37) if i!=10]
          assert len(human)==35,(len(human),ids)
          assert sorted(ids)==expected,(sorted(ids),expected)
          assert len(set(ids))==35,ids

          stage=sorted(Path('stage_samples').glob('phase5i_stage_sample_*.json'))
          keys=[]
          for path in stage:
              row=json.loads(path.read_text())
              keys.append((row['context'],int(row['stage']),int(row['sample_id'])))
          expected_stage={
              (context,s,n)
              for context in ('dead','live')
              for s in range(7)
              for n in range(8)
          }
          assert len(stage)==112,(len(stage),112)
          assert set(keys)==expected_stage,(len(set(keys)),sorted(expected_stage-set(keys)))
          assert len(keys)==len(set(keys)),[x for x in set(keys) if keys.count(x)>1]
          print(f'Verified exact lock: {len(human)} human hands, {len(stage)} continuation samples')
          PY

      - name: Reduce factorized London continuation models
        run: |
          mkdir -p stage_models
          python phase5i_stage_sample_reduce.py --input-dir stage_samples --context dead --output stage_models/phase5i_stage_model_dead_factorized.json
          python phase5i_stage_sample_reduce.py --input-dir stage_samples --context live --output stage_models/phase5i_stage_model_live_factorized.json

      - name: Aggregate held-out human benchmark
        run: |
          python phase5i_benchmark_aggregate.py --human-dir human --stage-dir stage_models --output phase5i_human_benchmark_summary.json

      - name: Classify benchmark disagreements
        run: |
          python phase5i_disagreement_report.py --summary phase5i_human_benchmark_summary.json --output phase5i_disagreement_report.json

      - name: Sanity-check final Phase 5I summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          row=json.loads(Path('phase5i_human_benchmark_summary.json').read_text())
          assert row['human_hand_count']==35,row['human_hand_count']
          assert row['bottom']['applicable_hand_count']>=1,row['bottom']
          print(json.dumps({'decision':row['decision'],'bottom':row['bottom']},indent=2,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: phase5i-final-benchmark-v2
          path: |
            phase5i_human_benchmark_summary.json
            phase5i_disagreement_report.json
            stage_models/*.json
