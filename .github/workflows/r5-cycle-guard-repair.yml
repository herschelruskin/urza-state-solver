name: R5 deterministic cycle guard repair

on:
  push:
    branches:
      - rust-engine-rebuild
    paths:
      - .github/workflows/r5-cycle-guard-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rust-engine-rebuild
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy

      - name: Patch rollout and checkpoint docs
        run: python3 .github/r5_cycle_patch.py

      - name: Format
        working-directory: rust
        run: cargo fmt --all

      - name: Strict Clippy
        working-directory: rust
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Basalt cycle regression
        working-directory: rust
        run: cargo test -p urza-rollout --locked deterministic_basalt_tap_untap_cycle_escapes_to_pass

      - name: Raw ObjectId cycle invariance regression
        working-directory: rust
        run: cargo test -p urza-rollout --locked deterministic_cycle_guard_preserves_raw_object_id_invariance

      - name: Full workspace tests
        working-directory: rust
        run: cargo test --workspace --all-features --locked

      - name: Bench compile
        working-directory: rust
        run: cargo bench --workspace --no-run --locked

      - name: R0-R5 audits
        working-directory: rust
        run: |
          cargo run -p urza-cli -- r0-audit
          cargo run -p urza-cli -- r1-audit
          cargo run -p urza-cli -- r2-audit
          cargo run -p urza-cli -- r3-audit
          cargo run -p urza-cli -- r4-audit
          cargo run -p urza-cli -- r5-audit

      - name: Build release performance probe
        working-directory: rust
        run: cargo build -p urza-mc --example r5_perf_probe --release --locked

      - name: Run repaired performance matrix three times
        working-directory: rust
        run: |
          for run in 1 2 3; do
            echo "=== R5_CYCLE_GUARD_PERF_RUN_${run} ==="
            ./target/release/examples/r5_perf_probe
          done

      - name: Remove temporary diagnostics and commit validated repair
        run: |
          rm -f .github/workflows/r5-perf-probe.yml
          rm -f .github/workflows/r5-step-diagnostic.yml
          rm -f .github/workflows/r5-cycle-guard-repair.yml
          rm -f .github/r5_cycle_patch.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rust/crates rust/R5_*CHECKPOINT.md rust/DEVELOPMENT_LOG.md .github
          git status --short
          git commit -m 'Escape deterministic R5 rollout cycles'
          git push origin HEAD:rust-engine-rebuild
