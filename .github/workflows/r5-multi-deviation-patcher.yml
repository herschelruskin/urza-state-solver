name: R5 multi-deviation formatter helper

on:
  push:
    branches:
      - rust-engine-rebuild
    paths:
      - .github/workflows/r5-multi-deviation-patcher.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
          components: rustfmt
      - name: Apply rustfmt
        working-directory: rust
        run: cargo fmt --all
      - name: Commit rustfmt changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'rustfmt already clean'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add rust
          git commit -m '[R5] Apply rustfmt to multi-deviation diagnostic'
          git push
