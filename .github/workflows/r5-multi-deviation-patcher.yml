name: R5 permanent lifecycle patch helper

on:
  push:
    branches:
      - rust-engine-rebuild
    paths:
      - .github/workflows/r5-multi-deviation-patcher.yml
      - .github/scripts/patch_chrome_top_lifecycle.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
          components: rustfmt
      - name: Patch exact leave-the-battlefield lifecycle defects
        run: python3 .github/scripts/patch_chrome_top_lifecycle.py
      - name: Format and test rules repairs
        working-directory: rust
        run: |
          cargo fmt --all
          cargo test --locked -p urza-rules --lib chrome_copy_top_draw_clears_delayed_sacrifice_when_token_leaves
          cargo test --locked -p urza-rules --lib top_draw_moves_attached_aura_to_graveyard_when_top_leaves
          cargo test --locked -p urza-rules --lib chrome_copy_mandatory_sacrifice_resolves_attachments
          cargo test --locked -p urza-rules --lib
      - name: Commit exact rules repair
        run: |
          if git diff --quiet; then
            echo 'repair already applied'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add rust/crates/urza-rules/src/lib.rs
          git commit -m '[R5] Resolve attachments on mandatory Chrome sacrifice'
          git push
