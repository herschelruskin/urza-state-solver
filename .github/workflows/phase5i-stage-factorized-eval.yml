name: Phase 5I factorized continuation samples

on:
  push:
    branches:
      - phase5i-stage-factorized-eval
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sample:
    strategy:
      fail-fast: false
      matrix:
        context: [dead, live]
        stage: [0,1,2,3,4,5,6]
        sample_id: [0,1,2,3]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile factorized evaluator
        run: |
          python -m py_compile phase5i_stage_sample_eval.py
          python -m py_compile phase5i_stage_sample_reduce.py
      - name: Evaluate K_s sample
        run: python phase5i_stage_sample_eval.py --context ${{ matrix.context }} --stage ${{ matrix.stage }} --sample-id ${{ matrix.sample_id }}
      - uses: actions/upload-artifact@v4
        with:
          name: phase5i-stage-sample-${{ matrix.context }}-s${{ matrix.stage }}-n${{ matrix.sample_id }}
          path: phase5i_stage_sample_*.json
