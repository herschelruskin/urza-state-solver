name: Dack 4 Towers + Prism Key Boulder Paired N64
on:
  push:
    branches: [dack-four-towers-key-boulder-prism-20261022]
    paths:
      - 'dack_four_towers_key_boulder_prism_20261022.py'
      - '.github/workflows/dack_four_towers_key_boulder_prism_20261022.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
env:
  PYTHONHASHSEED: '0'
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate 99s, legal/synthetic, Tower mana, Prism double use
        run: |
          python -m py_compile dack_four_towers_key_boulder_prism_20261022.py
          python -u dack_four_towers_key_boulder_prism_20261022.py --audit
      - name: Four-arm one-game smoke
        run: python -u dack_four_towers_key_boulder_prism_20261022.py --games 1 --beam 80 --out smoke.json.gz
  shard:
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Eight matched seeds across four arms
        run: |
          mkdir -p shards
          python -u dack_four_towers_key_boulder_prism_20261022.py \
            --shard ${{ matrix.shard }} --games 8 --beam 160 \
            --out "shards/package_${{ matrix.shard }}.json.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: four-towers-package-shard-${{ matrix.shard }}
          path: shards/*.json.gz
          retention-days: 30
          if-no-files-found: error
  pool:
    needs: [smoke,shard]
    if: ${{ needs.smoke.result == 'success' && needs.shard.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: four-towers-package-shard-*
          merge-multiple: true
          path: shards
      - name: Pool exact 64 matched comparisons
        run: |
          python -u dack_four_towers_key_boulder_prism_20261022.py \
            --pool --path shards --expected 64 \
            --out dack_four_towers_package_n64.json
      - uses: actions/upload-artifact@v4
        with:
          name: dack-four-towers-package-n64-results
          path: dack_four_towers_package_n64.json
          if-no-files-found: error
      - name: Publish report
        run: |
          mkdir -p benchmark_results
          cp dack_four_towers_package_n64.json benchmark_results/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add benchmark_results/dack_four_towers_package_n64.json
          git commit -m 'Publish Dack four-towers Prism Key Boulder matched pilot results'
          git push
