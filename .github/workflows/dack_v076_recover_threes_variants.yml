name: DACK v0.76 recover threes variants 16-18

on:
  push:
    branches: [dack-simulator-v0.75-current99]
    paths:
      - .github/workflows/dack_v076_recover_threes_variants.yml

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 18
      matrix:
        target:
          - Tooth of Ramos
          - Coalition Relic
          - Everflowing Chalice
          - Jeweled Amulet
          - Moonsilver Key
          - Expedition Map
        game: [16,17,18]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recover target/game
        run: |
          mkdir -p recovery
          SAFE=$(echo "${{ matrix.target }}" | tr ' ' '_' | tr -d "'")
          python dack_artifact_recover_variant_v076.py --target "${{ matrix.target }}" --game ${{ matrix.game }} --out recovery/${SAFE}_${{ matrix.game }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: recover-${{ strategy.job-index }}
          path: recovery/*.json
          retention-days: 14
