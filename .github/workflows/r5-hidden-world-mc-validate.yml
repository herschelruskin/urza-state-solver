name: R5 hidden-world Monte Carlo validate

on:
  push:
    branches: [rust-engine-rebuild]
    paths:
      - ".github/workflows/r5-hidden-world-mc-validate.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rust-engine-rebuild
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy

      - name: Patch final R5 audit surface
        run: |
          python - <<'PY'
          from pathlib import Path

          main = Path('rust/crates/urza-cli/src/main.rs')
          text = main.read_text()
          if 'use urza_mc::MONTE_CARLO_VERSION;' not in text:
              text = text.replace(
                  'use urza_info::INFORMATION_SCHEMA_VERSION;\n',
                  'use urza_info::INFORMATION_SCHEMA_VERSION;\nuse urza_mc::MONTE_CARLO_VERSION;\n',
                  1,
              )

          old = '''fn run_r5_audit() {
              validate_r4_database().expect("accepted R4 database remains frozen for R5");

              let report = json!({
                  "phase": "R5-deterministic-rollout",
                  "policy_phase": POLICY_PHASE,
                  "policy_version": POLICY_VERSION,
                  "candidate_bridge_version": CANDIDATE_BRIDGE_VERSION,
                  "rollout_version": ROLLOUT_VERSION,
                  "rules_version": RULES_VERSION,
                  "model_version": MODEL_VERSION,
                  "information_schema_version": INFORMATION_SCHEMA_VERSION,
                  "value_key_schema_version": VALUE_KEY_SCHEMA_VERSION,
                  "ordinary_action_families": ORDINARY_ACTION_FAMILY_COUNT,
                  "contingent_action_families": CONTINGENT_ACTION_FAMILY_COUNT,
                  "policy_input_boundary": "urza-policy still consumes only InformationState plus public PolicyCandidate records; execution sequencing lives outside the policy crate",
                  "bridge_contract": "all accepted R4 Action families remain collision-free public candidates with exact opaque-token round trip",
                  "rollout_contract": "each policy step rebuilds CandidateBridge from the current execution state, selects from public semantics, resolves one exact Action, applies it, and repeats until terminal win, T6 horizon, explicit step limit, or no-candidate boundary",
                  "automatic_transition_contract": "automatic phase advancement runs only in OpponentCycle/Untap Window::None with empty stack and no pending decision; contingent choices cannot be bypassed",
                  "rng_contract": "game RNG root/world are explicit rollout inputs and logical event id equals the public step index; replay uses the recorded public semantic action trace, never raw ObjectId provenance",
                  "replay_contract": "recorded semantic traces replay by class plus exact PolicyPublicKey and reject decision-point or candidate drift",
                  "current_scope": "deterministic multi-step R5 rollout sequencing complete over CandidateBridge; urza-mc remains untouched",
                  "next_r5_work": "connect sampled hidden worlds and Monte Carlo root evaluation to the accepted deterministic rollout boundary",
              });

              println!(
                  "{}",
                  serde_json::to_string_pretty(&report).expect("serializable R5 audit report")
              );
          }
          '''
          new = '''fn run_r5_audit() {
              validate_r4_database().expect("accepted R4 database remains frozen for R5");

              let report = json!({
                  "phase": "R5-hidden-world-monte-carlo",
                  "policy_phase": POLICY_PHASE,
                  "policy_version": POLICY_VERSION,
                  "candidate_bridge_version": CANDIDATE_BRIDGE_VERSION,
                  "rollout_version": ROLLOUT_VERSION,
                  "monte_carlo_version": MONTE_CARLO_VERSION,
                  "rules_version": RULES_VERSION,
                  "model_version": MODEL_VERSION,
                  "information_schema_version": INFORMATION_SCHEMA_VERSION,
                  "value_key_schema_version": VALUE_KEY_SCHEMA_VERSION,
                  "ordinary_action_families": ORDINARY_ACTION_FAMILY_COUNT,
                  "contingent_action_families": CONTINGENT_ACTION_FAMILY_COUNT,
                  "policy_input_boundary": "urza-policy still consumes only InformationState plus public PolicyCandidate records; hidden-world sampling and exact execution remain outside the policy crate",
                  "bridge_contract": "all accepted R4 Action families remain collision-free public candidates with exact opaque-token round trip",
                  "rollout_contract": "each sampled exact world is evaluated only through the accepted deterministic urza-rollout driver",
                  "hidden_world_contract": "the exact template supplies execution scaffolding, but its unknown library order is discarded: the unknown middle is canonicalized as a public multiset and shuffled with an OuterHiddenWorld coordinate derived from public library belief plus WorldId",
                  "monte_carlo_contract": "fixed world identities are evaluated independently, outcomes are returned in canonical WorldId order, terminal wins aggregate by T1-T6 and WinFamily, and only a true T6 horizon is counted as a loss",
                  "rng_contract": "outer hidden-world sampling uses the OuterHiddenWorld domain; game randomness inside each rollout uses the existing Game domain with the same explicit root and sampled WorldId",
                  "completion_contract": "StepLimit and NoCandidate are incomplete evaluations and fail the Monte Carlo call rather than being silently recorded as losses",
                  "current_scope": "fixed-budget hidden-world sampling and deterministic Monte Carlo root-state evaluation complete over the frozen R4/R5 bridge+rollout surface",
                  "next_r5_work": "audit and build root-action comparison/value integration on common sampled worlds before any adaptive-confidence or performance broadening",
              });

              println!(
                  "{}",
                  serde_json::to_string_pretty(&report).expect("serializable R5 audit report")
              );
          }
          '''
          if old not in text:
              raise SystemExit('current run_r5_audit block not found')
          main.write_text(text.replace(old, new, 1))
          PY

      - name: Refresh lockfile
        working-directory: rust
        run: cargo check --workspace
      - name: Format
        working-directory: rust
        run: cargo fmt --all
      - name: Locked dependency graph
        working-directory: rust
        run: cargo metadata --locked --format-version 1 --no-deps > /dev/null
      - name: Strict clippy
        working-directory: rust
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Workspace tests
        working-directory: rust
        run: cargo test --locked --workspace --all-targets
      - name: Bench compile
        working-directory: rust
        run: cargo check --locked --workspace --benches
      - name: R0 through R5 audits
        working-directory: rust
        run: |
          cargo run --locked -p urza-cli -- r0-audit >/dev/null
          cargo run --locked -p urza-cli -- r1-audit >/dev/null
          cargo run --locked -p urza-cli -- r2-audit >/dev/null
          cargo run --locked -p urza-cli -- r3-audit >/dev/null
          cargo run --locked -p urza-cli -- r4-audit >/dev/null
          cargo run --locked -p urza-cli -- r5-audit

      - name: Record hidden-world Monte Carlo checkpoint
        run: |
          cat > rust/R5_MONTE_CARLO_CHECKPOINT.md <<'EOF'
          # R5 hidden-world Monte Carlo checkpoint

          ## Scope

          This checkpoint adds fixed-budget hidden-world sampling and Monte Carlo root-state evaluation on top of the accepted deterministic rollout API. It does not broaden R4 rules/card coverage and does not add a second gameplay or policy implementation.

          ## Architecture boundary

          `urza-mc` is an outer evaluator. It samples exact hidden library worlds, delegates every sampled world to `urza-rollout`, and aggregates completed outcomes. `urza-policy` remains public-state-only; `urza-policy-bridge` remains the sole action-enumeration/canonicalization boundary.

          ## Hidden-world sampling

          The caller supplies a valid exact `TrueState` as execution scaffolding. Sampling observes that state, preserves known top and known bottom cards exactly, discards the preexisting order of the unknown middle, sorts the unknown middle into its public multiset, and shuffles that canonical multiset.

          The sampling RNG coordinate uses domain `OuterHiddenWorld`, a dedicated R5 hidden-library event type, the explicit `WorldId`, occurrence zero, and a concrete fingerprint derived only from the public `LibraryBelief`. Therefore two exact templates with the same public information but different unknown library order produce the same sampled exact library for the same root/world coordinate.

          Each sampled state is re-observed and must equal the template `InformationState`; any public drift is an error.

          ## Monte Carlo evaluation

          `MonteCarloConfig` supplies `RootSeed`, the first `WorldId`, sample count, and deterministic rollout step bound. World IDs are semantic sample identities. The evaluator also accepts an explicit set of world IDs, rejects duplicates, canonicalizes execution order by numeric `WorldId`, and returns per-world outcomes in that same order.

          Each exact sampled world is evaluated through `urza-rollout` using the same root and that sampled `WorldId`. Game randomness remains in the existing `Game` RNG domain while outer world sampling remains in `OuterHiddenWorld`.

          Completed terminal samples are accumulated into `WinDistribution::t1_through_t6` and a stable 13-family win table. A true R4 T6 horizon is accumulated as a loss. `StepLimit` and `NoCandidate` are incomplete evaluations and fail the Monte Carlo call instead of silently becoming losses.

          ## Acceptance

          Acceptance fixtures prove public-state preservation, exact known library edges, preexisting-hidden-order noninterference, `OuterHiddenWorld` domain separation, same-root/world repeatability, world-order independence, hidden-order-equivalent Monte Carlo invariance, exact turn/family aggregation, horizon-loss aggregation, incomplete-stop rejection, and duplicate-world rejection. The full Rust quality gate also requires strict Clippy, workspace tests, benchmark compilation, and cumulative R0-R5 audits.

          ## Namespaces

          - rules: `r4_acceptance_v6`;
          - model: `urza_model_r4c_2026_09_04`;
          - information: `information_state_v7_r4`;
          - ValueKey: `value_key_v7_r4`;
          - policy: `r5_candidate_contract_v2`;
          - candidate bridge: `r5_public_candidate_bridge_v1`;
          - rollout: `r5_deterministic_rollout_v1`;
          - Monte Carlo: `r5_hidden_world_mc_v1`.

          No frozen R4 namespace changes are made in this block.

          ## Next R5 block

          Build audited root-action comparison/value integration using common sampled `WorldId`s across candidate roots. Adaptive confidence, caching, and performance policy should come only after that comparison contract is deterministic and replayable.

          Python gameplay/policy logic remains out of scope.
          EOF

          cat >> rust/DEVELOPMENT_LOG.md <<'EOF'

          ## R5 hidden-world Monte Carlo

          Added fixed-budget outer hidden-world sampling and Monte Carlo root-state evaluation in `urza-mc`. Sampling canonicalizes the unknown library middle before `OuterHiddenWorld` shuffling so preexisting secret order cannot leak into samples, preserves known library edges, and verifies public-information equality after sampling. Each world is evaluated only through accepted deterministic rollout; terminal outcomes aggregate by T1-T6/family, horizon is the only modeled loss, and incomplete rollout stops remain errors. World IDs are explicit, unique sample identities and evaluation order is canonicalized. R4 namespaces remain frozen. Root-action comparison/value integration is next.
          EOF

      - name: Remove temporary Monte Carlo workflows
        run: git rm .github/workflows/r5-hidden-world-mc-finalize.yml .github/workflows/r5-hidden-world-mc-validate.yml

      - name: Commit validated hidden-world Monte Carlo
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rust .github/workflows
          git commit -m 'Close R5 hidden-world Monte Carlo checkpoint'
          git push origin HEAD:rust-engine-rebuild
