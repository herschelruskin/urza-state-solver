name: DACK v0.76 recover threes start4

on:
  push:
    branches: [dack-simulator-v0.75-current99]
    paths:
      - .github/workflows/dack_v076_recover_threes4.yml

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recover missing paired threes shard
        run: |
          mkdir -p paired
          python dack_artifact_paired_v076.py --group threes --start 4 --games 4 --out paired/threes_4.json
      - uses: actions/upload-artifact@v4
        with:
          name: artifact-threes-recover-4
          path: paired/threes_4.json
          retention-days: 14
