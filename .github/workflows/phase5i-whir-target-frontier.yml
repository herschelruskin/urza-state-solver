name: Phase 5I Whir target frontier validation

on:
  push:
    branches:
      - phase5i-whir-target-frontier
  workflow_dispatch:

jobs:
  semantic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile frontier
        run: |
          python -m py_compile             phase5_artifact_target_frontier.py             phase5_selective_tutor_q.py             phase5i_hand25_frontier_probe.py
      - name: Frontier semantics
        run: python phase5_artifact_target_frontier_smoke.py
      - name: Existing Q regressions
        run: |
          python phase5_selective_tutor_q_smoke.py
          python phase5_contingent_tutor_q_smoke.py
          python phase5_adaptive_confidence_q_smoke.py
          python phase5_symbolic_action_space_smoke.py
          python phase5_symbolic_branch_bound_smoke.py
          python phase5_staged_whir_payment_smoke.py
          python phase5_staged_reshape_parity_smoke.py
          python phase5i_mulligan_smoke.py

  hand25_world:
    needs: semantic
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        include:
          - { bottom: "Hydroelectric Specimen", sample_id: 0 }
          - { bottom: "Minamo, School at Water's Edge", sample_id: 0 }
          - { bottom: "Whir of Invention", sample_id: 0 }
          - { bottom: "Sapphire Medallion", sample_id: 0 }
          - { bottom: "Uthros Research Craft", sample_id: 0 }
          - { bottom: "Voltaic Key", sample_id: 0 }
          - { bottom: "Island", sample_id: 0 }
          - { bottom: "Minamo, School at Water's Edge", sample_id: 1 }
          - { bottom: "Whir of Invention", sample_id: 2 }
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONHASHSEED: '0'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run frontier world probe
        run: |
          python phase5i_hand25_frontier_probe.py             --bottom-card "${{ matrix.bottom }}"             --sample-id "${{ matrix.sample_id }}"
      - uses: actions/upload-artifact@v4
        with:
          name: phase5i-hand25-frontier-${{ strategy.job-index }}
          path: phase5i_hand25_frontier_*.json

  full_hand25:
    needs: semantic
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONHASHSEED: '0'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run exact Hand 25 evaluator with frontier
        run: python phase5i_human_hand_eval.py --hand-id 25
      - uses: actions/upload-artifact@v4
        with:
          name: phase5i-hand25-frontier-full
          path: phase5i_human_hand_25.json

  paired4:
    needs: semantic
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        hand_id: [12, 13, 19, 20, 21, 24, 25, 27, 29, 33]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONHASHSEED: '0'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Frozen Phase 5H paired4 hand
        run: python phase5_q_targeted_paired4.py --hand-id "${{ matrix.hand_id }}"
      - uses: actions/upload-artifact@v4
        with:
          name: phase5h-frontier-paired4-${{ matrix.hand_id }}
          path: phase5_q_targeted_paired4_hand*.json
