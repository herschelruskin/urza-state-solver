name: Phase 5I shared search-shuffle validation

on:
  push:
    branches:
      - phase5i-whir-target-frontier
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semantic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile shared-search path
        run: |
          python -m py_compile x_artifact_search_adapter.py phase5_selective_tutor_q.py phase5_q_targeted_paired4.py
      - name: Shared shuffle and exact target semantics
        run: python x_artifact_search_adapter_smoke.py
      - name: Existing Q regressions
        run: |
          python phase5_selective_tutor_q_smoke.py
          python phase5_contingent_tutor_q_smoke.py
          python phase5_adaptive_confidence_q_smoke.py
          python phase5_symbolic_action_space_smoke.py
          python phase5_symbolic_branch_bound_smoke.py
          python phase5_staged_whir_payment_smoke.py
          python phase5_staged_reshape_parity_smoke.py
          python phase5i_mulligan_smoke.py

  full_hand25:
    needs: semantic
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONHASHSEED: '0'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run exact Hand 25 evaluator with shared shuffle
        run: python phase5i_human_hand_eval.py --hand-id 25
      - uses: actions/upload-artifact@v4
        with:
          name: phase5i-hand25-shared-shuffle-full
          path: phase5i_human_hand_25.json

  paired4:
    needs: semantic
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        hand_id: [12, 13, 19, 20, 21, 24, 25, 27, 29, 33]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONHASHSEED: '0'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Frozen Phase 5H paired4 hand
        run: python phase5_q_targeted_paired4.py --hand-id "${{ matrix.hand_id }}"
      - uses: actions/upload-artifact@v4
        with:
          name: phase5h-shared-shuffle-paired4-${{ matrix.hand_id }}
          path: phase5_q_targeted_paired4_hand*.json
