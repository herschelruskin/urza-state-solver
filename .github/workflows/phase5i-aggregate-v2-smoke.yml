name: Phase 5I aggregate v2 smoke

on:
  push:
    branches:
      - phase5i-final-aggregate-v2

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile aggregate toolchain
        run: |
          python -m py_compile phase5i_hand12_reduce.py
          python -m py_compile phase5i_stage_sample_reduce.py
          python -m py_compile phase5i_benchmark_aggregate.py
          python -m py_compile phase5i_disagreement_report.py
      - name: Source checks
        run: git diff --check HEAD~1 HEAD
