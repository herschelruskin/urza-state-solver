name: R4 final acceptance

on:
  push:
    branches: [rust-engine-rebuild]
    paths:
      - .github/workflows/r4-final-acceptance.yml
      - rust/scripts/r4_final_acceptance.py

permissions:
  contents: write

jobs:
  accept:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rust-engine-rebuild
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy
      - name: Apply final R4 acceptance patch
        run: python3 rust/scripts/r4_final_acceptance.py
      - name: Refresh lockfile for path dependencies
        working-directory: rust
        run: cargo metadata --format-version 1 > /dev/null
      - name: Locked dependency graph
        working-directory: rust
        run: cargo metadata --locked --format-version 1 --no-deps > /dev/null
      - name: Format
        working-directory: rust
        run: cargo fmt --all
      - name: Format check
        working-directory: rust
        run: cargo fmt --all -- --check
      - name: Final R4 acceptance integration
        working-directory: rust
        run: cargo test --locked -p urza-cards --test r4_final_acceptance
      - name: Strict clippy
        working-directory: rust
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Workspace tests
        working-directory: rust
        run: cargo test --locked --workspace --all-targets
      - name: Bench compile
        working-directory: rust
        run: cargo check --locked --workspace --benches
      - name: R0 audit
        working-directory: rust
        run: cargo run --locked -p urza-cli -- r0-audit
      - name: R1 audit
        working-directory: rust
        run: cargo run --locked -p urza-cli -- r1-audit
      - name: R2 audit
        working-directory: rust
        run: cargo run --locked -p urza-cli -- r2-audit
      - name: R3 audit
        working-directory: rust
        run: cargo run --locked -p urza-cli -- r3-audit
      - name: R4 audit
        working-directory: rust
        run: cargo run --locked -p urza-cli -- r4-audit
      - name: Commit accepted R4 closure
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/r4-final-acceptance.yml rust/scripts/r4_final_acceptance.py
          git add rust
          git commit -m "Close R4 acceptance gate"
          git push origin HEAD:rust-engine-rebuild
