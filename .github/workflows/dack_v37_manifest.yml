name: DACK v37 freeze random and v13-proxy-discordant physical groups
on:
  push:
    branches: [dack-v37-direct-action-regret-20261101]
    paths: ['.github/workflows/dack_v37_manifest.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m py_compile dack_simulator/validation/v37_manifest.py
          python -m dack_simulator.validation.v34_frozen_v33b_continuation
          python -u dack_simulator/validation/v37_manifest.py
      - name: Seal pre-outcome selection
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f datasets/v37_preoutcome_training_manifest.json
          git commit -m 'Freeze v37 outcome-blind random and v13 proxy-disagreement sampling'
          git pull --rebase origin dack-v37-direct-action-regret-20261101
          git push origin HEAD:dack-v37-direct-action-regret-20261101
