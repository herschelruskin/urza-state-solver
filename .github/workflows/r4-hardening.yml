name: R4 terminal hardening

on:
  push:
    branches: [rust-engine-rebuild]
    paths:
      - .github/workflows/r4-hardening.yml
      - rust/scripts/r4_terminal_hardening.py

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rust-engine-rebuild
          fetch-depth: 0
      - name: Apply terminal acceptance patch
        run: python3 rust/scripts/r4_terminal_hardening.py
      - name: Refresh lockfile for test-only path dependency
        working-directory: rust
        run: cargo metadata --format-version 1 > /dev/null
      - name: Format
        working-directory: rust
        run: cargo fmt --all
      - name: Test workspace locked
        working-directory: rust
        run: cargo test --workspace --locked
      - name: Strict clippy locked
        working-directory: rust
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: R4 audit
        working-directory: rust
        run: cargo run -p urza-cli --locked -- r4-audit
      - name: Commit validated hardening
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/r4-hardening.yml rust/scripts/r4_terminal_hardening.py
          git add rust
          git commit -m "Harden R4 terminal family acceptance"
          git push origin HEAD:rust-engine-rebuild
