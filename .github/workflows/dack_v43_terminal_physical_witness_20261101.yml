name: DACK v43 terminal physical witness and colored-mana gate
on:
  push:
    branches:
      - dack-v43-independent-audit-20261101
    paths:
      - ".github/workflows/dack_v43_terminal_physical_witness_20261101.yml"
      - "dack_simulator/validation/v43_terminal_witness_audit_20261101.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  witness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Strict physical winner-state witnesses plus colored mana and combo legality
        run: |
          python -m dack_simulator.validation.v43_terminal_witness_audit_20261101
      - name: Archive raw terminal winning states, misses and real replay details
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dack-v43-readonly-terminal-physical-witnesses
          path: benchmark_results/v43_readonly_real_terminal_state_witness_dev_162700_N24.json
