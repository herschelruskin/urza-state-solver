name: Phase 5I hand 12 rerun

on:
  push:
    branches:
      - phase5i-hand12-rerun
  workflow_dispatch:

jobs:
  hand12:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile evaluator
        run: python -m py_compile phase5i_human_hand_eval.py
      - name: Evaluate human hand 12
        run: python phase5i_human_hand_eval.py --hand-id 12
      - uses: actions/upload-artifact@v4
        with:
          name: phase5i-human-hand-12
          path: phase5i_human_hand_*.json
