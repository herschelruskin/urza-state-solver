name: DACK v39 new random 131k physical K/C and group-bootstrap T2 gate
on:
  push:
    branches: [dack-v39-t2-risk-bounded-regret-20261101]
    paths: ['.github/workflows/dack_v39_131k_physical.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  physical:
    strategy:
      fail-fast: false
      max-parallel: 14
      matrix:
        include:
          - {kind: K, shard: 0, seat: 0, stage: 0}
          - {kind: K, shard: 1, seat: 0, stage: 0}
          - {kind: K, shard: 2, seat: 0, stage: 0}
          - {kind: K, shard: 3, seat: 0, stage: 0}
          - {kind: K, shard: 4, seat: 0, stage: 0}
          - {kind: K, shard: 5, seat: 0, stage: 0}
          - {kind: K, shard: 6, seat: 0, stage: 0}
          - {kind: K, shard: 7, seat: 0, stage: 0}
          - {kind: K, shard: 8, seat: 0, stage: 0}
          - {kind: K, shard: 9, seat: 0, stage: 0}
          - {kind: K, shard: 10, seat: 0, stage: 0}
          - {kind: K, shard: 11, seat: 0, stage: 0}
          - {kind: K, shard: 12, seat: 0, stage: 0}
          - {kind: K, shard: 13, seat: 0, stage: 0}
          - {kind: K, shard: 14, seat: 0, stage: 0}
          - {kind: K, shard: 15, seat: 0, stage: 0}
          - {kind: C, shard: 0, seat: 0, stage: 0}
          - {kind: C, shard: 0, seat: 0, stage: 1}
          - {kind: C, shard: 0, seat: 0, stage: 2}
          - {kind: C, shard: 0, seat: 1, stage: 0}
          - {kind: C, shard: 0, seat: 1, stage: 1}
          - {kind: C, shard: 0, seat: 1, stage: 2}
          - {kind: C, shard: 0, seat: 2, stage: 0}
          - {kind: C, shard: 0, seat: 2, stage: 1}
          - {kind: C, shard: 0, seat: 2, stage: 2}
          - {kind: C, shard: 0, seat: 3, stage: 0}
          - {kind: C, shard: 0, seat: 3, stage: 1}
          - {kind: C, shard: 0, seat: 3, stage: 2}
    runs-on: ubuntu-latest
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify archived frozen N1024 census and precommitted coverage gate
        run: |
          python -m py_compile dack_simulator/validation/v39_131k_true_keep_changed.py dack_simulator/validation/v39_131k_true_mull.py dack_simulator/validation/v39_131k_pool.py
          python - <<'PY'
          import json
          d=json.load(open('datasets/v39_131k_frozen_outcome_blind_census.json'))
          assert d['status']=='PASS' and d['no_full_game_or_counterfactual_rollouts_at_selection']
          assert d['random_stage_state_denominator']==3072 and d['physical_random_outer_groups']==1024
          assert d['actual_action_changes']>=24 and d['changed_actual_London_path_games']>=12
          print('DACK_V39_PRE_OUTCOME_KC_GATE_PASS',d['actual_action_changes'],d['changed_actual_London_path_games'],flush=True)
          PY
      - name: Evaluate 32 strictly unseen92 KEEP futures or 128 complete99 continuation futures
        run: |
          if [ "${{ matrix.kind }}" = "K" ]; then
            python -u dack_simulator/validation/v39_131k_true_keep_changed.py \
              --shard ${{ matrix.shard }} \
              --out shards/v39_K_${{ matrix.shard }}.json.gz
          else
            python -u dack_simulator/validation/v39_131k_true_mull.py \
              --seat ${{ matrix.seat }} --stage ${{ matrix.stage }} \
              --out shards/v39_C_${{ matrix.seat }}_${{ matrix.stage }}.json.gz
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v39-131k-${{ matrix.kind }}-${{ matrix.shard }}-${{ matrix.seat }}-${{ matrix.stage }}
          path: shards/v39_*.json.gz
          retention-days: 30
  pool:
    needs: physical
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: v39-131k-*
          path: collected
          merge-multiple: true
      - name: Assert complete physical samples and two-source N1024 random-group bootstrap
        run: |
          test "$(find collected -maxdepth 1 -name 'v39_K_*.json.gz' | wc -l)" -eq 16
          test "$(find collected -maxdepth 1 -name 'v39_C_*.json.gz' | wc -l)" -eq 12
          python -u dack_simulator/validation/v39_131k_pool.py
      - name: Archive raw 131k physical replay data and predeclared candidate gate
        run: |
          mkdir -p benchmark_results/v39_131k_physical_shards
          cp collected/v39_*.json.gz benchmark_results/v39_131k_physical_shards/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f benchmark_results/v39_131k_physical_shards benchmark_results/v39_131k_independent_action_regret.json
          git commit -m "Archive v39 131k independent true physical T1/T2/T3 regret with full group bootstrap"
          git pull --rebase origin dack-v39-t2-risk-bounded-regret-20261101
          git push origin HEAD:dack-v39-t2-risk-bounded-regret-20261101
      - uses: actions/upload-artifact@v4
        with:
          name: v39-independent-131k-physical-action-regret-result
          path: benchmark_results/v39_131k_independent_action_regret.json
          retention-days: 30
