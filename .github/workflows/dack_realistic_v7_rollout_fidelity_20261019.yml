name: Dack V7 Forecast-Fidelity Matched N32
on:
  push:
    branches: [dack-realistic-v7-rollout-fidelity-20261019]
    paths:
      - 'dack_realistic_v7_rollout_fidelity_20261019.py'
      - 'dack_realistic_v7_rollout_pool_20261019.py'
      - '.github/workflows/dack_realistic_v7_rollout_fidelity_20261019.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
env:
  PYTHONHASHSEED: '0'
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile and verify fair hidden-information boundaries
        run: |
          python -m py_compile dack_realistic_v7_rollout_fidelity_20261019.py dack_realistic_v7_rollout_pool_20261019.py
          python -u dack_realistic_v7_rollout_fidelity_20261019.py --audit
      - name: End-to-end v7 forecast beam smoke
        run: |
          python -u dack_realistic_v7_rollout_fidelity_20261019.py \
            --variant current --shard 0 --games 1 \
            --forecast-beam 96 --forecast-depth 24 --out smoke.json.gz
          python - <<'PY'
          import gzip,json
          with gzip.open('smoke.json.gz','rt') as f:q=json.load(f)
          assert q['schema']=='dack_realistic_forecast_fidelity_v7'
          assert q['rows'][0]['game_id']==0
          assert q['rows'][0]['win_turn'] in range(4)
          assert q['actual_beam']==120 and q['forecast_beam']==96
          print('DACK_V7_MATCHED_SMOKE_PASS',flush=True)
          PY
  shards:
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 14
      matrix:
        variant: [current,buck_worldmap]
        shard: [0,1,2,3,4,5,6,7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Four matched games with 96-wide forecast search
        run: |
          mkdir -p v7
          python -u dack_realistic_v7_rollout_fidelity_20261019.py \
            --variant "${{ matrix.variant }}" --shard "${{ matrix.shard }}" --games 4 \
            --forecast-beam 96 --forecast-depth 24 \
            --out "v7/${{ matrix.variant }}_shard_${{ matrix.shard }}.json.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: dack-v7-forecast-${{ matrix.variant }}-${{ matrix.shard }}
          path: v7/*.json.gz
          retention-days: 90
          if-no-files-found: error
  pool:
    needs: [smoke,shards]
    if: ${{ needs.smoke.result == 'success' && needs.shards.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dack-v7-forecast-*
          merge-multiple: true
          path: v7
      - name: Fetch exact baseline v6 matched-game shards
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p v6
          gh run download 39338026707 --repo "${{ github.repository }}" \
            --pattern 'dack-v6-stratified-*' --dir v6
          test "$(find v6 -name '*.json.gz' | wc -l)" -eq 16
          test "$(find v7 -name '*.json.gz' | wc -l)" -eq 16
      - name: Report paired cumulative T1 T2 T3 and gain/loss game IDs
        run: |
          python -u dack_realistic_v7_rollout_pool_20261019.py \
            --v6 v6 --v7 v7 --n 32 \
            --out dack_v7_matched_n32_20261019.json
      - uses: actions/upload-artifact@v4
        with:
          name: dack-v7-forecast-n32-results
          path: dack_v7_matched_n32_20261019.json
          retention-days: 90
      - name: Publish paired report
        run: |
          mkdir -p benchmark_results
          cp dack_v7_matched_n32_20261019.json \
            benchmark_results/dack_v7_forecast_fidelity_n32_20261019.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add benchmark_results/dack_v7_forecast_fidelity_n32_20261019.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publish Realistic Beam v7 forecast fidelity matched pilot'
            git pull --rebase origin dack-realistic-v7-rollout-fidelity-20261019
            git push
          fi
