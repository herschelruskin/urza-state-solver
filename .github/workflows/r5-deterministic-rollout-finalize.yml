name: R5 deterministic rollout finalize

on:
  push:
    branches: [rust-engine-rebuild]
    paths:
      - ".github/workflows/r5-deterministic-rollout-finalize.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rust-engine-rebuild
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy

      - name: Build deterministic rollout crate
        run: |
          mkdir -p rust/crates/urza-rollout/src
          cat > rust/crates/urza-rollout/Cargo.toml <<'EOF'
          [package]
          name = "urza-rollout"
          version.workspace = true
          edition.workspace = true
          rust-version.workspace = true

          [dependencies]
          thiserror.workspace = true
          urza-core = { path = "../urza-core" }
          urza-info = { path = "../urza-info" }
          urza-policy = { path = "../urza-policy" }
          urza-policy-bridge = { path = "../urza-policy-bridge" }
          urza-rng = { path = "../urza-rng" }
          urza-rules = { path = "../urza-rules" }

          [dev-dependencies]
          urza-cards = { path = "../urza-cards" }
          EOF

          cat > rust/crates/urza-rollout/src/lib.rs <<'EOF'
          #![forbid(unsafe_code)]

          use thiserror::Error;
          use urza_core::{PendingDecision, Phase, TrueState, Window};
          use urza_info::{InformationState, ObservationError, observe};
          use urza_policy::{
              ActionToken, DeterministicPolicy, PolicyActionClass, PolicyError, PolicyPublicKey,
          };
          use urza_policy_bridge::{BridgeError, CandidateBridge};
          use urza_rng::{LogicalEventId, RootSeed, WorldId};
          use urza_rules::{
              CardDatabase, GameRngContext, RuleError, WinFamily, advance_automatic,
              apply_action_with_rng, detect_terminal_win,
          };

          pub const ROLLOUT_VERSION: &str = "r5_deterministic_rollout_v1";
          pub const DEFAULT_MAX_STEPS: u32 = 4096;

          #[derive(Debug, Clone, Copy, PartialEq, Eq)]
          pub struct RolloutConfig {
              pub root: RootSeed,
              pub world: WorldId,
              pub max_steps: u32,
          }

          impl Default for RolloutConfig {
              fn default() -> Self {
                  Self {
                      root: RootSeed::from_u64(0x5235_524f_4c4c_4f55),
                      world: WorldId(0),
                      max_steps: DEFAULT_MAX_STEPS,
                  }
              }
          }

          #[derive(Debug, Clone, Copy, PartialEq, Eq, Hash)]
          pub enum RolloutStop {
              Terminal(WinFamily),
              Horizon,
              StepLimit,
              NoCandidate,
          }

          #[derive(Debug, Clone, PartialEq, Eq, Hash)]
          pub struct RolloutStep {
              pub index: u32,
              pub turn: u8,
              pub phase: Phase,
              pub window: Window,
              pub class: PolicyActionClass,
              pub key: PolicyPublicKey,
          }

          #[derive(Debug, Clone, PartialEq, Eq)]
          pub struct RolloutResult {
              pub final_state: TrueState,
              pub final_information: InformationState,
              pub stop: RolloutStop,
              pub trace: Vec<RolloutStep>,
          }

          #[derive(Debug, Error)]
          pub enum RolloutError {
              #[error(transparent)]
              Bridge(#[from] BridgeError),
              #[error(transparent)]
              Policy(#[from] PolicyError),
              #[error(transparent)]
              Observation(#[from] ObservationError),
              #[error(transparent)]
              Rules(#[from] RuleError),
              #[error("selected decision-local token {0:?} could not be resolved")]
              MissingResolvedAction(ActionToken),
              #[error("rollout trace exceeded u32 step indexing")]
              StepIndexOverflow,
              #[error("replay trace step {position} declares index {declared}")]
              ReplayStepIndexMismatch { position: u32, declared: u32 },
              #[error("replay stopped before trace step {index}: {stop:?}")]
              ReplayStoppedEarly { index: u32, stop: RolloutStop },
              #[error(
                  "replay public decision point mismatch at step {index}: expected turn {expected_turn} {expected_phase:?}/{expected_window:?}, got turn {actual_turn} {actual_phase:?}/{actual_window:?}"
              )]
              ReplayDecisionPointMismatch {
                  index: u32,
                  expected_turn: u8,
                  expected_phase: Phase,
                  expected_window: Window,
                  actual_turn: u8,
                  actual_phase: Phase,
                  actual_window: Window,
              },
              #[error("replay semantic candidate is missing at step {0}")]
              ReplayCandidateMissing(u32),
              #[error("replay semantic candidate is ambiguous at step {0}")]
              ReplayCandidateAmbiguous(u32),
          }

          pub fn rollout<D: CardDatabase>(
              initial: TrueState,
              cards: &D,
              policy: &DeterministicPolicy,
              config: RolloutConfig,
          ) -> Result<RolloutResult, RolloutError> {
              let mut state = initial;
              let mut trace = Vec::new();

              loop {
                  if let Some(stop) = prepare_for_policy(&mut state, cards)? {
                      return finish(state, stop, trace);
                  }

                  if trace.len() >= config.max_steps as usize {
                      return finish(state, RolloutStop::StepLimit, trace);
                  }

                  let bridge = CandidateBridge::build(&state, cards)?;
                  let Some(token) = policy.choose(bridge.information(), bridge.candidates())? else {
                      return finish(state, RolloutStop::NoCandidate, trace);
                  };
                  let selected = bridge
                      .candidates()
                      .iter()
                      .find(|candidate| candidate.token == token)
                      .cloned()
                      .ok_or(RolloutError::MissingResolvedAction(token))?;
                  let action = bridge
                      .resolved_action(token)
                      .ok_or(RolloutError::MissingResolvedAction(token))?;
                  let index =
                      u32::try_from(trace.len()).map_err(|_| RolloutError::StepIndexOverflow)?;

                  trace.push(RolloutStep {
                      index,
                      turn: bridge.information().turn,
                      phase: bridge.information().phase,
                      window: bridge.information().window,
                      class: selected.class,
                      key: selected.key,
                  });

                  execute(&mut state, cards, action, config, index)?;
              }
          }

          pub fn replay_trace<D: CardDatabase>(
              initial: TrueState,
              cards: &D,
              config: RolloutConfig,
              trace: &[RolloutStep],
          ) -> Result<TrueState, RolloutError> {
              let mut state = initial;

              for (position, expected) in trace.iter().enumerate() {
                  let index =
                      u32::try_from(position).map_err(|_| RolloutError::StepIndexOverflow)?;
                  if expected.index != index {
                      return Err(RolloutError::ReplayStepIndexMismatch {
                          position: index,
                          declared: expected.index,
                      });
                  }

                  if let Some(stop) = prepare_for_policy(&mut state, cards)? {
                      return Err(RolloutError::ReplayStoppedEarly { index, stop });
                  }

                  let bridge = CandidateBridge::build(&state, cards)?;
                  let information = bridge.information();
                  if information.turn != expected.turn
                      || information.phase != expected.phase
                      || information.window != expected.window
                  {
                      return Err(RolloutError::ReplayDecisionPointMismatch {
                          index,
                          expected_turn: expected.turn,
                          expected_phase: expected.phase,
                          expected_window: expected.window,
                          actual_turn: information.turn,
                          actual_phase: information.phase,
                          actual_window: information.window,
                      });
                  }

                  let mut matching = bridge.candidates().iter().filter(|candidate| {
                      candidate.class == expected.class && candidate.key == expected.key
                  });
                  let Some(candidate) = matching.next() else {
                      return Err(RolloutError::ReplayCandidateMissing(index));
                  };
                  if matching.next().is_some() {
                      return Err(RolloutError::ReplayCandidateAmbiguous(index));
                  }
                  let action = bridge
                      .resolved_action(candidate.token)
                      .ok_or(RolloutError::MissingResolvedAction(candidate.token))?;
                  execute(&mut state, cards, action, config, index)?;
              }

              Ok(state)
          }

          fn prepare_for_policy<D: CardDatabase>(
              state: &mut TrueState,
              cards: &D,
          ) -> Result<Option<RolloutStop>, RolloutError> {
              let information = observe(state)?;
              if let Some(family) = detect_terminal_win(&information, cards) {
                  return Ok(Some(RolloutStop::Terminal(family)));
              }

              if needs_automatic_advance(state) {
                  match advance_automatic(state, cards) {
                      Ok(_) => {}
                      Err(RuleError::HorizonReached) => return Ok(Some(RolloutStop::Horizon)),
                      Err(error) => return Err(error.into()),
                  }

                  let information = observe(state)?;
                  if let Some(family) = detect_terminal_win(&information, cards) {
                      return Ok(Some(RolloutStop::Terminal(family)));
                  }
              }

              Ok(None)
          }

          fn needs_automatic_advance(state: &TrueState) -> bool {
              state.stack.is_empty()
                  && matches!(state.pending, PendingDecision::None)
                  && matches!(
                      (state.phase, state.window),
                      (Phase::OpponentCycle, Window::None) | (Phase::Untap, Window::None)
                  )
          }

          fn execute<D: CardDatabase>(
              state: &mut TrueState,
              cards: &D,
              action: urza_rules::Action,
              config: RolloutConfig,
              index: u32,
          ) -> Result<(), RolloutError> {
              apply_action_with_rng(
                  state,
                  cards,
                  action,
                  GameRngContext {
                      root: config.root,
                      world: config.world,
                      logical_event: LogicalEventId(u64::from(index)),
                  },
              )?;
              Ok(())
          }

          fn finish(
              state: TrueState,
              stop: RolloutStop,
              trace: Vec<RolloutStep>,
          ) -> Result<RolloutResult, RolloutError> {
              let final_information = observe(&state)?;
              Ok(RolloutResult {
                  final_state: state,
                  final_information,
                  stop,
                  trace,
              })
          }

          #[cfg(test)]
          mod tests {
              use super::*;
              use urza_cards::R4CardDatabase;
              use urza_core::{
                  BattlefieldZone, CardFace, CommanderZone, CounterState, LibraryKnowledge,
                  ObjectId, PendingDecision, PermanentMode, PermanentState, SourceRef, StackObject,
                  TrueLibrary,
              };

              fn cards() -> R4CardDatabase {
                  R4CardDatabase::load().expect("R4 database")
              }

              fn config(max_steps: u32) -> RolloutConfig {
                  RolloutConfig {
                      root: RootSeed::from_u64(0x524f_4c4c_4f55_5401),
                      world: WorldId(7),
                      max_steps,
                  }
              }

              fn base_state(cards: &R4CardDatabase, turn: u8) -> TrueState {
                  let island = cards.card_id_by_name("Island").expect("Island");
                  TrueState {
                      turn,
                      phase: Phase::PrecombatMain,
                      window: Window::Priority,
                      library: TrueLibrary::new(vec![island], LibraryKnowledge::default())
                          .expect("valid library"),
                      ..TrueState::default()
                  }
              }

              fn permanent(object: u32, card: urza_core::CardDefId) -> PermanentState {
                  PermanentState {
                      object_id: ObjectId(object),
                      card,
                      face: CardFace::Front,
                      tapped: false,
                      summoning_sick: false,
                      token: false,
                      counters: CounterState::default(),
                      mode: PermanentMode::Normal,
                      attached_to: None,
                      granted_ability: None,
                  }
              }

              #[test]
              fn terminal_state_stops_before_policy_action() {
                  let cards = cards();
                  let urza = cards
                      .card_id_by_name("Urza, Lord High Artificer")
                      .expect("Urza");
                  let basalt = cards.card_id_by_name("Basalt Monolith").expect("Basalt");
                  let power = cards.card_id_by_name("Power Artifact").expect("Power Artifact");
                  let mut state = base_state(&cards, 2);
                  state.commander.zone = CommanderZone::Battlefield;
                  let mut aura = permanent(30, power);
                  aura.attached_to = Some(ObjectId(20));
                  state.battlefield = BattlefieldZone::new(vec![
                      permanent(10, urza),
                      permanent(20, basalt),
                      aura,
                  ]);

                  let result = rollout(state, &cards, &DeterministicPolicy, config(16)).unwrap();
                  assert_eq!(
                      result.stop,
                      RolloutStop::Terminal(WinFamily::PowerArtifactBasalt)
                  );
                  assert!(result.trace.is_empty());
              }

              #[test]
              fn pass_only_state_crosses_phases_and_stops_at_horizon() {
                  let cards = cards();
                  let state = base_state(&cards, urza_rules::HORIZON_TURN);
                  let result = rollout(state, &cards, &DeterministicPolicy, config(16)).unwrap();

                  assert_eq!(result.stop, RolloutStop::Horizon);
                  assert_eq!(result.trace.len(), 2);
                  assert!(
                      result
                          .trace
                          .iter()
                          .all(|step| step.class == PolicyActionClass::PassPriority)
                  );
                  assert_eq!(result.final_state.phase, Phase::OpponentCycle);
              }

              #[test]
              fn stack_resolution_rebuilds_candidates_until_horizon() {
                  let cards = cards();
                  let crypt = cards
                      .card_id_by_name("Tormod's Crypt")
                      .expect("Tormod's Crypt");
                  let mut state = base_state(&cards, urza_rules::HORIZON_TURN);
                  state.stack.push(StackObject::Spell {
                      object_id: ObjectId(900),
                      card: crypt,
                      x_value: None,
                  });

                  let result = rollout(state, &cards, &DeterministicPolicy, config(16)).unwrap();
                  assert_eq!(result.stop, RolloutStop::Horizon);
                  assert!(result.trace.len() >= 3);
                  assert_eq!(result.trace[0].class, PolicyActionClass::PassPriority);
                  assert!(
                      result
                          .final_state
                          .battlefield
                          .permanents()
                          .iter()
                          .any(|permanent| permanent.card == crypt)
                  );
              }

              #[test]
              fn same_seed_and_world_replay_random_search_exactly() {
                  let cards = cards();
                  let spellseeker = cards.card_id_by_name("Spellseeker").expect("Spellseeker");
                  let knack = cards
                      .card_id_by_name("Banishing Knack")
                      .expect("Banishing Knack");
                  let helix = cards
                      .card_id_by_name("Retraction Helix")
                      .expect("Retraction Helix");
                  let mystical = cards
                      .card_id_by_name("Mystical Tutor")
                      .expect("Mystical Tutor");
                  let island = cards.card_id_by_name("Island").expect("Island");
                  let mut state = base_state(&cards, 2);
                  state.window = Window::PostObservation;
                  state.library = TrueLibrary::new(
                      vec![knack, helix, mystical, island],
                      LibraryKnowledge::default(),
                  )
                  .expect("valid hidden library");
                  state.battlefield = BattlefieldZone::new(vec![permanent(77, spellseeker)]);
                  state.pending = PendingDecision::TutorTarget {
                      source: SourceRef {
                          object_id: Some(ObjectId(77)),
                          card: spellseeker,
                      },
                  };

                  let cfg = config(1);
                  let left = rollout(state.clone(), &cards, &DeterministicPolicy, cfg).unwrap();
                  let right = rollout(state.clone(), &cards, &DeterministicPolicy, cfg).unwrap();
                  assert_eq!(left, right);
                  assert_eq!(left.stop, RolloutStop::StepLimit);
                  assert_eq!(left.trace.len(), 1);
                  assert_eq!(left.trace[0].class, PolicyActionClass::ContingentDecision);
                  assert!(left.final_state.rng_occurrence_cursor > state.rng_occurrence_cursor);

                  let replayed = replay_trace(state, &cards, cfg, &left.trace).unwrap();
                  assert_eq!(replayed, left.final_state);
              }

              #[test]
              fn raw_object_id_renaming_preserves_public_multistep_trace() {
                  let cards = cards();
                  let cage = cards
                      .card_id_by_name("Grafdigger's Cage")
                      .expect("Grafdigger's Cage");
                  let mut left_state = base_state(&cards, urza_rules::HORIZON_TURN);
                  left_state.battlefield = BattlefieldZone::new(vec![permanent(3, cage)]);
                  let mut right_state = base_state(&cards, urza_rules::HORIZON_TURN);
                  right_state.battlefield = BattlefieldZone::new(vec![permanent(30_003, cage)]);

                  let cfg = config(16);
                  let left = rollout(
                      left_state.clone(),
                      &cards,
                      &DeterministicPolicy,
                      cfg,
                  )
                  .unwrap();
                  let right = rollout(
                      right_state.clone(),
                      &cards,
                      &DeterministicPolicy,
                      cfg,
                  )
                  .unwrap();

                  assert_eq!(left.stop, right.stop);
                  assert_eq!(left.trace, right.trace);
                  assert_eq!(left.final_information, right.final_information);

                  let replayed = replay_trace(right_state, &cards, cfg, &left.trace).unwrap();
                  assert_eq!(observe(&replayed).unwrap(), right.final_information);
              }

              #[test]
              fn semantic_trace_detects_replay_drift() {
                  let cards = cards();
                  let state = base_state(&cards, urza_rules::HORIZON_TURN);
                  let result = rollout(
                      state.clone(),
                      &cards,
                      &DeterministicPolicy,
                      config(16),
                  )
                  .unwrap();
                  let mut trace = result.trace.clone();
                  trace[0].key.kind = u16::MAX;

                  assert!(matches!(
                      replay_trace(state, &cards, config(16), &trace),
                      Err(RolloutError::ReplayCandidateMissing(0))
                  ));
              }
          }
          EOF

      - name: Patch workspace and R5 audit
        run: |
          python - <<'PY'
          from pathlib import Path

          cargo = Path('rust/Cargo.toml')
          text = cargo.read_text()
          needle = '    "crates/urza-policy-bridge",\n'
          if '"crates/urza-rollout"' not in text:
              text = text.replace(needle, needle + '    "crates/urza-rollout",\n', 1)
          cargo.write_text(text)

          cli_cargo = Path('rust/crates/urza-cli/Cargo.toml')
          text = cli_cargo.read_text()
          needle = 'urza-rng = { path = "../urza-rng" }\n'
          if 'urza-rollout' not in text:
              text = text.replace(needle, needle + 'urza-rollout = { path = "../urza-rollout" }\n', 1)
          cli_cargo.write_text(text)

          main = Path('rust/crates/urza-cli/src/main.rs')
          text = main.read_text()
          if 'use urza_rollout::ROLLOUT_VERSION;' not in text:
              text = text.replace(
                  'use urza_rng::RNG_SCHEME_VERSION;\n',
                  'use urza_rng::RNG_SCHEME_VERSION;\nuse urza_rollout::ROLLOUT_VERSION;\n',
                  1,
              )
          old = '''fn run_r5_audit() {
              validate_r4_database().expect("accepted R4 database remains frozen for R5");

              let report = json!({
                  "phase": "R5-candidate-bridge",
                  "policy_phase": POLICY_PHASE,
                  "policy_version": POLICY_VERSION,
                  "candidate_bridge_version": CANDIDATE_BRIDGE_VERSION,
                  "rules_version": RULES_VERSION,
                  "model_version": MODEL_VERSION,
                  "information_schema_version": INFORMATION_SCHEMA_VERSION,
                  "value_key_schema_version": VALUE_KEY_SCHEMA_VERSION,
                  "ordinary_action_families": ORDINARY_ACTION_FAMILY_COUNT,
                  "contingent_action_families": CONTINGENT_ACTION_FAMILY_COUNT,
                  "policy_input_boundary": "urza-policy still consumes only InformationState plus public PolicyCandidate records; execution-state and urza-rules dependencies live in the separate urza-policy-bridge crate",
                  "bridge_contract": "all accepted R4 Action families are mapped to collision-free public semantic keys and opaque decision-local tokens; selected tokens round-trip to exact execution Actions",
                  "selection_contract": "pending contingent decisions are mandatory; Transmute Artifact difference-payment preserves legal mana activations inside the contingent set; otherwise action class and exact public semantic key determine the choice",
                  "hidden_information_contract": "ordinary candidates are derived from InformationState-visible zones and canonical object classes; unknown library order and raw ObjectId numbering cannot affect public candidate identity",
                  "current_scope": "R5 public candidate bridge complete over the frozen R4 action surface",
                  "next_r5_work": "build deterministic multi-step rollout sequencing over CandidateBridge, then connect sampled-world Monte Carlo evaluation",
              });

              println!(
                  "{}",
                  serde_json::to_string_pretty(&report).expect("serializable R5 audit report")
              );
          }
          '''
          new = '''fn run_r5_audit() {
              validate_r4_database().expect("accepted R4 database remains frozen for R5");

              let report = json!({
                  "phase": "R5-deterministic-rollout",
                  "policy_phase": POLICY_PHASE,
                  "policy_version": POLICY_VERSION,
                  "candidate_bridge_version": CANDIDATE_BRIDGE_VERSION,
                  "rollout_version": ROLLOUT_VERSION,
                  "rules_version": RULES_VERSION,
                  "model_version": MODEL_VERSION,
                  "information_schema_version": INFORMATION_SCHEMA_VERSION,
                  "value_key_schema_version": VALUE_KEY_SCHEMA_VERSION,
                  "ordinary_action_families": ORDINARY_ACTION_FAMILY_COUNT,
                  "contingent_action_families": CONTINGENT_ACTION_FAMILY_COUNT,
                  "policy_input_boundary": "urza-policy still consumes only InformationState plus public PolicyCandidate records; execution sequencing lives outside the policy crate",
                  "bridge_contract": "all accepted R4 Action families remain collision-free public candidates with exact opaque-token round trip",
                  "rollout_contract": "each policy step rebuilds CandidateBridge from the current execution state, selects from public semantics, resolves one exact Action, applies it, and repeats until terminal win, T6 horizon, explicit step limit, or no-candidate boundary",
                  "automatic_transition_contract": "automatic phase advancement runs only in OpponentCycle/Untap Window::None with empty stack and no pending decision; contingent choices cannot be bypassed",
                  "rng_contract": "game RNG root/world are explicit rollout inputs and logical event id equals the public step index; replay uses the recorded public semantic action trace, never raw ObjectId provenance",
                  "replay_contract": "recorded semantic traces replay by class plus exact PolicyPublicKey and reject decision-point or candidate drift",
                  "current_scope": "deterministic multi-step R5 rollout sequencing complete over CandidateBridge; urza-mc remains untouched",
                  "next_r5_work": "connect sampled hidden worlds and Monte Carlo root evaluation to the accepted deterministic rollout boundary",
              });

              println!(
                  "{}",
                  serde_json::to_string_pretty(&report).expect("serializable R5 audit report")
              );
          }
          '''
          if old not in text:
              raise SystemExit('current run_r5_audit block not found')
          main.write_text(text.replace(old, new, 1))
          PY

      - name: Refresh lockfile
        working-directory: rust
        run: cargo check --workspace
      - name: Format
        working-directory: rust
        run: cargo fmt --all
      - name: Locked dependency graph
        working-directory: rust
        run: cargo metadata --locked --format-version 1 --no-deps > /dev/null
      - name: Strict clippy
        working-directory: rust
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Workspace tests
        working-directory: rust
        run: cargo test --locked --workspace --all-targets
      - name: Bench compile
        working-directory: rust
        run: cargo check --locked --workspace --benches
      - name: R0 through R5 audits
        working-directory: rust
        run: |
          cargo run --locked -p urza-cli -- r0-audit >/dev/null
          cargo run --locked -p urza-cli -- r1-audit >/dev/null
          cargo run --locked -p urza-cli -- r2-audit >/dev/null
          cargo run --locked -p urza-cli -- r3-audit >/dev/null
          cargo run --locked -p urza-cli -- r4-audit >/dev/null
          cargo run --locked -p urza-cli -- r5-audit

      - name: Record deterministic rollout checkpoint
        run: |
          cat > rust/R5_DETERMINISTIC_ROLLOUT_CHECKPOINT.md <<'EOF'
          # R5 deterministic multi-step rollout checkpoint

          ## Scope

          This checkpoint adds deterministic multi-step execution on top of the accepted public candidate bridge. It does not broaden R4 card/rules coverage and does not start Monte Carlo sampling.

          ## Architecture

          The new `urza-rollout` crate owns sequencing. `urza-policy` remains public-state-only and has no dependency on execution `TrueState` or `urza-rules`. `urza-policy-bridge` remains the only action-enumeration/canonicalization boundary.

          A rollout iteration is:

          1. recognize an already-terminal public state;
          2. perform engine automatic advancement only in true automatic windows;
          3. rebuild `CandidateBridge` from the current exact world;
          4. let `DeterministicPolicy` select one public semantic candidate;
          5. resolve the opaque token to one exact legal `Action`;
          6. apply the action with explicit deterministic RNG coordinates;
          7. repeat.

          Normal rollout stops are terminal win family, T6 horizon, configured step limit, or an explicit no-candidate boundary. Unexpected bridge/policy/rules failures remain typed errors rather than being silently converted into losses.

          ## Decision safety

          `advance_automatic` is invoked only when the exact state is `OpponentCycle` or `Untap` with `Window::None`, an empty stack, and `PendingDecision::None`. Public tutor/reorder/may/payment decisions therefore cannot be skipped by phase automation.

          Stack resolution and contingent decisions are ordinary rollout steps: after each selected action the candidate bridge is rebuilt from the resulting state.

          ## RNG and replay

          `RolloutConfig` explicitly carries `RootSeed`, `WorldId`, and a maximum step count. Each selected public action receives `LogicalEventId(step_index)`. The existing rules occurrence cursor still supplies repeated physical-event identity.

          `RolloutStep` records only public decision-point metadata plus `PolicyActionClass` and the exact collision-free `PolicyPublicKey`. Replay does not persist or match raw execution `ObjectId`s or decision-local tokens. `replay_trace` rebuilds candidates and requires the recorded semantic action to exist uniquely at the same public phase/window/turn before executing it with the same RNG coordinate.

