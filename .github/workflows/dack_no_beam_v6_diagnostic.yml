name: DACK no-beam London v6 diagnostic N4
on:
  push:
    branches: [dack-counterfactual-engine-v1-20261030]
    paths:
      - '.github/workflows/dack_no_beam_v6_diagnostic.yml'
      - 'dack_mulligan_analytic_policy_v6_20261031.py'
      - 'dack_paired_counterfactual_v6_no_beam_mulligan_20261031.py'
      - 'dack_simulator/validation/test_no_beam_london_v6.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m compileall -q dack_mulligan_analytic_policy_v6_20261031.py dack_paired_counterfactual_v6_no_beam_mulligan_20261031.py dack_simulator/validation/test_no_beam_london_v6.py
          python -m unittest discover -s dack_simulator/validation -p test_no_beam_london_v6.py -v
          python dack_paired_counterfactual_v6_no_beam_mulligan_20261031.py --audit
  shard:
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        seed: [2, 3, 4, 5]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run nine-arm no-beam London policy
        run: |
          python -u dack_paired_counterfactual_v6_no_beam_mulligan_20261031.py \
            --start ${{ matrix.seed }} --games 1 \
            --out shards/analytic_${{ matrix.seed }}.json.gz \
            --store shards/analytic_${{ matrix.seed }}.sqlite
      - name: Validate nine outcome blocks and separate version
        run: |
          python - <<'PY'
          import glob,gzip,json,sqlite3
          with gzip.open(glob.glob('shards/analytic_*.json.gz')[0],'rt') as f:x=json.load(f)
          assert x['status']=='PASS' and x['games']==1
          assert x['audit']['rules_version']=='dack_stable_dice_strict_nobeam_analytic_london_v6'
          assert len(x['rows'][0]['arms'])==9
          with sqlite3.connect(glob.glob('shards/analytic_*.sqlite')[0]) as c:
              assert c.execute('SELECT COUNT(*) FROM result_blocks').fetchone()[0]==9
          print('ANALYTIC_NO_BEAM_SHARD_PASS',x['seed_start'],flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analytic-v6-seed-${{ matrix.seed }}
          path: shards/
          retention-days: 7
  pool:
    needs: shard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: analytic-v6-seed-*
          merge-multiple: true
          path: pooled/
      - run: |
          python pool_dack_paired_counterfactual_v1_20261030.py \
            --folder pooled --out benchmark_results/analytic_v6_n4_diagnostic.json \
            --expected-start 2 --expected-games 4
      - uses: actions/upload-artifact@v4
        with:
          name: analytic-v6-n4-paired-diagnostic
          path: benchmark_results/analytic_v6_n4_diagnostic.json
          retention-days: 7
