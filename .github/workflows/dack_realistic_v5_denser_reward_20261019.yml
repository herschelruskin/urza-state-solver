name: Dack V5 Dense Future Draw Reward Pilot
on:
  push:
    branches: [dack-realistic-reward-distribution-20261019]
    paths:
      - 'dack_realistic_v5_denser_reward_20261019.py'
      - '.github/workflows/dack_realistic_v5_denser_reward_20261019.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
env:
  PYTHONHASHSEED: '0'
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile and prove future-order invariance
        run: |
          python -m py_compile dack_realistic_v5_denser_reward_20261019.py
          python -u dack_realistic_v5_denser_reward_20261019.py --audit
      - name: One end-to-end dense rollout policy smoke
        run: |
          python -u dack_realistic_v5_denser_reward_20261019.py \
            --variant current --gid 0 --draws 12 --policy balanced \
            --out smoke.json
  replay:
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 160
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        include:
          - {variant: current, gid: 0, policy: balanced}
          - {variant: current, gid: 1, policy: balanced}
          - {variant: current, gid: 22, policy: balanced}
          - {variant: buck_worldmap, gid: 0, policy: balanced}
          - {variant: buck_worldmap, gid: 1, policy: balanced}
          - {variant: buck_worldmap, gid: 31, policy: balanced}
          - {variant: current, gid: 0, policy: t2_heavy}
          - {variant: current, gid: 1, policy: t2_heavy}
          - {variant: current, gid: 22, policy: t2_heavy}
          - {variant: buck_worldmap, gid: 0, policy: t2_heavy}
          - {variant: buck_worldmap, gid: 1, policy: t2_heavy}
          - {variant: buck_worldmap, gid: 31, policy: t2_heavy}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Re-evaluate missed wins with twelve blinded sampled draws
        run: |
          mkdir -p sampled
          python -u dack_realistic_v5_denser_reward_20261019.py \
            --variant "${{ matrix.variant }}" --gid "${{ matrix.gid }}" --draws 12 \
            --policy "${{ matrix.policy }}" --out "sampled/${{ matrix.variant }}_${{ matrix.gid }}_${{ matrix.policy }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: dack-v5-${{ matrix.variant }}-${{ matrix.gid }}-${{ matrix.policy }}
          path: sampled/*.json
          retention-days: 90
  pool:
    needs: [smoke,replay]
    if: ${{ needs.smoke.result == 'success' && needs.replay.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dack-v5-*
          merge-multiple: true
          path: sampled
      - name: Pool paired outcomes of reward policy ablation
        run: |
          python - <<'PY'
          import glob,json,pathlib
          x=[json.load(open(f)) for f in glob.glob('sampled/*.json')]
          assert len(x)==12,len(x)
          rows=[]
          for a in sorted(x,key=lambda z:(z['variant'],z['game_id'],z['policy'])):
              r=a['result']
              rows.append({'variant':a['variant'],'gid':a['game_id'],
                   'policy':a['policy'],'v2_turn':a['v2_original_win_turn'],
                   'v5_turn':r['win_turn'],'keep':r['keep_n'],
                   'rollout_calls':r['rollout_calls'],
                   'reward_states':r['reward_states']})
          summary={}
          for policy in ('balanced','t2_heavy'):
              for variant in ('current','buck_worldmap'):
                  key=f'{variant}:{policy}'
                  q=[z for z in rows if z['policy']==policy and z['variant']==variant]
                  summary[key]={
                     'n':len(q),
                     'recovered_T2':[z['gid'] for z in q if z['v5_turn'] in (1,2) and z['v2_turn'] not in (1,2)],
                     'recovered_T3':[z['gid'] for z in q if z['v5_turn']>0 and z['v2_turn']==0],
                     'lost_T3':[z['gid'] for z in q if z['v5_turn']==0 and z['v2_turn']>0],
                     'cases':q}
          out={'status':'PASS','scope':'Selected historical misses only; not an unbiased winrate estimate',
               'reward':'Monte Carlo averaged 12 unknown next draws and 6 for T3; legit known-top tutor observations tracked; T2 weighting A/B 1.5 vs 2.5',
               'results':summary}
          pathlib.Path('report.json').write_text(json.dumps(out,indent=2)+'\n')
          print('DACK_V5_DENSER_REWARD_AB_PASS',json.dumps(summary),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dack-v5-denser-reward-selected-cases-summary
          path: report.json
          retention-days: 90
      - name: Publish selected-case diagnostic
        run: |
          mkdir -p benchmark_results
          cp report.json benchmark_results/dack_v5_denser_reward_selected_cases_20261019.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add benchmark_results/dack_v5_denser_reward_selected_cases_20261019.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publish denser next-draw reward sensitivity'
            git pull --rebase origin dack-realistic-reward-distribution-20261019
            git push
          fi
