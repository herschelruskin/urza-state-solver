name: R5 parallel scaling doc repair

on:
  push:
    branches: [rust-engine-rebuild]
    paths:
      - '.github/r5_scaling_doc_repair.py'
      - '.github/workflows/r5-parallel-scaling-doc-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rust-engine-rebuild
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/rust/target/
      - name: Repair closure metadata
        run: python3 .github/r5_scaling_doc_repair.py
      - name: Remove helpers and commit repair
        run: |
          rm -f .github/r5_scaling_doc_repair.py
          rm -f .github/workflows/r5-parallel-scaling-doc-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rust/DEVELOPMENT_LOG.md rust/R5_PARALLEL_SCALING_CHECKPOINT.md .github/r5_scaling_doc_repair.py .github/workflows/r5-parallel-scaling-doc-repair.yml
          git commit -m 'Complete R5 parallel scaling closure metadata'
          git push origin HEAD:rust-engine-rebuild
