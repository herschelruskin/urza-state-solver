name: Phase 5I Hand 12 resource profile

on:
  push:
    branches:
      - phase5i-hand12-resource-profile
  workflow_dispatch:

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONHASHSEED: '0'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile evaluator
        run: python -m py_compile phase5i_hand12_world_eval.py
      - name: Profile exact Hand 12 world 0
        shell: bash
        run: |
          set -uo pipefail
          python phase5i_hand12_world_eval.py --sample-id 0 &
          pid=$!
          echo "PYTHON_PID=$pid"
          while kill -0 "$pid" 2>/dev/null; do
            echo "RESOURCE_SAMPLE $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            ps -o pid,ppid,%cpu,%mem,rss,vsz,etime,cmd -p "$pid" || true
            free -m || true
            sleep 15
          done
          wait "$pid"
