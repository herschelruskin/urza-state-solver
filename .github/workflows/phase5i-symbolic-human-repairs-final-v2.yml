name: Phase 5I symbolic human repairs final v2

on:
  push:
    branches:
      - phase5i-symbolic-human-repairs-final-v2
  workflow_dispatch:

jobs:
  human_hand:
    strategy:
      fail-fast: false
      matrix:
        hand_id: [14,25]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONHASHSEED: '0'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Evaluate exact human hand
        run: python phase5i_human_hand_eval.py --hand-id ${{ matrix.hand_id }}
      - uses: actions/upload-artifact@v4
        with:
          name: phase5i-human-hand-${{ matrix.hand_id }}-symbolic-final-v2
          path: phase5i_human_hand_*.json
