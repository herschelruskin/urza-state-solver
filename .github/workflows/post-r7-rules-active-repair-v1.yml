name: Post-R7 shared-primitives bootstrap

on:
  push:
    branches:
      - rust-engine-rebuild
    paths:
      - '.github/workflows/post-r7-rules-active-repair-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize-shard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check out shared-primitives shard
        run: |
          git fetch origin rust-modeling/shared-primitives
          git checkout -B rust-modeling/shared-primitives origin/rust-modeling/shared-primitives
          test "$(git merge-base rust-modeling/shared-primitives df19087b828dcf9b2a116a4dbe6ee65b55196a8e)" = df19087b828dcf9b2a116a4dbe6ee65b55196a8e
          echo "SHARD_PRE_MATERIALIZE_SHA=$(git rev-parse HEAD)"
          echo "SHARD_BASE_SHA=df19087b828dcf9b2a116a4dbe6ee65b55196a8e"
      - uses: dtolnay/rust-toolchain@1.89
        with:
          components: rustfmt, clippy
      - name: Materialize staged repair into direct source
        run: |
          python rust/scripts/post_r7_rules_active_repair_v1_patch.py
          python rust/scripts/post_r7_rules_active_repair_v1_compile_fix.py
      - name: Normalize formatting
        working-directory: rust
        run: cargo fmt --all
      - name: Format check
        working-directory: rust
        run: cargo fmt --all -- --check
      - name: Workspace all-target compile
        working-directory: rust
        run: cargo check --locked --workspace --all-targets
      - name: Shared repair card fixtures
        working-directory: rust
        run: cargo test --locked -p urza-cards --test post_r7_modeling_completeness_rules_active_repair_v1
      - name: Shared repair bridge fixtures
        working-directory: rust
        run: cargo test --locked -p urza-policy-bridge --test post_r7_modeling_completeness_rules_active_repair_v1
      - name: Forensic Gadgeteer cross-regression
        working-directory: rust
        run: cargo test --locked -p urza-cards --test post_r7_modeling_completeness_forensic_gadgeteer
      - name: Rules regression suite
        working-directory: rust
        run: cargo test --locked -p urza-rules
      - name: Frozen R4 card regression
        working-directory: rust
        run: cargo test --locked -p urza-cards --test r4_final_acceptance
      - name: Frozen R4 terminal regression
        working-directory: rust
        run: cargo test --locked -p urza-cards --test r4_terminal_acceptance
      - name: Strict Clippy
        working-directory: rust
        run: |
          cargo clippy --locked -p urza-core --all-targets -- -D warnings
          cargo clippy --locked -p urza-rules --all-targets -- -D warnings
          cargo clippy --locked -p urza-cards --all-targets -- -D warnings
          cargo clippy --locked -p urza-policy-bridge --all-targets -- -D warnings
      - name: Preserve authoritative completeness baseline
        run: |
          git restore --source=HEAD -- rust/data/goldfish_model_gate.v1.tsv
          git restore --source=HEAD -- rust/crates/urza-mulligan/src/bin/post-r7-modeling-completeness-gate.rs
          git diff --exit-code -- rust/data/goldfish_model_gate.v1.tsv rust/crates/urza-mulligan/src/bin/post-r7-modeling-completeness-gate.rs
      - name: Commit direct Rust source and fixtures to shard
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            rust/crates/urza-core/src/state.rs \
            rust/crates/urza-rules/src/lib.rs \
            rust/crates/urza-cards/src/lib.rs \
            rust/crates/urza-policy-bridge/src/lib.rs \
            rust/crates/urza-cards/tests/post_r7_modeling_completeness_forensic_gadgeteer.rs \
            rust/crates/urza-cards/tests/post_r7_modeling_completeness_rules_active_repair_v1.rs \
            rust/crates/urza-policy-bridge/tests/post_r7_modeling_completeness_rules_active_repair_v1.rs
          git diff --cached --quiet && { echo 'no materialized changes'; exit 1; }
          git commit -m '[R7] Materialize shared-primitives repair candidate'
          git push origin HEAD:rust-modeling/shared-primitives
          echo "SHARD_MATERIALIZED_SHA=$(git rev-parse HEAD)"
