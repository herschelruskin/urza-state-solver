name: Post-R7 shared-primitives direct validation

on:
  push:
    branches:
      - rust-engine-rebuild
    paths:
      - '.github/workflows/post-r7-rules-active-repair-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-committed-shard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check out exact committed shared-primitives candidate
        run: |
          set -euo pipefail
          git fetch origin rust-modeling/shared-primitives
          git checkout --detach c26b57f8c7443c95156ff8b49e9c0acee6ca36a6
          test "$(git rev-parse HEAD)" = c26b57f8c7443c95156ff8b49e9c0acee6ca36a6
          test "$(git merge-base HEAD df19087b828dcf9b2a116a4dbe6ee65b55196a8e)" = df19087b828dcf9b2a116a4dbe6ee65b55196a8e
          echo "SHARD_BASE_SHA=df19087b828dcf9b2a116a4dbe6ee65b55196a8e"
          echo "SHARD_SOURCE_SHA=$(git rev-parse HEAD)"
      - uses: dtolnay/rust-toolchain@1.89
        with:
          components: rustfmt, clippy
      - name: Format check
        working-directory: rust
        run: cargo fmt --all -- --check
      - name: Workspace all-target compile
        working-directory: rust
        run: cargo check --locked --workspace --all-targets
      - name: Shared repair card fixtures
        working-directory: rust
        run: cargo test --locked -p urza-cards --test post_r7_modeling_completeness_rules_active_repair_v1
      - name: Shared repair bridge fixtures
        working-directory: rust
        run: cargo test --locked -p urza-policy-bridge --test post_r7_modeling_completeness_rules_active_repair_v1
      - name: Forensic Gadgeteer cross-regression
        working-directory: rust
        run: cargo test --locked -p urza-cards --test post_r7_modeling_completeness_forensic_gadgeteer
      - name: Rules regression suite
        working-directory: rust
        run: cargo test --locked -p urza-rules
      - name: Frozen R4 card regression
        working-directory: rust
        run: cargo test --locked -p urza-cards --test r4_final_acceptance
      - name: Frozen R4 terminal regression
        working-directory: rust
        run: cargo test --locked -p urza-cards --test r4_terminal_acceptance
      - name: Modeling gate baseline regression
        working-directory: rust
        run: cargo test --locked -p urza-mulligan --bin post-r7-modeling-completeness-gate
      - name: Assert authoritative counts remain unchanged
        working-directory: rust
        run: |
          set -euo pipefail
          if cargo run --quiet --locked -p urza-mulligan --bin post-r7-modeling-completeness-gate -- --enforce > "$RUNNER_TEMP/modeling-enforce.txt" 2>&1; then
            echo 'gate unexpectedly green before backlog is cleared' >&2
            exit 1
          fi
          grep -q $'MODELING_COMPLETENESS_GATE\ttotal=95\tresolved=11\tunresolved=84' "$RUNNER_TEMP/modeling-enforce.txt"
          grep -q 'MODELING_COMPLETENESS_GATE_RED: 84 unresolved active identities remain' "$RUNNER_TEMP/modeling-enforce.txt"
      - name: Strict Clippy
        working-directory: rust
        run: |
          cargo clippy --locked -p urza-core --all-targets -- -D warnings
          cargo clippy --locked -p urza-rules --all-targets -- -D warnings
          cargo clippy --locked -p urza-cards --all-targets -- -D warnings
          cargo clippy --locked -p urza-policy-bridge --all-targets -- -D warnings
          cargo clippy --locked -p urza-mulligan --bin post-r7-modeling-completeness-gate -- -D warnings
      - name: Ensure validation did not mutate tracked source
        run: git diff --exit-code -- . ':(exclude)rust/target/**'
