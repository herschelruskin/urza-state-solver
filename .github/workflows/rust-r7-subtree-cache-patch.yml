name: R7 subtree-cache patch

on:
  push:
    branches: [rust-engine-rebuild]
    paths:
      - ".github/workflows/rust-r7-subtree-cache-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    if: startsWith(github.event.head_commit.message, '[r7-cache-patch]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rust-engine-rebuild
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
      - name: Cache exact incomplete subtree outcomes
        run: |
          echo '' | base64 -d > /tmp/r7-cache-patch.py
          python /tmp/r7-cache-patch.py
      - name: Format
        working-directory: rust
        run: cargo fmt --all
      - name: Targeted tests
        working-directory: rust
        run: cargo test --locked -p urza-mulligan
      - name: Commit patch
        run: |
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add rust/crates/urza-mulligan/src/teacher_search.rs
          git commit -m "[r7-boundary] Cache incomplete R7 teacher subtrees"
          git push origin HEAD:rust-engine-rebuild
