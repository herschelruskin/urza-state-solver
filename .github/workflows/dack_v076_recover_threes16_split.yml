name: DACK v0.76 recover threes 16-19 split

on:
  push:
    branches: [dack-simulator-v0.75-current99]
    paths:
      - .github/workflows/dack_v076_recover_threes16_split.yml

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        start: [16,17,18,19]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recover one paired threes game
        run: |
          mkdir -p paired
          python dack_artifact_paired_v076.py --group threes --start ${{ matrix.start }} --games 1 --out paired/threes_${{ matrix.start }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: artifact-threes-recover-${{ matrix.start }}
          path: paired/threes_${{ matrix.start }}.json
          retention-days: 14
