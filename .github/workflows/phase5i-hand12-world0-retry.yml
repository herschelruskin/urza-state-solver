name: Phase 5I hand 12 world 0 retry

on:
  push:
    branches:
      - phase5i-hand12-world0-retry
  workflow_dispatch:

jobs:
  world0:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile hand 12 world evaluator
        run: python -m py_compile phase5i_hand12_world_eval.py
      - name: Evaluate hand 12 world 0
        run: python phase5i_hand12_world_eval.py --sample-id 0
      - uses: actions/upload-artifact@v4
        with:
          name: phase5i-hand12-world-0
          path: phase5i_hand12_world_0.json
