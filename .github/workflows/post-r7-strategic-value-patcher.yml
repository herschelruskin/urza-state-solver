name: Post-R7 strategic value policy patcher

on:
  push:
    branches: [rust-engine-rebuild]
    paths:
      - '.github/workflows/post-r7-strategic-value-patcher.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89
        with:
          components: rustfmt, clippy
      - name: Apply strategic policy patch
        run: python rust/scripts/post_r7_strategic_value_patch.py
      - name: Format
        working-directory: rust
        run: cargo fmt --all
      - name: Strategic policy tests
        working-directory: rust
        run: cargo test --locked -p urza-policy --all-targets
      - name: Bridge and rollout regressions
        working-directory: rust
        run: cargo test --locked -p urza-policy-bridge -p urza-rollout --all-targets
      - name: Mulligan binary compile
        working-directory: rust
        run: cargo check --locked -p urza-mulligan --all-targets
      - name: Strict Clippy touched surface
        working-directory: rust
        run: cargo clippy --locked -p urza-policy -p urza-policy-bridge -p urza-rollout -p urza-mulligan --all-targets -- -D warnings
      - name: Eight-world strategic smoke
        working-directory: rust
        run: cargo run --quiet --locked -p urza-mulligan --bin post-r7-strategic-value-smoke -- 0 245632 8
      - name: Commit strategic policy candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust/crates/urza-policy/src/lib.rs \
                  rust/crates/urza-policy/tests/strategic_value.rs \
                  rust/crates/urza-rollout/src/lib.rs \
                  rust/crates/urza-rollout/src/liveness.rs \
                  rust/crates/urza-mulligan/src/bin/post-r7-strategic-value-smoke.rs \
                  rust/POST_R7_STRATEGIC_VALUE_POLICY.md \
                  rust/DEVELOPMENT_LOG.md
          git commit -m "[R7] Add strategic public-information value policy"
          git push
# retry runner after checkout stall
