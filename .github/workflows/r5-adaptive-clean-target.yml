name: R5 adaptive target cleanup

on:
  push:
    branches:
      - rust-engine-rebuild
    paths:
      - .github/workflows/r5-adaptive-clean-target.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rust-engine-rebuild
          fetch-depth: 0
      - name: Restore pre-gate target tree
        run: git restore --source=8f075ae984bff550ebcb58c8c553ae3791858700 --staged --worktree rust/target
      - name: Remove temporary cleanup workflow
        run: rm .github/workflows/r5-adaptive-clean-target.yml
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove R5 adaptive build artifacts'
          git push origin HEAD:rust-engine-rebuild
