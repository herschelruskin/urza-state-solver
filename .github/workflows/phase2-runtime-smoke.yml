name: Phase 2 runtime smoke

on:
  push:
    branches:
      - phase2-non-oracle-runtime
  pull_request:
    branches:
      - development
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile Phase 2 runtime
        run: |
          python -m py_compile \
            non_oracle_runtime.py \
            non_oracle_runtime_view.py \
            non_oracle_runtime_value_key.py \
            phase2_runtime_smoke.py
      - name: Phase 2 runtime kernel
        run: python phase2_runtime_smoke.py
      - name: Phase 1 regression gate
        run: python phase1_acceptance_smoke.py
      - name: Architecture regressions
        run: |
          python architecture_smoke.py
          python state_field_audit_smoke.py
          python strategic_value_state_smoke.py
      - name: Diff check
        run: git diff --check
