name: Phase 2 runtime smoke

on:
  push:
    branches:
      - phase2-non-oracle-runtime
  pull_request:
    branches:
      - development
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile Phase 2 runtime
        run: |
          python -m py_compile \
            non_oracle_runtime.py \
            non_oracle_runtime_view.py \
            non_oracle_runtime_value_key.py \
            non_oracle_base_policy.py \
            non_oracle_commander_adapter.py \
            non_oracle_rules_adapter.py \
            non_oracle_turn_engine.py \
            non_oracle_episode.py \
            phase2_coverage_profile.py \
            phase2_runtime_smoke.py \
            base_policy_smoke.py \
            commander_adapter_smoke.py \
            rules_adapter_smoke.py \
            turn_engine_smoke.py \
            episode_smoke.py
      - name: Phase 2 runtime kernel
        run: python phase2_runtime_smoke.py
      - name: Deterministic base policy
        run: python base_policy_smoke.py
      - name: Typed commander casting
        run: python commander_adapter_smoke.py
      - name: Main-phase rules adapter
        run: python rules_adapter_smoke.py
      - name: Typed turn engine
        run: python turn_engine_smoke.py
      - name: Multi-turn deterministic episode
        run: python episode_smoke.py
      - name: Real-deck blocker profile
        run: python phase2_coverage_profile.py --seed 20260821 --count 50 --horizon 6
      - name: Phase 1 regression gate
        run: python phase1_acceptance_smoke.py
      - name: Architecture regressions
        run: |
          python architecture_smoke.py
          python state_field_audit_smoke.py
          python strategic_value_state_smoke.py
      - name: Diff check
        run: git diff --check
