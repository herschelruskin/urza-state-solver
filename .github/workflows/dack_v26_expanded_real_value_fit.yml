name: DACK v26 expanded 256 training and 64 validation real keep values
on:
  push:
    branches: [dack-v26-trace-repair-20261031]
    paths:
      - '.github/workflows/dack_v26_expanded_real_value_fit.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  real_outcomes:
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        include:
          - {split: train, start: 93000}
          - {split: train, start: 93008}
          - {split: train, start: 93016}
          - {split: train, start: 93024}
          - {split: train, start: 93032}
          - {split: train, start: 93040}
          - {split: train, start: 93048}
          - {split: train, start: 93056}
          - {split: train, start: 93064}
          - {split: train, start: 93072}
          - {split: train, start: 93080}
          - {split: train, start: 93088}
          - {split: train, start: 93096}
          - {split: train, start: 93104}
          - {split: train, start: 93112}
          - {split: train, start: 93120}
          - {split: train, start: 93128}
          - {split: train, start: 93136}
          - {split: train, start: 93144}
          - {split: train, start: 93152}
          - {split: train, start: 93160}
          - {split: train, start: 93168}
          - {split: train, start: 93176}
          - {split: train, start: 93184}
          - {split: train, start: 93192}
          - {split: train, start: 93200}
          - {split: train, start: 93208}
          - {split: train, start: 93216}
          - {split: train, start: 93224}
          - {split: train, start: 93232}
          - {split: train, start: 93240}
          - {split: train, start: 93248}
          - {split: validation, start: 94000}
          - {split: validation, start: 94008}
          - {split: validation, start: 94016}
          - {split: validation, start: 94024}
          - {split: validation, start: 94032}
          - {split: validation, start: 94040}
          - {split: validation, start: 94048}
          - {split: validation, start: 94056}
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dack-v26-trace-repair-20261031
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate frozen real beam160 99-physical-slot stage sampler
        run: |
          python -m compileall -q dack_simulator/validation/label_all_stage_keep_values_v26.py
          python dack_mulligan_teacher_features_v13_20261031.py
      - name: Independently label 8 games x all London stages x 4 real shuffled futures
        run: |
          python -u dack_simulator/validation/label_all_stage_keep_values_v26.py \
            --split ${{ matrix.split }} --start ${{ matrix.start }} \
            --games 8 --draws 4 \
            --out sampled/stage_${{ matrix.split }}_${{ matrix.start }}.jsonl.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v26-${{ matrix.split }}-${{ matrix.start }}
          path: sampled/stage_*.jsonl.gz
          retention-days: 30
  fit_and_archive:
    needs: real_outcomes
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dack-v26-trace-repair-20261031
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: v26-*
          merge-multiple: true
          path: datasets/v26_expanded_keep_values
      - name: Require all independent sampled groups and immutable training and validation partitions
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('datasets/v26_expanded_keep_values')
          a=list(p.glob('stage_train_*.jsonl.gz'))
          b=list(p.glob('stage_validation_*.jsonl.gz'))
          assert len(a)==32 and len(b)==8,(len(a),len(b))
          print('V26_ALL_PHYSICAL_TRAIN_AND_VALIDATION_SHARDS_PASS',len(a),len(b),flush=True)
          PY
      - name: Training-only sklearn, no inference dependency
        run: python -m pip install 'scikit-learn>=1.4,<2'
      - name: Train frozen v26 learner with true beam160 outcomes and compare v22 on 94k validation
        run: |
          python -u dack_simulator/validation/train_expanded_keep_value_v26.py \
            --train datasets/v26_expanded_keep_values/stage_train_*.jsonl.gz \
            --validation datasets/v26_expanded_keep_values/stage_validation_*.jsonl.gz \
            --model models/dack_v26_expanded_real_keep_value_EXPERIMENTAL.json \
            --report benchmark_results/v26_real_keep_value_validation.json
      - name: Recompute all four seat-specific London continuation values with new immutable model
        run: |
          python -u dack_simulator/validation/derive_keep_continuation_v22.py \
            --model models/dack_v26_expanded_real_keep_value_EXPERIMENTAL.json \
            --out models/dack_v26_expanded_all_stage_continuations_EXPERIMENTAL.json \
            --start 92000 --games 512
      - name: Ensure physical rules and pure model inference match hashes and prior frozen bottoms
        run: |
          python dack_paired_counterfactual_v26_expanded_keep_DP_20261101.py --audit
      - name: Archive expanded real outcomes, unapproved model, and independent label validation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f datasets/v26_expanded_keep_values/ \
            models/dack_v26_expanded_real_keep_value_EXPERIMENTAL.json \
            models/dack_v26_expanded_all_stage_continuations_EXPERIMENTAL.json \
            benchmark_results/v26_real_keep_value_validation.json
          git commit -m "Archive 10240 independent beam160 keep-outcome labels and guarded experimental v26 real-value London policy"
          git pull --rebase origin dack-v26-trace-repair-20261031
          git push origin HEAD:dack-v26-trace-repair-20261031
      - uses: actions/upload-artifact@v4
        with:
          name: v26-real-value-independent-validation-and-keep-DP
          path: |
            benchmark_results/v26_real_keep_value_validation.json
            models/dack_v26_expanded_real_keep_value_EXPERIMENTAL.json
            models/dack_v26_expanded_all_stage_continuations_EXPERIMENTAL.json
          retention-days: 30
