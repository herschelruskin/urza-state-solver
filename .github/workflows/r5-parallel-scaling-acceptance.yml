name: R5 parallel scaling acceptance

on:
  push:
    branches: [rust-engine-rebuild]
    paths:
      - 'rust/crates/urza-mc/src/parallel.rs'
      - 'rust/crates/urza-mc/examples/r5_scaling_probe.rs'
      - '.github/r5_parallel_scaling_finalize.py'
      - '.github/workflows/r5-parallel-scaling-acceptance.yml'

permissions:
  contents: write

jobs:
  parallel-scaling-acceptance:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rust-engine-rebuild
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/rust/target/
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy
      - name: Finalize audit and checkpoint staging
        working-directory: .
        run: python3 .github/r5_parallel_scaling_finalize.py
      - name: Format
        run: cargo fmt --all
      - name: Locked dependency graph
        run: cargo metadata --locked --format-version 1 > /dev/null
      - name: Strict Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Repeated parallel parity regressions
        run: |
          for run in 1 2 3 4; do
            echo "=== PARALLEL_PARITY_RUN_${run} ==="
            cargo test -p urza-mc --locked parallel::tests -- --nocapture
          done
      - name: Full workspace tests
        run: cargo test --workspace --all-features --locked
      - name: Bench compile
        run: cargo bench --workspace --no-run --locked
      - name: Build release scaling probe
        run: cargo build -p urza-mc --example r5_scaling_probe --release --locked
      - name: Larger-budget scaling matrix
        run: ./target/release/examples/r5_scaling_probe
      - name: Cumulative R0-R5 audits
        run: |
          cargo run -p urza-cli -- r0-audit
          cargo run -p urza-cli -- r1-audit
          cargo run -p urza-cli -- r2-audit
          cargo run -p urza-cli -- r3-audit
          cargo run -p urza-cli -- r4-audit
          cargo run -p urza-cli -- r5-audit
      - name: Record validated closure and remove temporary gate
        working-directory: .
        run: |
          cat >> rust/R5_PARALLEL_SCALING_CHECKPOINT.md <<EOF

          Dedicated production acceptance run: GitHub Actions ${GITHUB_RUN_ID}, result PASS. The gate passed Rust 1.89 formatting, locked dependency metadata, strict workspace all-target/all-feature Clippy, four repeated parallel parity suites, full workspace tests, benchmark compilation, the release 32/64/256-world scaling matrix, and cumulative R0-R5 audits.
          EOF
          cat >> rust/DEVELOPMENT_LOG.md <<EOF
          - Production acceptance run `${GITHUB_RUN_ID}` passed the complete scheduler-scaling gate; permanent foundation validation follows on the finalized docs head.
          EOF
          rm -f .github/workflows/r5-parallel-scaling-acceptance.yml
          rm -f .github/r5_parallel_scaling_finalize.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rust/crates/urza-cli/src/main.rs rust/R5_PARALLEL_SCALING_CHECKPOINT.md rust/DEVELOPMENT_LOG.md .github/r5_parallel_scaling_finalize.py .github/workflows/r5-parallel-scaling-acceptance.yml
          git status --short
          git commit -m 'Close R5 parallel scaling checkpoint'
          git push origin HEAD:rust-engine-rebuild
