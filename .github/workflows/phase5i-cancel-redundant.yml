name: Cancel redundant Phase 5I run

on:
  push:
    branches:
      - phase5i-cancel-redundant

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel superseded bounded monolithic repair
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/${{ github.repository }}/actions/runs/33141562649/cancel
