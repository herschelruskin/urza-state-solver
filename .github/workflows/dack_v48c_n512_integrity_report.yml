name: DACK v48c archived N512 mana plus combo integrity decomposition
on:
  push:
    branches: [dack-v48-turn-aware-legal-mana-features-20261101]
    paths:
      - ".github/workflows/dack_v48c_n512_integrity_report.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Diagnose all archived 512 physical source groups and unchanged first two deck draws
        run: python -m dack_simulator.validation.v48c_n512_draw_integrity_decompose
      - name: Commit validated derived 512-row integrity breakdown to research branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmark_results/v48c_168k_169k_n512_draw_integrity_decomposition.json
          git commit -m "Archive decomposed legal mana witnesses and natural combo draw contamination for N512" || true
          git push origin HEAD:dack-v48-turn-aware-legal-mana-features-20261101
