name: Phase 5I numeric hot-state validation

on:
  push:
    branches:
      - phase5i-numeric-hot-state
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile numeric hot path
        run: |
          python -m py_compile phase5_compact_runtime_encoding.py
          python -m py_compile non_oracle_episode.py
          python -m py_compile phase5_compact_cycle_key_smoke.py
          python -m py_compile phase5_compact_policy_identity_smoke.py
          python -m py_compile phase5_compact_runtime_value_smoke.py
      - name: Identity and episode regressions
        run: |
          python phase5_compact_cycle_key_smoke.py
          python phase5_compact_policy_identity_smoke.py
          python phase5_compact_runtime_value_smoke.py
          python phase5_episode_cycle_smoke.py
          python phase5_compact_cache_identity_smoke.py
          python phase5_monte_carlo_cache_smoke.py
          python phase5_contingent_tutor_q_smoke.py
          python phase5_adaptive_confidence_q_smoke.py
      - name: Source check
        run: git diff --check

  hand12_world0:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONHASHSEED: '0'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Exact Hand 12 world 0 with numeric cycle state
        shell: bash
        run: |
          set -uo pipefail
          python phase5i_hand12_world_eval.py --sample-id 0 &
          pid=$!
          while kill -0 "$pid" 2>/dev/null; do
            echo "RESOURCE $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            ps -o pid,%cpu,%mem,rss,vsz,etime,cmd -p "$pid" || true
            free -m || true
            sleep 30
          done
          wait "$pid"
      - uses: actions/upload-artifact@v4
        with:
          name: phase5i-hand12-world-0-numeric-cycle
          path: phase5i_hand12_world_0.json
