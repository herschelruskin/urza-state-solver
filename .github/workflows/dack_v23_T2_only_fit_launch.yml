name: DACK v23 T2-only true keep-value forest and London continuation DP fit
on:
  push:
    branches: [dack-counterfactual-engine-v1-20261030]
    paths:
      - '.github/workflows/dack_v23_T2_only_fit_launch.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  train_T2_value_and_dp:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dack-counterfactual-engine-v1-20261030
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check fresh objective has exactly zero reward for T3
        run: |
          python -m compileall -q \
            dack_simulator/validation/train_T2_only_keep_value_v23.py \
            dack_simulator/validation/derive_T2_only_continuation_v23.py \
            dack_paired_counterfactual_v23_T2_only_keep_DP_20261101.py
          python - <<'PY'
          from pathlib import Path
          s=Path('dack_simulator/validation/train_T2_only_keep_value_v23.py').read_text()
          assert 'u=sum(1. if x["label_turn"] in (1,2) else 0.' in s
          assert 'T3_reward_is_exactly_zero' in s
          assert 'dack_v23_T2_only_real_keep_value_EXPERIMENTAL.json' in s
          assert 'dack_v23_T2_only_continuations_EXPERIMENTAL.json' in Path('dack_simulator/validation/derive_T2_only_continuation_v23.py').read_text()
          print('V23_T2_ONLY_REWARD_GOAL_PASS',flush=True)
          PY
      - name: Training-only sklearn
        run: python -m pip install 'scikit-learn>=1.4,<2'
      - name: Train directly on P(deployment by T2), not half-point T3 reward
        run: |
          python -u dack_simulator/validation/train_T2_only_keep_value_v23.py \
            --train datasets/v21_all_london_keep_values/stage_train_*.jsonl.gz \
            --validation datasets/v21_all_london_keep_values/stage_validation_*.jsonl.gz \
            --model models/dack_v23_T2_only_real_keep_value_EXPERIMENTAL.json \
            --report benchmark_results/v23_T2_only_keep_value_validation.json
      - name: Calculate first-free London true-T2-utility continuation on separate physical 92k samples
        run: |
          python -u dack_simulator/validation/derive_T2_only_continuation_v23.py \
            --model models/dack_v23_T2_only_real_keep_value_EXPERIMENTAL.json \
            --out models/dack_v23_T2_only_continuations_EXPERIMENTAL.json \
            --start 92000 --games 512
      - name: Audit strict physical game rules and exact model-linked DP
        run: |
          python dack_paired_counterfactual_v23_T2_only_keep_DP_20261101.py --audit
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('models/dack_v23_T2_only_real_keep_value_EXPERIMENTAL.json').read_text())
          r=json.loads(Path('benchmark_results/v23_T2_only_keep_value_validation.json').read_text())
          dp=json.loads(Path('models/dack_v23_T2_only_continuations_EXPERIMENTAL.json').read_text())
          assert m['T3_reward_is_exactly_zero']
          assert r['zero_weight_for_T3']
          assert dp['utility_definition']=='P(deploy_by_T2),T3_reward=0'
          assert m['deployed_policy_approved'] is False and dp['model_approved'] is False
          assert m['training_games']==64 and m['validation_games']==16
          assert r['validation_game_groups']==16
          print('V23_T2_ONLY_VALUE_DP_VALIDATED',json.dumps({
              'validation':r['independent_validation_metrics'],
              'seat_0':dp['seat_continuations']['0']['thresholds_by_london_stage']
          }),flush=True)
          PY
      - name: Save frozen T2-only experimental model, validation, DP without replacing v22
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f models/dack_v23_T2_only_real_keep_value_EXPERIMENTAL.json models/dack_v23_T2_only_continuations_EXPERIMENTAL.json benchmark_results/v23_T2_only_keep_value_validation.json
          git commit -m "Archive v23 T2-only actual-outcome keep value and seat-specific London DP"
          git pull --rebase origin dack-counterfactual-engine-v1-20261030
          git push origin HEAD:dack-counterfactual-engine-v1-20261030
      - uses: actions/upload-artifact@v4
        with:
          name: dack-v23-T2-only-model-and-continuations
          path: |
            models/dack_v23_T2_only_real_keep_value_EXPERIMENTAL.json
            models/dack_v23_T2_only_continuations_EXPERIMENTAL.json
            benchmark_results/v23_T2_only_keep_value_validation.json
          retention-days: 21
