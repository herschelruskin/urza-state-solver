name: Post-R7 leave/LTB shared-primitives materialization

on:
  push:
    branches:
      - rust-modeling/shared-primitives
    paths:
      - '.github/workflows/post-r7-leave-ltb-materialize.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize-leave-ltb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.89
        with:
          components: rustfmt, clippy
      - name: Verify fixture ancestry and exact source blobs
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 1a216884753a24ef8a610a9dd2f2b53018bfe4f0 HEAD
          test "$(git hash-object rust/crates/urza-core/src/state.rs)" = e0615adb906fd3c07b9a5b13600d52bffd9ad7d0
          test "$(git hash-object rust/crates/urza-info/src/lib.rs)" = 4e8a291f49f0e2b618660b90565afedfac881cdc
          test "$(git hash-object rust/crates/urza-rules/src/lib.rs)" = 69e0a17421390e7121f3ddb27ce9997ed2b72852
      - name: Confirm new leave/LTB fixture is red before repair
        working-directory: rust
        run: |
          set -euo pipefail
          if cargo test --locked -p urza-cards --test post_r7_shared_primitives_leave_ltb > "$RUNNER_TEMP/pre-repair.txt" 2>&1; then
            echo 'leave/LTB fixture unexpectedly green before repair' >&2
            exit 1
          fi
          grep -q 'DeferredControlledTrigger' "$RUNNER_TEMP/pre-repair.txt"
      - name: Materialize reviewed shared leave/LTB repair
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          CORE = Path('rust/crates/urza-core/src/state.rs')
          INFO = Path('rust/crates/urza-info/src/lib.rs')
          RULES = Path('rust/crates/urza-rules/src/lib.rs')

          def block(*lines):
              return '\n'.join(lines) + '\n'

          def replace_once(path, old, new):
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one exact match, found {count}: {old[:140]!r}')
              path.write_text(text.replace(old, new, 1))

          def regex_once(path, pattern, replacement):
              text = path.read_text()
              new, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'{path}: expected one regex match, found {count}: {pattern[:140]!r}')
              path.write_text(new)

          # urza-core: typed trigger deferral is authoritative exact state.
          replace_once(
              CORE,
              block(
                  '    ManaDrainCredit {',
                  '        colorless: u16,',
                  '        due_turn: u8,',
                  '    },',
                  '    PermissionExpiry {',
              ),
              block(
                  '    ManaDrainCredit {',
                  '        colorless: u16,',
                  '        due_turn: u8,',
                  '    },',
                  '    DeferredControlledTrigger {',
                  '        source: SourceRef,',
                  '        ability: AbilityId,',
                  '    },',
                  '    PermissionExpiry {',
              ),
          )
          replace_once(
              CORE,
              '                DelayedEvent::BaubleDraw { .. } | DelayedEvent::ManaDrainCredit { .. } => {}\n',
              block(
                  '                DelayedEvent::BaubleDraw { .. }',
                  '                | DelayedEvent::ManaDrainCredit { .. }',
                  '                | DelayedEvent::DeferredControlledTrigger { .. } => {}',
              ),
          )
          replace_once(
              CORE,
              block(
                  '        let delayed = self.delayed_events.iter().filter_map(|event| match event {',
                  '            DelayedEvent::BaubleDraw { source, .. } => Some(*source),',
                  '            _ => None,',
                  '        });',
              ),
              block(
                  '        let delayed = self.delayed_events.iter().filter_map(|event| match event {',
                  '            DelayedEvent::BaubleDraw { source, .. }',
                  '            | DelayedEvent::DeferredControlledTrigger { source, .. } => Some(*source),',
                  '            _ => None,',
                  '        });',
              ),
          )

          # urza-info: deferred triggers remain public strategic state while resolution is staged.
          replace_once(
              INFO,
              block(
                  '    ManaDrainCredit {',
                  '        colorless: u16,',
                  '        due_turn: u8,',
                  '    },',
                  '    PermissionExpiry {',
              ),
              block(
                  '    ManaDrainCredit {',
                  '        colorless: u16,',
                  '        due_turn: u8,',
                  '    },',
                  '    DeferredControlledTrigger {',
                  '        source: ObservedSourceRef,',
                  '        ability: AbilityId,',
                  '    },',
                  '    PermissionExpiry {',
              ),
          )
          replace_once(
              INFO,
              block(
                  '            DelayedEvent::ManaDrainCredit {',
                  '                colorless,',
                  '                due_turn,',
                  '            } => ObservedDelayedEvent::ManaDrainCredit {',
                  '                colorless: *colorless,',
                  '                due_turn: *due_turn,',
                  '            },',
                  '            DelayedEvent::PermissionExpiry {',
              ),
              block(
                  '            DelayedEvent::ManaDrainCredit {',
                  '                colorless,',
                  '                due_turn,',
                  '            } => ObservedDelayedEvent::ManaDrainCredit {',
                  '                colorless: *colorless,',
                  '                due_turn: *due_turn,',
                  '            },',
                  '            DelayedEvent::DeferredControlledTrigger { source, ability } => {',
                  '                ObservedDelayedEvent::DeferredControlledTrigger {',
                  '                    source: observe_source(*source, &object_classes),',
                  '                    ability: *ability,',
                  '                }',
                  '            }',
                  '            DelayedEvent::PermissionExpiry {',
              ),
          )

          # urza-rules version and obsolete attached-sacrifice deferral.
          replace_once(
              RULES,
              'pub const POST_R7_RULES_VERSION: &str = "post_r7_modeling_completeness_v3_targeted_permissions";',
              'pub const POST_R7_RULES_VERSION: &str = "post_r7_modeling_completeness_v4_shared_leave_ltb";',
          )
          replace_once(
              RULES,
              block(
                  '    #[error("object {0:?} has an incoming attachment; this sacrifice interaction is deferred")]',
                  '    AttachedSacrificeDeferred(ObjectId),',
              ),
              '',
          )

          # Mana-source sacrifices use the common leave primitive and stage any LTB triggers afterward.
          replace_once(
              RULES,
              block(
                  '    if sacrifice_source {',
                  '        sacrifice_artifact(state, source)?;',
                  '    } else {',
                  '        set_tapped(state, source)?;',
                  '    }',
                  '    state.mana = mana;',
                  '    state.life = life;',
                  '    Ok(())',
              ),
              block(
                  '    let leave_triggers = if sacrifice_source {',
                  '        leave_permanent(state, cards, source, LeaveDestination::Graveyard)?',
                  '    } else {',
                  '        set_tapped(state, source)?;',
                  '        Vec::new()',
                  '    };',
                  '    state.mana = mana;',
                  '    state.life = life;',
                  '    stage_trigger_batch(',
                  '        state,',
                  '        SourceRef {',
                  '            object_id: None,',
                  '            card: permanent.card,',
                  '        },',
                  '        leave_triggers,',
                  '    );',
                  '    Ok(())',
              ),
          )

          # Grinding Station: activated ability goes on stack below LTB triggers created while paying costs.
          regex_once(
              RULES,
              r'fn activate_grinding_station<D: CardDatabase>\(.*?\n\}\n\nfn activate_chrome_dome',
              '\n'.join([
                  'fn activate_grinding_station<D: CardDatabase>(',
                  '    state: &mut TrueState,',
                  '    cards: &D,',
                  '    source: ObjectId,',
                  '    sacrifice: CanonicalObjectId,',
                  ') -> Result<(), RuleError> {',
                  '    ensure_priority(state)?;',
                  '    ensure_no_pending_decision(state)?;',
                  '    let station = battlefield_permanent(state, source)?.clone();',
                  '    if station.tapped {',
                  '        return Err(RuleError::PermanentTapped(source));',
                  '    }',
                  '    if card_profile(cards, station.card)?.engine != EngineKind::GrindingStation {',
                  '        return Err(RuleError::UnsupportedCardMechanic(station.card));',
                  '    }',
                  '    let sacrifice_id = resolve_canonical_object(state, sacrifice)',
                  '        .map_err(|error| match error {',
                  '            urza_info::ObservationError::InvalidState(error) => RuleError::InvalidState(error),',
                  '        })?',
                  '        .ok_or(RuleError::MissingCanonicalPermanent(sacrifice))?;',
                  '    validate_sacrifice_artifact(state, cards, sacrifice_id)?;',
                  '    let sacrificed_card = battlefield_permanent(state, sacrifice_id)?.card;',
                  '    set_tapped(state, source)?;',
                  '    let leave_triggers =',
                  '        leave_permanent(state, cards, sacrifice_id, LeaveDestination::Graveyard)?;',
                  '    state.stack.push(StackObject::ActivatedAbility {',
                  '        source: SourceRef {',
                  '            object_id: Some(source),',
                  '            card: station.card,',
                  '        },',
                  '        ability: ABILITY_GRINDING_STATION_MILL,',
                  '        parameter: None,',
                  '    });',
                  '    stage_trigger_batch(',
                  '        state,',
                  '        SourceRef {',
                  '            object_id: None,',
                  '            card: sacrificed_card,',
                  '        },',
                  '        leave_triggers,',
                  '    );',
                  '    state.window = Window::Priority;',
                  '    Ok(())',
                  '}',
                  '',
                  'fn activate_chrome_dome',
              ]),
          )

          # Clue sacrifice no longer rejects incoming attachments.
          regex_once(
              RULES,
              r'fn activate_clue_draw<D: CardDatabase>\(.*?\n\}\n\nfn activate_urza_spin',
              '\n'.join([
                  'fn activate_clue_draw<D: CardDatabase>(',
                  '    state: &mut TrueState,',
                  '    cards: &D,',
                  '    source: ObjectId,',
                  '    payment: ManaPayment,',
                  ') -> Result<(), RuleError> {',
                  '    ensure_priority(state)?;',
                  '    ensure_no_pending_decision(state)?;',
                  '    let permanent = battlefield_permanent(state, source)?.clone();',
                  '    if cards.clue_token_card() != Some(permanent.card) {',
                  '        return Err(RuleError::UnsupportedCardMechanic(permanent.card));',
                  '    }',
                  '    let cost = reduced_artifact_activation_cost(state, cards, source, 2)?;',
                  '    validate_payment(state.mana, payment, cost)?;',
                  '',
                  '    spend_payment(&mut state.mana, payment);',
                  '    let leave_triggers =',
                  '        leave_permanent(state, cards, source, LeaveDestination::Graveyard)?;',
                  '    state.stack.push(StackObject::ActivatedAbility {',
                  '        source: SourceRef {',
                  '            object_id: Some(source),',
                  '            card: permanent.card,',
                  '        },',
                  '        ability: ABILITY_CLUE_DRAW,',
                  '        parameter: None,',
                  '    });',
                  '    stage_trigger_batch(',
                  '        state,',
                  '        SourceRef {',
                  '            object_id: None,',
                  '            card: permanent.card,',
                  '        },',
                  '        leave_triggers,',
                  '    );',
                  '    state.window = Window::Priority;',
                  '    Ok(())',
                  '}',
                  '',
                  'fn activate_urza_spin',
              ]),
          )

          # Reshape casting cost LTB triggers and cast triggers become one ordering batch above the spell.
          regex_once(
              RULES,
              r'fn cast_reshape<D: CardDatabase>\(.*?\n\}\n\nfn activate_repurposing_bay',
              '\n'.join([
                  'fn cast_reshape<D: CardDatabase>(',
                  '    state: &mut TrueState,',
                  '    cards: &D,',
                  '    card: CardDefId,',
                  '    x_value: u16,',
                  '    sacrifice: ObjectId,',
                  '    payment: ManaPayment,',
                  ') -> Result<(), RuleError> {',
                  '    let profile = card_profile(cards, card)?;',
                  '    ensure_spell_cast_window(state, cards, profile)?;',
                  '    if profile.role != R2CardRole::SearchSpell',
                  '        || profile.special_search != SpecialSearchKind::Reshape',
                  '    {',
                  '        return Err(RuleError::UnsupportedCardMechanic(card));',
                  '    }',
                  '    if !state.hand.cards().contains(&card) {',
                  '        return Err(RuleError::CardNotInHand(card));',
                  '    }',
                  '    validate_sacrifice_artifact(state, cards, sacrifice)?;',
                  '    let sacrificed_card = battlefield_permanent(state, sacrifice)?.card;',
                  '    let cost = ManaCost {',
                  '        blue: 2,',
                  '        generic: x_value,',
                  '        ..ManaCost::default()',
                  '    };',
                  '    validate_payment(state.mana, payment, cost)?;',
                  '    let object_id = next_object_id(state)?;',
                  '',
                  '    spend_payment(&mut state.mana, payment);',
                  '    let mut triggers =',
                  '        leave_permanent(state, cards, sacrifice, LeaveDestination::Graveyard)?;',
                  '    let removed = state.hand.remove_one(card);',
                  '    debug_assert!(removed);',
                  '    state.stack.push(StackObject::Spell {',
                  '        object_id,',
                  '        card,',
                  '        x_value: Some(x_value),',
                  '    });',
                  '    triggers.extend(collect_cast_triggers(state, cards, card));',
                  '    stage_trigger_batch(',
                  '        state,',
                  '        SourceRef {',
                  '            object_id: None,',
                  '            card,',
                  '        },',
                  '        triggers,',
                  '    );',
                  '    let _ = sacrificed_card;',
                  '    state.spell_cast_this_turn = true;',
                  '    state.window = Window::Priority;',
                  '    Ok(())',
                  '}',
                  '',
                  'fn activate_repurposing_bay',
              ]),
          )

          # Repurposing Bay uses the same departure primitive, with LTB trigger above its ability.
          regex_once(
              RULES,
              r'fn activate_repurposing_bay<D: CardDatabase>\(.*?\n\}\n\nfn cast_paid_spell',
              '\n'.join([
                  'fn activate_repurposing_bay<D: CardDatabase>(',
                  '    state: &mut TrueState,',
                  '    cards: &D,',
                  '    source: ObjectId,',
                  '    sacrifice: ObjectId,',
                  '    payment: ManaPayment,',
                  ') -> Result<(), RuleError> {',
                  '    ensure_sorcery_window(state)?;',
                  '    if source == sacrifice {',
                  '        return Err(RuleError::BayCannotSacrificeSelf);',
                  '    }',
                  '    let bay = battlefield_permanent(state, source)?.clone();',
                  '    if bay.tapped {',
                  '        return Err(RuleError::PermanentTapped(source));',
                  '    }',
                  '    let bay_profile = card_profile(cards, bay.card)?;',
                  '    if bay_profile.special_search != SpecialSearchKind::RepurposingBay {',
                  '        return Err(RuleError::UnsupportedCardMechanic(bay.card));',
                  '    }',
                  '    let sacrificed = validate_sacrifice_artifact(state, cards, sacrifice)?;',
                  '    let sacrificed_card = battlefield_permanent(state, sacrifice)?.card;',
                  '    let cost = reduced_artifact_activation_cost(state, cards, source, 2)?;',
                  '    validate_payment(state.mana, payment, cost)?;',
                  '',
                  '    spend_payment(&mut state.mana, payment);',
                  '    set_tapped(state, source)?;',
                  '    let leave_triggers =',
                  '        leave_permanent(state, cards, sacrifice, LeaveDestination::Graveyard)?;',
                  '    state.stack.push(StackObject::ActivatedAbility {',
                  '        source: SourceRef {',
                  '            object_id: Some(source),',
                  '            card: bay.card,',
                  '        },',
                  '        ability: ABILITY_REPURPOSING_BAY_SEARCH,',
                  '        parameter: Some(sacrificed.mana_value),',
                  '    });',
                  '    stage_trigger_batch(',
                  '        state,',
                  '        SourceRef {',
                  '            object_id: None,',
                  '            card: sacrificed_card,',
                  '        },',
                  '        leave_triggers,',
                  '    );',
                  '    state.window = Window::Priority;',
                  '    Ok(())',
                  '}',
                  '',
                  'fn cast_paid_spell',
              ]),
          )

          # Chrome delayed sacrifice and Knack bounce both use central departure.
          regex_once(
              RULES,
              r'fn resolve_chrome_dome_sacrifice<D: CardDatabase>\(.*?\n\}\n\nfn resolve_knack_bounce',
              '\n'.join([
                  'fn resolve_chrome_dome_sacrifice<D: CardDatabase>(',
                  '    state: &mut TrueState,',
                  '    cards: &D,',
                  '    source: SourceRef,',
                  ') -> Result<Transition, RuleError> {',
                  '    if let Some(object_id) = source.object_id',
                  '        && state',
                  '            .battlefield',
                  '            .get(object_id)',
                  '            .is_some_and(|permanent| permanent.card == source.card)',
                  '    {',
                  '        let triggers =',
                  '            leave_permanent(state, cards, object_id, LeaveDestination::Graveyard)?;',
                  '        stage_trigger_batch(',
                  '            state,',
                  '            SourceRef {',
                  '                object_id: None,',
                  '                card: source.card,',
                  '            },',
                  '            triggers,',
                  '        );',
                  '    }',
                  '    state.window = Window::Priority;',
                  '    Ok(Transition::default())',
                  '}',
                  '',
                  'fn resolve_knack_bounce',
              ]),
          )
          regex_once(
              RULES,
              r'fn resolve_knack_bounce<D: CardDatabase>\(.*?\n\}\n\nfn resolve_aura_spell',
              '\n'.join([
                  'fn resolve_knack_bounce<D: CardDatabase>(',
                  '    state: &mut TrueState,',
                  '    cards: &D,',
                  '    target: SourceRef,',
                  ') -> Result<Transition, RuleError> {',
                  '    let Some(object_id) = target.object_id else {',
                  '        state.window = Window::Priority;',
                  '        return Ok(Transition::default());',
                  '    };',
                  '    let Some(permanent) = state.battlefield.get(object_id).cloned() else {',
                  '        state.window = Window::Priority;',
                  '        return Ok(Transition::default());',
                  '    };',
                  '    if permanent.card != target.card {',
                  '        state.window = Window::Priority;',
                  '        return Ok(Transition::default());',
                  '    }',
                  '    let triggers = leave_permanent(state, cards, object_id, LeaveDestination::Hand)?;',
                  '    stage_trigger_batch(',
                  '        state,',
                  '        SourceRef {',
                  '            object_id: None,',
                  '            card: permanent.card,',
                  '        },',
                  '        triggers,',
                  '    );',
                  '    state.window = Window::Priority;',
                  '    Ok(Transition::default())',
                  '}',
                  '',
                  'fn resolve_aura_spell',
              ]),
          )

          # Top return and Saga final sacrifice also route through central departure.
          replace_once(RULES, '            resolve_top_draw(state, source)\n', '            resolve_top_draw(state, cards, source)\n')
          regex_once(
              RULES,
              r'fn resolve_top_draw\(state: &mut TrueState, source: SourceRef\) -> Result<Transition, RuleError> \{.*?\n\}\n\nfn resolve_clue_draw',
              '\n'.join([
                  'fn resolve_top_draw<D: CardDatabase>(',
                  '    state: &mut TrueState,',
                  '    cards: &D,',
                  '    source: SourceRef,',
                  ') -> Result<Transition, RuleError> {',
                  '    let drawn = draw_cards(state, 1)?;',
                  '    let mut observations = vec![RulesObservation::CardsDrawn(drawn)];',
                  '    if let Some(object_id) = source.object_id',
                  '        && state',
                  '            .battlefield',
                  '            .get(object_id)',
                  '            .is_some_and(|permanent| permanent.card == source.card)',
                  '    {',
                  '        let triggers =',
                  '            leave_permanent(state, cards, object_id, LeaveDestination::LibraryTop)?;',
                  '        stage_trigger_batch(',
                  '            state,',
                  '            SourceRef {',
                  '                object_id: None,',
                  '                card: source.card,',
                  '            },',
                  '            triggers,',
                  '        );',
                  '    }',
                  '    state.window = Window::Priority;',
                  '    observations.shrink_to_fit();',
                  '    Ok(Transition { observations })',
                  '}',
                  '',
                  'fn resolve_clue_draw',
              ]),
          )
          regex_once(
              RULES,
              r'fn remove_permanent_to_library_top\(.*?\n\}\n\nfn same_multiset',
              'fn same_multiset',
          )
          replace_once(
              RULES,
              '            sacrifice_saga_after_final_chapter(state, source)?;\n',
              '            sacrifice_saga_after_final_chapter(state, cards, source)?;\n',
          )
          regex_once(
              RULES,
              r'fn sacrifice_saga_after_final_chapter\(.*?\n\}\n\nfn stage_top_reorder',
              '\n'.join([
                  'fn sacrifice_saga_after_final_chapter<D: CardDatabase>(',
                  '    state: &mut TrueState,',
                  '    cards: &D,',
                  '    source: SourceRef,',
                  ') -> Result<(), RuleError> {',
                  '    let Some(object_id) = source.object_id else {',
                  '        return Ok(());',
                  '    };',
                  '    let Some(permanent) = state.battlefield.get(object_id).cloned() else {',
                  '        return Ok(());',
                  '    };',
                  '    if permanent.card != source.card || permanent.mode != PermanentMode::UrzasSaga {',
                  '        return Ok(());',
                  '    }',
                  '    let triggers =',
                  '        leave_permanent(state, cards, object_id, LeaveDestination::Graveyard)?;',
                  '    stage_trigger_batch(',
                  '        state,',
                  '        SourceRef {',
                  '            object_id: None,',
                  '            card: permanent.card,',
                  '        },',
                  '        triggers,',
                  '    );',
                  '    Ok(())',
                  '}',
                  '',
                  'fn stage_top_reorder',
              ]),
          )

          # Transmute sacrifice keeps LTB triggers typed/deferred until the staged spell resolution finishes.
          replace_once(
              RULES,
              block(
                  '    sacrifice_artifact(state, artifact)?;',
                  '    stage_parameterized_search(',
              ),
              block(
                  '    let leave_triggers =',
                  '        leave_permanent(state, cards, artifact, LeaveDestination::Graveyard)?;',
                  '    defer_controlled_triggers(state, leave_triggers);',
                  '    stage_parameterized_search(',
              ),
          )
          replace_once(
              RULES,
              block(
                  '            let Some(target) = target else {',
                  '                state.pending = PendingDecision::None;',
                  '                state.window = Window::Priority;',
                  '                return Ok(Transition {',
              ),
              block(
                  '            let Some(target) = target else {',
                  '                state.pending = PendingDecision::None;',
                  '                state.window = Window::Priority;',
                  '                flush_deferred_controlled_triggers(state, source, Vec::new());',
                  '                return Ok(Transition {',
              ),
          )
          replace_once(
              RULES,
              block(
                  '            if target_profile.mana_value <= sacrificed_mana_value {',
                  '                let entered = put_card_onto_battlefield(state, cards, target)?;',
                  '                state.pending = PendingDecision::None;',
                  '                state.window = Window::Priority;',
                  '                Ok(Transition {',
                  '                    observations: vec![',
                  '                        RulesObservation::SearchCompleted {',
                  '                            source: source.card,',
                  '                            target: Some(target),',
                  '                            destination: SearchDestination::Battlefield,',
                  '                        },',
                  '                        entered,',
                  '                    ],',
                  '                })',
              ),
              block(
                  '            if target_profile.mana_value <= sacrificed_mana_value {',
                  '                let (entered, entry_triggers) =',
                  '                    put_card_onto_battlefield_collect_triggers(state, cards, target)?;',
                  '                state.pending = PendingDecision::None;',
                  '                state.window = Window::Priority;',
                  '                flush_deferred_controlled_triggers(state, source, entry_triggers);',
                  '                Ok(Transition {',
                  '                    observations: vec![',
                  '                        RulesObservation::SearchCompleted {',
                  '                            source: source.card,',
                  '                            target: Some(target),',
                  '                            destination: SearchDestination::Battlefield,',
                  '                        },',
                  '                        entered,',
                  '                    ],',
                  '                })',
              ),
          )
          regex_once(
              RULES,
              r'fn pay_transmute_difference<D: CardDatabase>\(.*?\n\}\n\nfn consume_shared_search_shuffle',
              '\n'.join([
                  'fn pay_transmute_difference<D: CardDatabase>(',
                  '    state: &mut TrueState,',
                  '    cards: &D,',
                  '    payment: Option<ManaPayment>,',
                  ') -> Result<Transition, RuleError> {',
                  '    if state.window != Window::Resolving {',
                  '        return Err(RuleError::NoTransmutePaymentPending);',
                  '    }',
                  '    let PendingDecision::TransmuteDifferencePayment {',
                  '        source,',
                  '        target,',
                  '        difference,',
                  '    } = state.pending.clone()',
                  '    else {',
                  '        return Err(RuleError::NoTransmutePaymentPending);',
                  '    };',
                  '',
                  '    let destination;',
                  '    let mut observations = Vec::new();',
                  '    let mut entry_triggers = Vec::new();',
                  '    if let Some(payment) = payment {',
                  '        let cost = ManaCost {',
                  '            generic: difference.0,',
                  '            ..ManaCost::default()',
                  '        };',
                  '        validate_payment(state.mana, payment, cost)?;',
                  '        let object_id = next_object_id(state)?;',
                  '        spend_payment(&mut state.mana, payment);',
                  '        let (entered, triggers) =',
                  '            put_card_onto_battlefield_with_id_collect_triggers(',
                  '                state, cards, target, object_id,',
                  '            )?;',
                  '        entry_triggers = triggers;',
                  '        destination = SearchDestination::Battlefield;',
                  '        observations.push(entered);',
                  '    } else {',
                  '        state.graveyard.insert(target);',
                  '        destination = SearchDestination::Graveyard;',
                  '    }',
                  '',
                  '    state.pending = PendingDecision::None;',
                  '    state.window = Window::Priority;',
                  '    flush_deferred_controlled_triggers(state, source, entry_triggers);',
                  '    observations.insert(',
                  '        0,',
                  '        RulesObservation::SearchCompleted {',
                  '            source: source.card,',
                  '            target: Some(target),',
                  '            destination,',
                  '        },',
                  '    );',
                  '    Ok(Transition { observations })',
                  '}',
                  '',
                  'fn consume_shared_search_shuffle',
              ]),
          )

          # Central departure owns attachment cleanup, token disappearance, delayed-object cleanup, and Cam LTB generation.
          regex_once(
              RULES,
              r'fn sacrifice_artifact\(.*?\n\}\n\nfn put_card_onto_battlefield',
              '\n'.join([
                  '#[derive(Debug, Clone, Copy)]',
                  'enum LeaveDestination {',
                  '    Graveyard,',
                  '    Hand,',
                  '    LibraryTop,',
                  '}',
                  '',
                  'fn leave_permanent<D: CardDatabase>(',
                  '    state: &mut TrueState,',
                  '    cards: &D,',
                  '    object: ObjectId,',
                  '    destination: LeaveDestination,',
                  ') -> Result<Vec<StackObject>, RuleError> {',
                  '    let mut permanents = state.battlefield.permanents().to_vec();',
                  '    let Some(index) = permanents',
                  '        .iter()',
                  '        .position(|permanent| permanent.object_id == object)',
                  '    else {',
                  '        return Err(RuleError::MissingPermanent(object));',
                  '    };',
                  '    let permanent = permanents.remove(index);',
                  '',
                  '    for candidate in &mut permanents {',
                  '        if candidate.attached_to == Some(object)',
                  '            && candidate.mode == PermanentMode::RealityChipAttached',
                  '        {',
                  '            candidate.mode = PermanentMode::RealityChipCreature;',
                  '            candidate.attached_to = None;',
                  '        }',
                  '    }',
                  '',
                  '    let mut removed_attachments = Vec::new();',
                  '    permanents.retain(|candidate| {',
                  '        if candidate.attached_to == Some(object) {',
                  '            removed_attachments.push(candidate.clone());',
                  '            false',
                  '        } else {',
                  '            true',
                  '        }',
                  '    });',
                  '    state.battlefield = BattlefieldZone::new(permanents);',
                  '',
                  '    let mut departed_objects = BTreeSet::new();',
                  '    departed_objects.insert(object);',
                  '    for attachment in &removed_attachments {',
                  '        departed_objects.insert(attachment.object_id);',
                  '        if !attachment.token {',
                  '            state.graveyard.insert(attachment.card);',
                  '        }',
                  '    }',
                  '    state.delayed_events.retain(|event| {',
                  '        !matches!(',
                  '            event,',
                  '            DelayedEvent::ChromeCopySacrifice { object, .. }',
                  '                if departed_objects.contains(object)',
                  '        )',
                  '    });',
                  '',
                  '    if !permanent.token {',
                  '        match destination {',
                  '            LeaveDestination::Graveyard => state.graveyard.insert(permanent.card),',
                  '            LeaveDestination::Hand => state.hand.insert(permanent.card),',
                  '            LeaveDestination::LibraryTop => {',
                  '                let mut library = Vec::with_capacity(state.library.cards().len() + 1);',
                  '                library.push(permanent.card);',
                  '                library.extend_from_slice(state.library.cards());',
                  '                let old = state.library.knowledge();',
                  '                state.library = TrueLibrary::new(',
                  '                    library,',
                  '                    LibraryKnowledge {',
                  '                        known_top: old',
                  '                            .known_top',
                  '                            .checked_add(1)',
                  '                            .ok_or(RuleError::ArithmeticOverflow)?,',
                  '                        known_bottom: old.known_bottom,',
                  '                    },',
                  '                )?;',
                  '            }',
                  '        }',
                  '    }',
                  '',
                  '    let mut triggers = Vec::new();',
                  '    for departed in std::iter::once(&permanent).chain(removed_attachments.iter()) {',
                  '        if cards',
                  '            .profile(departed.card)',
                  '            .is_some_and(|profile| profile.utility == UtilityKind::SewerVeillanceCam)',
                  '        {',
                  '            triggers.push(StackObject::ControlledTrigger {',
                  '                source: SourceRef {',
                  '                    object_id: None,',
                  '                    card: departed.card,',
                  '                },',
                  '                ability: ABILITY_CAM_TAP_UNTAP,',
                  '            });',
                  '        }',
                  '    }',
                  '    Ok(triggers)',
                  '}',
                  '',
                  'fn put_card_onto_battlefield',
              ]),
          )

          # Battlefield insertion can either stage triggers immediately or return them to an enclosing resolution.
          regex_once(
              RULES,
              r'fn put_card_onto_battlefield<D: CardDatabase>\(.*?\n\}\n\nfn ensure_mana_activation_window',
              '\n'.join([
                  'fn put_card_onto_battlefield<D: CardDatabase>(',
                  '    state: &mut TrueState,',
                  '    cards: &D,',
                  '    card: CardDefId,',
                  ') -> Result<RulesObservation, RuleError> {',
                  '    let (observation, triggers) =',
                  '        put_card_onto_battlefield_collect_triggers(state, cards, card)?;',
                  '    stage_trigger_batch(',
                  '        state,',
                  '        SourceRef {',
                  '            object_id: None,',
                  '            card,',
                  '        },',
                  '        triggers,',
                  '    );',
                  '    Ok(observation)',
                  '}',
                  '',
                  'fn put_card_onto_battlefield_collect_triggers<D: CardDatabase>(',
                  '    state: &mut TrueState,',
                  '    cards: &D,',
                  '    card: CardDefId,',
                  ') -> Result<(RulesObservation, Vec<StackObject>), RuleError> {',
                  '    let object_id = next_object_id(state)?;',
                  '    put_card_onto_battlefield_with_id_collect_triggers(state, cards, card, object_id)',
                  '}',
                  '',
                  'fn put_card_onto_battlefield_with_id<D: CardDatabase>(',
                  '    state: &mut TrueState,',
                  '    cards: &D,',
                  '    card: CardDefId,',
                  '    object_id: ObjectId,',
                  ') -> Result<RulesObservation, RuleError> {',
                  '    let (observation, triggers) =',
                  '        put_card_onto_battlefield_with_id_collect_triggers(',
                  '            state, cards, card, object_id,',
                  '        )?;',
                  '    stage_trigger_batch(',
                  '        state,',
                  '        SourceRef {',
                  '            object_id: Some(object_id),',
                  '            card,',
                  '        },',
                  '        triggers,',
                  '    );',
                  '    Ok(observation)',
                  '}',
                  '',
                  'fn put_card_onto_battlefield_with_id_collect_triggers<D: CardDatabase>(',
                  '    state: &mut TrueState,',
                  '    cards: &D,',
                  '    card: CardDefId,',
                  '    object_id: ObjectId,',
                  ') -> Result<(RulesObservation, Vec<StackObject>), RuleError> {',
                  '    let profile = card_profile(cards, card)?;',
                  '    let triggers = insert_permanent_collect_triggers(',
                  '        state,',
                  '        cards,',
                  '        PermanentState {',
                  '            object_id,',
                  '            card,',
                  '            face: profile.battlefield_face,',
                  '            tapped: false,',
                  '            summoning_sick: profile.is_creature,',
                  '            token: false,',
                  '            counters: CounterState {',
                  '                loyalty: profile.starting_loyalty,',
                  '                ..CounterState::default()',
                  '            },',
                  '            mode: initial_permanent_mode(profile),',
                  '            attached_to: None,',
                  '            granted_ability: None,',
                  '        },',
                  '    );',
                  '    Ok((',
                  '        RulesObservation::PermanentEntered {',
                  '            card,',
                  '            face: profile.battlefield_face,',
                  '            token: false,',
                  '        },',
                  '        triggers,',
                  '    ))',
                  '}',
                  '',
                  'fn ensure_mana_activation_window',
              ]),
          )

          # Entry and cast triggers share one generic ordering/staging boundary.
          regex_once(
              RULES,
              r'fn insert_permanent<D: CardDatabase>\(.*?\n\}\n\nfn queue_cast_triggers',
              '\n'.join([
                  'fn insert_permanent<D: CardDatabase>(state: &mut TrueState, cards: &D, permanent: PermanentState) {',
                  '    let source = SourceRef {',
                  '        object_id: Some(permanent.object_id),',
                  '        card: permanent.card,',
                  '    };',
                  '    let triggers = insert_permanent_collect_triggers(state, cards, permanent);',
                  '    stage_trigger_batch(state, source, triggers);',
                  '}',
                  '',
                  'fn insert_permanent_collect_triggers<D: CardDatabase>(',
                  '    state: &mut TrueState,',
                  '    cards: &D,',
                  '    permanent: PermanentState,',
                  ') -> Vec<StackObject> {',
                  '    let entered = permanent.clone();',
                  '    let mut permanents = state.battlefield.permanents().to_vec();',
                  '    permanents.push(permanent);',
                  '    state.battlefield = BattlefieldZone::new(permanents);',
                  '',
                  '    let Some(entered_profile) = cards.profile(entered.card) else {',
                  '        return Vec::new();',
                  '    };',
                  '    let mut triggers = Vec::new();',
                  '    if entered_profile.is_artifact {',
                  '        for producer in state.battlefield.permanents() {',
                  '            let Some(profile) = cards.profile(producer.card) else {',
                  '                continue;',
                  '            };',
                  '            if matches!(',
                  '                profile.engine,',
                  '                EngineKind::GrindingStation | EngineKind::BatteredGolem',
                  '            ) {',
                  '                triggers.push(StackObject::ControlledTrigger {',
                  '                    source: SourceRef {',
                  '                        object_id: Some(producer.object_id),',
                  '                        card: producer.card,',
                  '                    },',
                  '                    ability: ABILITY_ARTIFACT_ENTRY_UNTAP,',
                  '                });',
                  '            }',
                  '        }',
                  '    }',
                  '    if entered_profile.utility == UtilityKind::SewerVeillanceCam {',
                  '        triggers.push(StackObject::ControlledTrigger {',
                  '            source: SourceRef {',
                  '                object_id: Some(entered.object_id),',
                  '                card: entered.card,',
                  '            },',
                  '            ability: ABILITY_CAM_TAP_UNTAP,',
                  '        });',
                  '    }',
                  '    triggers',
                  '}',
                  '',
                  'fn queue_cast_triggers',
              ]),
          )
          regex_once(
              RULES,
              r'fn queue_cast_triggers<D: CardDatabase>\(.*?\n\}\n\nfn queue_one_ring_upkeep_triggers',
              '\n'.join([
                  'fn queue_cast_triggers<D: CardDatabase>(state: &mut TrueState, cards: &D, card: CardDefId) {',
                  '    let triggers = collect_cast_triggers(state, cards, card);',
                  '    stage_trigger_batch(',
                  '        state,',
                  '        SourceRef {',
                  '            object_id: None,',
                  '            card,',
                  '        },',
                  '        triggers,',
                  '    );',
                  '}',
                  '',
                  'fn collect_cast_triggers<D: CardDatabase>(',
                  '    state: &TrueState,',
                  '    cards: &D,',
                  '    card: CardDefId,',
                  ') -> Vec<StackObject> {',
                  '    let Some(cast_profile) = cards.profile(card) else {',
                  '        return Vec::new();',
                  '    };',
                  '    let mut triggers = Vec::new();',
                  '    for permanent in state.battlefield.permanents() {',
                  '        let Some(profile) = cards.profile(permanent.card) else {',
                  '            continue;',
                  '        };',
                  '        if cast_profile.is_artifact && profile.engine == EngineKind::ForensicGadgeteer {',
                  '            triggers.push(StackObject::ControlledTrigger {',
                  '                source: SourceRef {',
                  '                    object_id: Some(permanent.object_id),',
                  '                    card: permanent.card,',
                  '                },',
                  '                ability: ABILITY_GADGETEER_INVESTIGATE,',
                  '            });',
                  '        }',
                  '        if cast_profile.is_artifact',
                  '            && profile.utility == UtilityKind::UthrosResearchCraft',
                  '            && permanent.counters.charge >= 3',
                  '        {',
                  '            triggers.push(StackObject::ControlledTrigger {',
                  '                source: SourceRef {',
                  '                    object_id: Some(permanent.object_id),',
                  '                    card: permanent.card,',
                  '                },',
                  '                ability: ABILITY_UTHROS_ARTIFACT_DRAW,',
                  '            });',
                  '        }',
                  '        if profile.utility == UtilityKind::ArtificersAssistant && cards.is_historic_spell(card) {',
                  '            triggers.push(StackObject::ControlledTrigger {',
                  '                source: SourceRef {',
                  '                    object_id: Some(permanent.object_id),',
                  '                    card: permanent.card,',
                  '                },',
                  '                ability: ABILITY_ARTIFICERS_ASSISTANT_SCRY,',
                  '            });',
                  '        }',
                  '        if !cast_profile.is_creature && profile.engine == EngineKind::ValleyFloodcaller {',
                  '            triggers.push(StackObject::ControlledTrigger {',
                  '                source: SourceRef {',
                  '                    object_id: Some(permanent.object_id),',
                  '                    card: permanent.card,',
                  '                },',
                  '                ability: ABILITY_FLOODCALLER_UNTAP,',
                  '            });',
                  '        }',
                  '    }',
                  '    triggers',
                  '}',
                  '',
                  'fn stage_trigger_batch(state: &mut TrueState, source: SourceRef, triggers: Vec<StackObject>) {',
                  '    if triggers.len() > 1 {',
                  '        debug_assert!(matches!(state.pending, PendingDecision::None));',
                  '        let trigger_count = u8::try_from(triggers.len())',
                  '            .expect("Commander goldfish cannot create more than 255 simultaneous triggers");',
                  '        state.pending = PendingDecision::TriggerOrder {',
                  '            source,',
                  '            trigger_count,',
                  '        };',
                  '    }',
                  '    state.stack.extend(triggers);',
                  '}',
                  '',
                  'fn defer_controlled_triggers(state: &mut TrueState, triggers: Vec<StackObject>) {',
                  '    for trigger in triggers {',
                  '        let StackObject::ControlledTrigger { source, ability } = trigger else {',
                  '            unreachable!("leave-battlefield triggers are controlled triggers");',
                  '        };',
                  '        state',
                  '            .delayed_events',
                  '            .push(DelayedEvent::DeferredControlledTrigger { source, ability });',
                  '    }',
                  '}',
                  '',
                  'fn take_deferred_controlled_triggers(state: &mut TrueState) -> Vec<StackObject> {',
                  '    let mut triggers = Vec::new();',
                  '    let mut retained = Vec::new();',
                  '    for event in std::mem::take(&mut state.delayed_events) {',
                  '        match event {',
                  '            DelayedEvent::DeferredControlledTrigger { source, ability } => {',
                  '                triggers.push(StackObject::ControlledTrigger { source, ability });',
                  '            }',
                  '            other => retained.push(other),',
                  '        }',
                  '    }',
                  '    state.delayed_events = retained;',
                  '    triggers',
                  '}',
                  '',
                  'fn flush_deferred_controlled_triggers(',
                  '    state: &mut TrueState,',
                  '    source: SourceRef,',
                  '    mut extra: Vec<StackObject>,',
                  ') {',
                  '    let mut triggers = take_deferred_controlled_triggers(state);',
                  '    triggers.append(&mut extra);',
                  '    stage_trigger_batch(state, source, triggers);',
                  '}',
                  '',
                  'fn queue_one_ring_upkeep_triggers',
              ]),
          )

          # Synthetic Clue regression now expects executable attachment cleanup.
          replace_once(
              RULES,
              block(
                  '            profiles.insert(',
                  '                CLUE,',
                  '                CardProfile {',
                  '                    card: CLUE,',
                  '                    role: R2CardRole::ArtifactPermanent,',
                  '                    battlefield_face: CardFace::Front,',
                  '                    is_artifact: true,',
                  '                    ..CardProfile::default()',
                  '                },',
                  '            );',
                  '            Self { profiles }',
              ),
              block(
                  '            profiles.insert(',
                  '                CLUE,',
                  '                CardProfile {',
                  '                    card: CLUE,',
                  '                    role: R2CardRole::ArtifactPermanent,',
                  '                    battlefield_face: CardFace::Front,',
                  '                    is_artifact: true,',
                  '                    ..CardProfile::default()',
                  '                },',
                  '            );',
                  '            profiles.insert(',
                  '                AURA,',
                  '                CardProfile {',
                  '                    card: AURA,',
                  '                    role: R2CardRole::EnchantmentPermanent,',
                  '                    battlefield_face: CardFace::Front,',
                  '                    ..CardProfile::default()',
                  '                },',
                  '            );',
                  '            Self { profiles }',
              ),
          )
          regex_once(
              RULES,
              r'    #\[test\]\n    fn attached_clue_preserves_existing_player_chosen_sacrifice_deferral\(\) \{.*?\n    \}\n\}\n\n#\[cfg\(test\)\]\nmod post_r7_assistant_scry_tests',
              '\n'.join([
                  '    #[test]',
                  '    fn attached_clue_sacrifice_cleans_attachment_and_resolves_draw() {',
                  '        let cards = ClueCards::new();',
                  '        let clue = permanent(1, CLUE, true);',
                  '        let mut aura = permanent(2, AURA, false);',
                  '        aura.attached_to = Some(ObjectId(1));',
                  '        let mut state = TrueState {',
                  '            turn: 3,',
                  '            phase: Phase::PrecombatMain,',
                  '            window: Window::Priority,',
                  '            library: TrueLibrary::unknown(vec![DRAW]),',
                  '            battlefield: BattlefieldZone::new(vec![clue, aura]),',
                  '            mana: ManaPool {',
                  '                colorless: 2,',
                  '                ..ManaPool::default()',
                  '            },',
                  '            ..TrueState::default()',
                  '        };',
                  '        state.validate().unwrap();',
                  '',
                  '        apply_action(',
                  '            &mut state,',
                  '            &cards,',
                  '            Action::ActivateClueDraw {',
                  '                source: ObjectId(1),',
                  '                payment: ManaPayment {',
                  '                    colorless: 2,',
                  '                    ..ManaPayment::default()',
                  '                },',
                  '            },',
                  '        )',
                  '        .unwrap();',
                  '',
                  '        assert_eq!(state.mana, ManaPool::default());',
                  '        assert!(state.battlefield.get(ObjectId(1)).is_none());',
                  '        assert!(state.battlefield.get(ObjectId(2)).is_none());',
                  '        assert_eq!(state.graveyard, CardZone::new(vec![AURA]));',
                  '        assert!(matches!(',
                  '            state.stack.last(),',
                  '            Some(StackObject::ActivatedAbility {',
                  '                ability: ABILITY_CLUE_DRAW,',
                  '                ..',
                  '            })',
                  '        ));',
                  '',
                  '        apply_action(&mut state, &cards, Action::PassPriority).unwrap();',
                  '        assert_eq!(state.hand, CardZone::new(vec![DRAW]));',
                  '        state.validate().unwrap();',
                  '    }',
                  '}',
                  '',
                  '#[cfg(test)]',
                  'mod post_r7_assistant_scry_tests',
              ]),
          )
          PY
      - name: Format repaired tree
        working-directory: rust
        run: cargo fmt --all
      - name: Assert materialization touched only reviewed Rust surfaces
        run: |
          set -euo pipefail
          git diff --name-only | sort > "$RUNNER_TEMP/changed.txt"
          cat "$RUNNER_TEMP/changed.txt"
          while IFS= read -r path; do
            case "$path" in
              rust/crates/urza-core/src/state.rs|rust/crates/urza-info/src/lib.rs|rust/crates/urza-rules/src/lib.rs|rust/crates/urza-cards/tests/post_r7_shared_primitives_leave_ltb.rs) ;;
              *) echo "unexpected materialized path: $path" >&2; exit 1 ;;
            esac
          done < "$RUNNER_TEMP/changed.txt"
      - name: Workspace all-target compile
        working-directory: rust
        run: cargo check --locked --workspace --all-targets
      - name: Leave/LTB focused fixture
        working-directory: rust
        run: cargo test --locked -p urza-cards --test post_r7_shared_primitives_leave_ltb
      - name: Targeted permission fixtures
        working-directory: rust
        run: |
          cargo test --locked -p urza-cards --test post_r7_shared_primitives_targeted_permission_zones
          cargo test --locked -p urza-policy-bridge --test post_r7_shared_primitives_targeted_permission_zones
      - name: Shared-primitives regressions
        working-directory: rust
        run: |
          cargo test --locked -p urza-rules
          cargo test --locked -p urza-cards --test post_r7_modeling_completeness_rules_active_repair_v1
          cargo test --locked -p urza-policy-bridge --test post_r7_modeling_completeness_rules_active_repair_v1
          cargo test --locked -p urza-cards --test post_r7_modeling_completeness_forensic_gadgeteer
          cargo test --locked -p urza-cards --test r4_final_acceptance
          cargo test --locked -p urza-cards --test r4_terminal_acceptance
      - name: Preserve authoritative completeness baseline
        working-directory: rust
        run: |
          set -euo pipefail
          cargo test --locked -p urza-mulligan --bin post-r7-modeling-completeness-gate
          if cargo run --quiet --locked -p urza-mulligan --bin post-r7-modeling-completeness-gate -- --enforce > "$RUNNER_TEMP/modeling-enforce.txt" 2>&1; then
            echo 'gate unexpectedly green before backlog is cleared' >&2
            exit 1
          fi
          grep -q $'MODELING_COMPLETENESS_GATE\ttotal=95\tresolved=11\tunresolved=84' "$RUNNER_TEMP/modeling-enforce.txt"
          grep -q 'MODELING_COMPLETENESS_GATE_RED: 84 unresolved active identities remain' "$RUNNER_TEMP/modeling-enforce.txt"
      - name: Strict Clippy
        working-directory: rust
        run: |
          cargo clippy --locked -p urza-core --all-targets -- -D warnings
          cargo clippy --locked -p urza-info --all-targets -- -D warnings
          cargo clippy --locked -p urza-rules --all-targets -- -D warnings
          cargo clippy --locked -p urza-cards --all-targets -- -D warnings
          cargo clippy --locked -p urza-policy-bridge --all-targets -- -D warnings
      - name: Commit reviewed Rust repair only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rust/crates/urza-core/src/state.rs rust/crates/urza-info/src/lib.rs rust/crates/urza-rules/src/lib.rs rust/crates/urza-cards/tests/post_r7_shared_primitives_leave_ltb.rs
          git diff --cached --quiet && { echo 'no repair changes staged' >&2; exit 1; }
          git commit -m '[R7] Centralize permanent leave and Cam LTB staging'
          git push origin HEAD:rust-modeling/shared-primitives
