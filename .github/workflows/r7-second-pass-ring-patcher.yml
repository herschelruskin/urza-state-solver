name: R7 second-pass One Ring patcher

on:
  push:
    branches: [rust-engine-rebuild]
    paths:
      - '.github/scripts/patch_post_r7_ring.py'
      - '.github/scripts/fix_post_r7_ring_version_namespace.py'
      - '.github/workflows/r7-second-pass-ring-patcher.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89
        with:
          components: rustfmt, clippy
      - name: Apply One Ring primitive and post-R7 database layer
        run: |
          python .github/scripts/patch_post_r7_ring.py
          python .github/scripts/fix_post_r7_ring_version_namespace.py
      - name: Format
        working-directory: rust
        run: cargo fmt --all
      - name: Card database tests
        working-directory: rust
        run: cargo test --locked -p urza-cards
      - name: Rules tests
        working-directory: rust
        run: cargo test --locked -p urza-rules
      - name: Candidate bridge tests
        working-directory: rust
        run: cargo test --locked -p urza-policy-bridge
      - name: Build post-R7 diagnostics
        working-directory: rust
        run: |
          cargo build --locked -p urza-mulligan --bin post-r7-engine-tutor-diagnostic
          cargo build --locked -p urza-mulligan --bin post-r7-oracle-comparison-export
      - name: Clippy second-pass surface
        working-directory: rust
        run: cargo clippy --locked -p urza-cards -p urza-rules -p urza-policy-bridge -p urza-mulligan --all-targets -- -D warnings
      - name: Commit One Ring slice
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust/crates/urza-rules/src/lib.rs \
                  rust/crates/urza-cards/src/lib.rs \
                  rust/crates/urza-policy-bridge/src/lib.rs \
                  rust/crates/urza-mulligan/src/bin/post-r7-engine-tutor-diagnostic.rs \
                  rust/crates/urza-mulligan/src/bin/post-r7-oracle-comparison-export.rs \
                  rust/data/card_coverage.r0.json
          git commit -m "[R7] Model The One Ring card advantage"
          git push
