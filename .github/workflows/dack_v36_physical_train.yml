          - {kind: K, index: 160, seat: 0, stage: 0}
          - {kind: K, index: 164, seat: 0, stage: 0}
          - {kind: K, index: 168, seat: 0, stage: 0}
          - {kind: K, index: 172, seat: 0, stage: 0}
          - {kind: K, index: 176, seat: 0, stage: 0}
          - {kind: K, index: 180, seat: 0, stage: 0}
          - {kind: K, index: 184, seat: 0, stage: 0}
          - {kind: K, index: 188, seat: 0, stage: 0}
          - {kind: K, index: 192, seat: 0, stage: 0}
          - {kind: K, index: 196, seat: 0, stage: 0}
