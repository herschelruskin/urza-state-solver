          - {kind: K, index: 244, seat: 0, stage: 0}
          - {kind: K, index: 248, seat: 0, stage: 0}
          - {kind: K, index: 252, seat: 0, stage: 0}
          - {kind: C, index: 0, seat: 0, stage: 0}
          - {kind: C, index: 0, seat: 0, stage: 1}
          - {kind: C, index: 0, seat: 0, stage: 2}
          - {kind: C, index: 0, seat: 1, stage: 0}
          - {kind: C, index: 0, seat: 1, stage: 1}
          - {kind: C, index: 0, seat: 1, stage: 2}
          - {kind: C, index: 0, seat: 2, stage: 0}
          - {kind: C, index: 0, seat: 2, stage: 1}
          - {kind: C, index: 0, seat: 2, stage: 2}
          - {kind: C, index: 0, seat: 3, stage: 0}
          - {kind: C, index: 0, seat: 3, stage: 1}
          - {kind: C, index: 0, seat: 3, stage: 2}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify physical manifest was archived before outcomes
        run: |
          test -f datasets/v36_preoutcome_123k_manifest.json
          python -m py_compile dack_simulator/validation/v36_true_keep.py dack_simulator/validation/v36_true_mull.py dack_mulligan_v36_keep_value.py
          python -m dack_simulator.validation.v34_frozen_v33b_continuation
      - name: New true training physical outcomes under fixed v33b bottom
        run: |
          if [ "${{ matrix.kind }}" = "K" ]; then
            python -u dack_simulator/validation/v36_true_keep.py \
              --split train --index ${{ matrix.index }} \
              --out shards/v36_train_K_${{ matrix.index }}.json.gz
          else
            python -u dack_simulator/validation/v36_true_mull.py \
              --split train --seat ${{ matrix.seat }} --stage ${{ matrix.stage }} \
              --out shards/v36_train_C_${{ matrix.seat }}_${{ matrix.stage }}.json.gz
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v36-123k-${{ matrix.kind }}-${{ matrix.index }}-${{ matrix.seat }}-${{ matrix.stage }}
          path: shards/v36_train_*.json.gz
          retention-days: 30
  frozen-train:
    needs: physical
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: v36-123k-*
          path: collected
          merge-multiple: true
      - name: Assert complete unobserved train groups and no heldout data
        run: |
          test "$(find collected -maxdepth 1 -name 'v36_train_K_*.json.gz' | wc -l)" -eq 64
          test "$(find collected -maxdepth 1 -name 'v36_train_C_*.json.gz' | wc -l)" -eq 12
          python -m py_compile dack_simulator/validation/v36_fit_keep_value.py
      - name: Install sklearn TRAINING ONLY
        run: python -m pip install 'scikit-learn>=1.4,<2'
      - name: Freeze 8 group-bootstrap forest models using ONLY new training data
        run: python -u dack_simulator/validation/v36_fit_keep_value.py
      - name: Archive all real physical source shards and unapproved frozen model
        run: |
          mkdir -p benchmark_results/v36_123k_training_physical_shards
          cp collected/v36_train_*.json.gz benchmark_results/v36_123k_training_physical_shards/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f benchmark_results/v36_123k_training_physical_shards models/dack_v36_targeted_real_keep_EXPERIMENTAL.json benchmark_results/v36_train_only_diagnostic.json
          git commit -m "Archive v36 independent 123k random/enriched physical labels and frozen forest"
          git pull --rebase origin dack-v36-targeted-keep-value-20261101
          git push origin HEAD:dack-v36-targeted-keep-value-20261101
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v36-123k-frozen-unapproved-model-training
          path: |
            models/dack_v36_targeted_real_keep_EXPERIMENTAL.json
            benchmark_results/v36_train_only_diagnostic.json
          retention-days: 30
