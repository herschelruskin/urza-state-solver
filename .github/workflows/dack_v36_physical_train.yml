          - {kind: K, index: 88, seat: 0, stage: 0}
          - {kind: K, index: 92, seat: 0, stage: 0}
          - {kind: K, index: 96, seat: 0, stage: 0}
          - {kind: K, index: 100, seat: 0, stage: 0}
          - {kind: K, index: 104, seat: 0, stage: 0}
          - {kind: K, index: 108, seat: 0, stage: 0}
          - {kind: K, index: 112, seat: 0, stage: 0}
          - {kind: K, index: 116, seat: 0, stage: 0}
          - {kind: K, index: 120, seat: 0, stage: 0}
          - {kind: K, index: 124, seat: 0, stage: 0}
          - {kind: K, index: 128, seat: 0, stage: 0}
