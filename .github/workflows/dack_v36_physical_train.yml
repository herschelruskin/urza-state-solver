name: DACK v36 new physical 123k training and frozen forest fit
on:
  push:
    branches: [dack-v36-targeted-keep-value-20261101]
    paths:
      - '.github/workflows/dack_v36_physical_train.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  physical:
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        include:
          - {kind: K, index: 0, seat: 0, stage: 0}
          - {kind: K, index: 4, seat: 0, stage: 0}
          - {kind: K, index: 8, seat: 0, stage: 0}
