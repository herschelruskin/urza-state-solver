name: Dack Full Beam vs Realistic Beam Failure Audit
on:
  push:
    branches: [dack-realistic-beam-failure-audit-20261019]
    paths:
      - 'dack_realistic_beam_failure_audit_20261019.py'
      - '.github/workflows/dack_realistic_beam_failure_audit_20261019.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
env:
  PYTHONHASHSEED: '0'
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile matched replay failure diagnostic
        run: python -m py_compile dack_realistic_beam_failure_audit_20261019.py
      - name: Recover completed Full Beam, Realistic v1, Realistic v2 game records
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p full_current full_buck v1 v2
          gh run download 38912678782 --repo "${{ github.repository }}" \
            --pattern 'boon-current-shard-*' --dir full_current
          gh run download 38931616641 --repo "${{ github.repository }}" \
            --pattern 'buck-buck_worldmap-*' --dir full_buck
          gh run download 39037402299 --repo "${{ github.repository }}" \
            --pattern 'realistic-beam-*' --dir v1
          gh run download 39056076511 --repo "${{ github.repository }}" \
            --pattern 'dack-beam-v2-*' --dir v2
          test "$(find full_current -name '*.json.gz' | wc -l)" -eq 32
          test "$(find full_buck -name '*.json.gz' | wc -l)" -eq 16
          test "$(find v1 -name '*.json.gz' | wc -l)" -eq 32
          test "$(find v2 -name '*.json.gz' | wc -l)" -eq 16
      - name: Audit mismatches by turn and policy with game ID integrity
        run: |
          python -u dack_realistic_beam_failure_audit_20261019.py \
            --full-current 'full_current/**/*.json.gz' \
            --full-buck 'full_buck/**/*.json.gz' \
            --v1 'v1/**/*.json.gz' --v2 'v2/**/*.json.gz' \
            --n 32 --n-v1 64 \
            --out dack_realistic_beam_failure_audit_n32_20261019.json
      - uses: actions/upload-artifact@v4
        with:
          name: dack-realistic-full-beam-failure-audit-n32
          path: dack_realistic_beam_failure_audit_n32_20261019.json
          retention-days: 90
          if-no-files-found: error
      - name: Publish audited paired failure case tables
        run: |
          mkdir -p benchmark_results
          cp dack_realistic_beam_failure_audit_n32_20261019.json \
             benchmark_results/dack_realistic_beam_failure_audit_n32_20261019.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add benchmark_results/dack_realistic_beam_failure_audit_n32_20261019.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publish Full Beam vs Realistic paired failure-case audit'
            git pull --rebase origin dack-realistic-beam-failure-audit-20261019
            git push
          fi
