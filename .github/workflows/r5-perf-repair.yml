name: R5 performance blocker repair

on:
  push:
    branches:
      - rust-engine-rebuild
    paths:
      - .github/workflows/r5-perf-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rust-engine-rebuild
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy
      - name: Patch Transmute staged-choice viability
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('rust/crates/urza-policy-bridge/src/lib.rs')
          text = path.read_text()

          old_version = 'pub const CANDIDATE_BRIDGE_VERSION: &str = "r5_public_candidate_bridge_v1";'
          if old_version not in text:
              raise SystemExit('bridge version anchor not found')
          text = text.replace(
              old_version,
              'pub const CANDIDATE_BRIDGE_VERSION: &str = "r5_public_candidate_bridge_v2";',
              1,
          )

          legality_anchor = '    actions.retain(|action| action_is_legal(state, cards, action));'
          first = text.find(legality_anchor)
          second = text.find(legality_anchor, first + len(legality_anchor)) if first >= 0 else -1
          if second < 0:
              raise SystemExit('second ordinary legality anchor not found')
          viability = '''    actions.retain(|action| {
              let transmute_cast = match action {
                  Action::CastFromHand { card, .. } | Action::CastLibraryTop { card, .. } => cards
                      .profile(*card)
                      .is_some_and(|profile| profile.special_search == SpecialSearchKind::TransmuteArtifact),
                  Action::PlayUrzaPermission {
                      permission_slot, ..
                  } => information
                      .urza_permissions
                      .iter()
                      .find(|permission| permission.permission_slot == *permission_slot)
                      .and_then(|permission| cards.profile(permission.card))
                      .is_some_and(|profile| profile.special_search == SpecialSearchKind::TransmuteArtifact),
                  _ => false,
              };
              !transmute_cast || !artifact_classes.is_empty()
          });
          '''
          text = text[:second] + viability + text[second:]

          test_anchor = '    #[test]\n    fn transmute_difference_pending_keeps_mana_abilities_in_contingent_set() {'
          test = '''    #[test]
          fn transmute_without_a_sacrifice_is_not_exposed_as_a_dead_end_root() {
              let cards = R4CardDatabase::load().unwrap();
              let transmute = cards.card_id_by_name("Transmute Artifact").unwrap();
              let sol_ring = cards.card_id_by_name("Sol Ring").unwrap();
              let mut state = priority_state();
              state.hand = CardZone::new(vec![transmute]);
              state.mana = ManaPool {
                  blue: 2,
                  ..ManaPool::default()
              };

              let dead_end_bridge = CandidateBridge::build(&state, &cards).unwrap();
              assert!(!dead_end_bridge.candidates().iter().any(|candidate| matches!(
                  dead_end_bridge.resolve(candidate.token),
                  Some(Action::CastFromHand { card, .. }) if *card == transmute
              )));

              state.battlefield = BattlefieldZone::new(vec![permanent(12, sol_ring)]);
              let live_bridge = CandidateBridge::build(&state, &cards).unwrap();
              assert!(live_bridge.candidates().iter().any(|candidate| matches!(
                  live_bridge.resolve(candidate.token),
                  Some(Action::CastFromHand { card, .. }) if *card == transmute
              )));
          }

          '''
          if test_anchor not in text:
              raise SystemExit('test anchor not found')
          text = text.replace(test_anchor, test + test_anchor, 1)
          path.write_text(text)
          PY
      - name: Format
        working-directory: rust
        run: cargo fmt --all
      - name: Strict Clippy
        working-directory: rust
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Workspace tests
        working-directory: rust
        run: cargo test --workspace --all-features --locked
      - name: Bench compile
        working-directory: rust
        run: cargo bench --workspace --no-run --locked
      - name: R5 audit
        working-directory: rust
        run: cargo run -p urza-cli --locked -- r5-audit
      - name: Commit validated bridge repair
        run: |
          rm .github/workflows/r5-perf-repair.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rust/crates/urza-policy-bridge/src/lib.rs .github/workflows/r5-perf-repair.yml
          git commit -m 'Reject dead-end Transmute candidates'
          git push origin HEAD:rust-engine-rebuild
