name: R5 performance blocker repair

on:
  push:
    branches:
      - rust-engine-rebuild
    paths:
      - .github/workflows/r5-perf-repair.yml

permissions:
  contents: write

jobs:
  repair-and-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rust-engine-rebuild
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy
      - name: Patch Transmute staged-choice viability
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('rust/crates/urza-policy-bridge/src/lib.rs')
          text = path.read_text()

          text = text.replace(
              'pub const CANDIDATE_BRIDGE_VERSION: &str = "r5_public_candidate_bridge_v1";',
              'pub const CANDIDATE_BRIDGE_VERSION: &str = "r5_public_candidate_bridge_v2";',
              1,
          )

          old = '''    let artifact_classes: Vec<_> = classes
              .iter()
              .filter(|class| {
                  cards
                      .profile(class.card)
                      .is_some_and(|profile| profile.is_artifact)
              })
              .collect();
          '''
          new = old + '''    let has_artifact_sacrifice = !artifact_classes.is_empty();
          '''
          if old not in text:
              raise SystemExit('artifact class block not found')
          text = text.replace(old, new, 1)

          old = '''            for payment in &payments {
                      actions.push(Action::CastFromHand {
                          card,
                          payment: *payment,
                      });
          '''
          new = '''            for payment in &payments {
                      if profile.special_search != SpecialSearchKind::TransmuteArtifact
                          || has_artifact_sacrifice
                      {
                          actions.push(Action::CastFromHand {
                              card,
                              payment: *payment,
                          });
                      }
          '''
          if old not in text:
              raise SystemExit('hand cast block not found')
          text = text.replace(old, new, 1)

          old = '''        if let Some(cost) = profile.mana_cost {
                  for payment in enumerate_payments(information.mana, cost) {
                      actions.push(Action::CastLibraryTop { card, payment });
                  }
              }
          '''
          new = '''        if let Some(cost) = profile.mana_cost
                  && (profile.special_search != SpecialSearchKind::TransmuteArtifact
                      || has_artifact_sacrifice)
              {
                  for payment in enumerate_payments(information.mana, cost) {
                      actions.push(Action::CastLibraryTop { card, payment });
                  }
              }
          '''
          if old not in text:
              raise SystemExit('library-top cast block not found')
          text = text.replace(old, new, 1)

          old = '''    for permission in &information.urza_permissions {
              for face in [CardFace::Front, CardFace::Back] {
                  actions.push(Action::PlayUrzaPermission {
                      permission_slot: permission.permission_slot,
                      face,
                  });
              }
          '''
          new = '''    for permission in &information.urza_permissions {
              let permission_has_required_followup = cards.profile(permission.card).is_none_or(|profile| {
                  profile.special_search != SpecialSearchKind::TransmuteArtifact
                      || has_artifact_sacrifice
              });
              if permission_has_required_followup {
                  for face in [CardFace::Front, CardFace::Back] {
                      actions.push(Action::PlayUrzaPermission {
                          permission_slot: permission.permission_slot,
                          face,
                      });
                  }
              }
          '''
          if old not in text:
              raise SystemExit('permission cast block not found')
          text = text.replace(old, new, 1)

          needle = '''    #[test]
              fn transmute_difference_pending_keeps_mana_abilities_in_contingent_set() {
          '''
          test = '''    #[test]
              fn transmute_without_a_sacrifice_is_not_exposed_as_a_dead_end_root() {
                  let cards = R4CardDatabase::load().unwrap();
                  let transmute = cards.card_id_by_name("Transmute Artifact").unwrap();
                  let sol_ring = cards.card_id_by_name("Sol Ring").unwrap();
                  let mut state = priority_state();
                  state.hand = CardZone::new(vec![transmute]);
                  state.mana = ManaPool {
                      blue: 2,
                      ..ManaPool::default()
                  };

                  let dead_end_bridge = CandidateBridge::build(&state, &cards).unwrap();
                  assert!(!dead_end_bridge.candidates().iter().any(|candidate| matches!(
                      dead_end_bridge.resolve(candidate.token),
                      Some(Action::CastFromHand { card, .. }) if *card == transmute
                  )));

                  state.battlefield = BattlefieldZone::new(vec![permanent(12, sol_ring)]);
                  let live_bridge = CandidateBridge::build(&state, &cards).unwrap();
                  assert!(live_bridge.candidates().iter().any(|candidate| matches!(
                      live_bridge.resolve(candidate.token),
                      Some(Action::CastFromHand { card, .. }) if *card == transmute
                  )));
              }

          '''
          if needle not in text:
              raise SystemExit('test insertion point not found')
          text = text.replace(needle, test + needle, 1)
          path.write_text(text)
          PY
      - name: Format
        working-directory: rust
        run: cargo fmt --all
      - name: Strict bridge Clippy
        working-directory: rust
        run: cargo clippy -p urza-policy-bridge --all-targets --locked -- -D warnings
      - name: Bridge tests
        working-directory: rust
        run: cargo test -p urza-policy-bridge --locked
      - name: Build release performance probe
        working-directory: rust
        run: cargo build -p urza-mc --example r5_perf_probe --release --locked
      - name: Run repaired performance probe three times
        working-directory: rust
        run: |
          for run in 1 2 3; do
            echo "=== R5_REPAIRED_PERF_PROBE_RUN_${run} ==="
            ./target/release/examples/r5_perf_probe
          done
      - name: Full workspace tests
        working-directory: rust
        run: cargo test --workspace --all-features --locked
      - name: Commit bridge repair and remove temporary repair workflow
        run: |
          rm .github/workflows/r5-perf-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rust/crates/urza-policy-bridge/src/lib.rs .github/workflows/r5-perf-repair.yml
          git commit -m 'Reject dead-end Transmute candidates'
          git push origin HEAD:rust-engine-rebuild
