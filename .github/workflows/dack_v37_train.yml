    runs-on: ubuntu-latest
    timeout-minutes: 48
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify sealed manifest before any gameplay
        run: |
          test -f datasets/v37_preoutcome_training_manifest.json
          python -m py_compile dack_simulator/validation/v37_true_keep.py dack_simulator/validation/v37_true_mull.py
          python -m dack_simulator.validation.v34_frozen_v33b_continuation
      - name: Strict physical source label (blind shuffled unknown 92 or full99 future)
        run: |
          if [ "${{ matrix.kind }}" = "K" ]; then
            python -u dack_simulator/validation/v37_true_keep.py \
              --part ${{ matrix.part }} --index ${{ matrix.index }} \
              --out shards/v37_K_${{ matrix.part }}_${{ matrix.index }}.json.gz
          else
            python -u dack_simulator/validation/v37_true_mull.py \
              --seat ${{ matrix.seat }} --stage ${{ matrix.stage }} \
              --out shards/v37_C_${{ matrix.seat }}_${{ matrix.stage }}.json.gz
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dack-v37-126k-${{ matrix.kind }}-${{ matrix.part }}-${{ matrix.index }}-${{ matrix.seat }}-${{ matrix.stage }}
          path: shards/v37_*.json.gz
          retention-days: 30
  fit:
    needs: physical
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: dack-v37-126k-*
          path: collected
          merge-multiple: true
      - name: Verify complete physical data before fitting
        run: |
          test "$(find collected -maxdepth 1 -name 'v37_K_*.json.gz' | wc -l)" -eq 96
          test "$(find collected -maxdepth 1 -name 'v37_C_*.json.gz' | wc -l)" -eq 12
          python -m py_compile dack_simulator/validation/v37_train.py dack_mulligan_v37_direct_regret.py
          python dack_mulligan_v37_direct_regret.py
      - run: python -m pip install 'scikit-learn>=1.4,<2'
      - name: Train DIRECT signed regrets with outer physical group and shared C bootstraps
        run: python -u dack_simulator/validation/v37_train.py
      - name: Archive frozen model plus all underlying 15360 physical results
        run: |
          mkdir -p benchmark_results/v37_126k_physical_training_shards
          cp collected/v37_*.json.gz benchmark_results/v37_126k_physical_training_shards/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f benchmark_results/v37_126k_physical_training_shards models/dack_v37_direct_regret_EXPERIMENTAL.json benchmark_results/v37_train_only_direct_regret.json
          git commit -m 'Archive v37 physical signed-regret training and frozen unapproved model'
          git pull --rebase origin dack-v37-direct-action-regret-20261101
          git push origin HEAD:dack-v37-direct-action-regret-20261101
