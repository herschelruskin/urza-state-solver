name: Recover Dack Realistic Beam pooled N64
on:
  push:
    branches: [dack-realistic-information-beam-20261017]
    paths:
      - '.github/workflows/dack_realistic_beam_repool_20261017.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
env:
  PYTHONHASHSEED: '0'
jobs:
  pool:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download all previously successful realistic-beam N64 shards
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p shards old_current old_buck
          gh run download 39037402299 --repo "${{ github.repository }}" \
            --pattern 'realistic-beam-*' --dir shards
          gh run download 38912678782 --repo "${{ github.repository }}" \
            --pattern 'boon-current-shard-*' --dir old_current
          gh run download 38931616641 --repo "${{ github.repository }}" \
            --pattern 'buck-buck_worldmap-*' --dir old_buck
          test "$(find shards -name '*.json.gz' | wc -l)" -eq 32
      - name: Pool T1 T2 T3 and paired differences without rerunning shards
        run: |
          python -u dack_realistic_information_beam_pool_20261017.py \
            --shards shards --oracle-base 'old_current/**/*.json.gz' \
            --oracle-buck 'old_buck/**/*.json.gz' \
            --n 64 --beam 120 --pass-cap 7 --draw-samples 3 \
            --rollout-beam 42 --rollout-depth 14 \
            --out dack_realistic_beam_n64_pilot_20261017.json
      - uses: actions/upload-artifact@v4
        with:
          name: dack-realistic-beam-recovered-n64
          path: dack_realistic_beam_n64_pilot_20261017.json
          retention-days: 90
          if-no-files-found: error
      - name: Publish recovered report
        run: |
          mkdir -p benchmark_results
          cp dack_realistic_beam_n64_pilot_20261017.json benchmark_results/dack_realistic_beam_n64_pilot_20261017.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add benchmark_results/dack_realistic_beam_n64_pilot_20261017.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publish recovered Realistic Beam N64 paired results'
            git pull --rebase origin dack-realistic-information-beam-20261017
            git push
          fi
