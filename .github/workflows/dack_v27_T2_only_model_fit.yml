name: DACK v27 fit expanded actual-outcome T2-only value and London continuation
on:
  push:
    branches: [dack-v27-t2-value-20261031]
    paths:
      - '.github/workflows/dack_v27_T2_only_model_fit.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fit:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dack-v27-t2-value-20261031
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Require archived 10,240 true future outcomes in independent 93k and 94k groups
        run: |
          python -m compileall -q dack_simulator/validation/train_v27_T2_only_expanded.py dack_paired_counterfactual_v27_T2_only_DP_20261101.py
          python - <<'PY'
          from pathlib import Path
          a=Path('datasets/v26_expanded_keep_values')
          assert len(list(a.glob('stage_train_*.jsonl.gz')))==32
          assert len(list(a.glob('stage_validation_*.jsonl.gz')))==8
          print('V27_FROZEN_93K_TRAIN_94K_VALIDATION_READY',flush=True)
          PY
      - name: Training-only sklearn library
        run: python -m pip install 'scikit-learn>=1.4,<2'
      - name: Train by-T2 exact reward not T3-blended score; compare old T2 model on independent 94k
        run: |
          python -u dack_simulator/validation/train_v27_T2_only_expanded.py \
            --train datasets/v26_expanded_keep_values/stage_train_*.jsonl.gz \
            --validation datasets/v26_expanded_keep_values/stage_validation_*.jsonl.gz \
            --model models/dack_v27_expanded_T2_only_value_EXPERIMENTAL.json \
            --report benchmark_results/v27_T2_only_94k_validation.json
      - name: Derive new model-hash-bound four-seat London continuation by physical 92k DP
        run: |
          python -u dack_simulator/validation/derive_keep_continuation_v22.py \
            --model models/dack_v27_expanded_T2_only_value_EXPERIMENTAL.json \
            --out models/dack_v27_T2_only_continuations_EXPERIMENTAL.json \
            --start 92000 --games 512
      - name: Audit frozen T2-only scores model-hash and no speculative mulligan beam
        run: python dack_paired_counterfactual_v27_T2_only_DP_20261101.py --audit
      - name: Archive unapproved model validation and matching London continuation only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f models/dack_v27_expanded_T2_only_value_EXPERIMENTAL.json \
             models/dack_v27_T2_only_continuations_EXPERIMENTAL.json \
             benchmark_results/v27_T2_only_94k_validation.json
          git commit -m "Archive v27 T2-only real-game value model and London DP for isolated prospective evaluation"
          git pull --rebase origin dack-v27-t2-value-20261031
          git push origin HEAD:dack-v27-t2-value-20261031
      - uses: actions/upload-artifact@v4
        with:
          name: dack-v27-T2-only-expanded-model-and-validation
          path: |
            models/dack_v27_expanded_T2_only_value_EXPERIMENTAL.json
            models/dack_v27_T2_only_continuations_EXPERIMENTAL.json
            benchmark_results/v27_T2_only_94k_validation.json
          retention-days: 30
