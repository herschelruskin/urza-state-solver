name: Dack Realistic Beam Per-Game Failure Audit
on:
  push:
    branches: [dack-realistic-information-beam-20261017]
    paths:
      - 'dack_realistic_beam_game_failure_audit_20261019.py'
      - '.github/workflows/dack_realistic_beam_game_failure_audit_20261019.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile exact paired game-level audit
        run: python -m py_compile dack_realistic_beam_game_failure_audit_20261019.py
      - name: Download historical matched seed and updated planning game artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p old_base old_buck v1 v2
          gh run download 38912678782 --repo "${{ github.repository }}" \
            --pattern 'boon-current-shard-*' --dir old_base
          gh run download 38931616641 --repo "${{ github.repository }}" \
            --pattern 'buck-buck_worldmap-*' --dir old_buck
          gh run download 39037402299 --repo "${{ github.repository }}" \
            --pattern 'realistic-beam-*' --dir v1
          gh run download 39056076511 --repo "${{ github.repository }}" \
            --pattern 'dack-beam-v2-*' --dir v2
          test "$(find v1 -name '*.json.gz' | wc -l)" -eq 32
          test "$(find v2 -name '*.json.gz' | wc -l)" -eq 16
      - name: Cross-check exact 32 matching games in each pair and classify losses
        run: |
          python -u dack_realistic_beam_game_failure_audit_20261019.py \
            --n 32 --old-base 'old_base/**/*.json.gz' \
            --old-buck 'old_buck/**/*.json.gz' \
            --v1 'v1/**/*.json.gz' \
            --v2 'v2/**/*.json.gz' \
            --out dack_realistic_beam_game_failure_audit_n32.json
      - uses: actions/upload-artifact@v4
        with:
          name: dack-realistic-beam-v1-v2-failure-inventory-n32
          path: dack_realistic_beam_game_failure_audit_n32.json
          retention-days: 90
          if-no-files-found: error
      - name: Publish deterministic per-game loss classification
        run: |
          mkdir -p benchmark_results
          cp dack_realistic_beam_game_failure_audit_n32.json \
            benchmark_results/dack_realistic_beam_game_failure_audit_n32.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add benchmark_results/dack_realistic_beam_game_failure_audit_n32.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publish per-game realistic-beam failure inventory for v1/v2'
            git pull --rebase origin dack-realistic-information-beam-20261017
            git push
          fi
