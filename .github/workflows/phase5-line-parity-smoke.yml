name: Phase 5 line parity smoke

on:
  push:
    branches:
      - phase5-runtime-line-parity
  pull_request:
    branches:
      - phase5-mulligan-dp
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile parity overlay
        run: |
          python -m py_compile non_oracle_public_parity_runtime.py non_oracle_chain_offer_runtime.py phase5_transmute_commitment_adapter.py phase5_chrome_trigger_adapter.py non_oracle_rules_adapter_v2.py non_oracle_episode.py phase5_line_parity_smoke.py phase5_chain_offer_smoke.py phase5_chrome_trigger_smoke.py phase5_cam_search_entry_smoke.py phase5_rollout_policy_v4.py phase5_rollout_policy_v5.py phase5_rollout_policy_v5_smoke.py phase5_rollout_policy_v6.py phase5_rollout_policy_v6_smoke.py phase5_episode_cycle_smoke.py phase5_policy_diagnostic.py phase5_tutor_decision_audit.py phase5_monte_carlo.py phase5_tutor_q_audit.py phase5_tutor_q_confirm.py phase5_replay_economics_smoke.py phase5_win_catalog_smoke.py phase5_selective_tutor_q.py phase5_selective_tutor_q_smoke.py phase5_selective_tutor_q_diagnostic.py phase5_mulligan_tutor_q_pilot.py
      - name: Oracle/non-Oracle line parity
        run: |
          python phase5_line_parity_smoke.py
          python phase5_chain_offer_smoke.py
          python phase5_chrome_trigger_smoke.py
          python phase5_cam_search_entry_smoke.py
      - name: Artifact replay economics regression
        run: python phase5_replay_economics_smoke.py
      - name: Deterministic win catalog regression
        run: python phase5_win_catalog_smoke.py
      - name: Selective tutor-Q controller regression
        run: python phase5_selective_tutor_q_smoke.py
      - name: Commitment-aware rollout regression
        run: python phase5_rollout_policy_v5_smoke.py
      - name: Visible-synergy rollout regression
        run: python phase5_rollout_policy_v6_smoke.py
      - name: Exact recurrent-state episode regression
        run: python phase5_episode_cycle_smoke.py
      - name: Held-out human-kept trajectory diagnostic
        run: python phase5_policy_diagnostic.py
      - name: Tutor timing/target audit
        run: python phase5_tutor_decision_audit.py
      - name: Selective tutor-Q held-out pilot
        run: python phase5_selective_tutor_q_diagnostic.py
      - name: Confirm tutor Q disagreements
        run: python phase5_tutor_q_confirm.py
      - name: Keep-six tutor-Q mulligan pilot
        run: python phase5_mulligan_tutor_q_pilot.py
      - name: Preserve held-out diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: phase5-line-parity-diagnostic
          path: |
            phase5_policy_diagnostic.json
            phase5_tutor_decision_audit.json
            phase5_selective_tutor_q_diagnostic.json
            phase5_tutor_q_confirm.json
            phase5_mulligan_tutor_q_pilot.json
      - name: Phase 5 mulligan regression
        run: python phase5_mulligan_smoke.py
      - name: Phase 4 Monte Carlo regression
        run: python phase4_monte_carlo_smoke.py
      - name: Human benchmark integrity
        run: python human_benchmark_fixture_smoke.py
      - name: Architecture gates
        run: |
          python strategic_value_state_smoke.py
          python non_oracle_runtime_value_key_smoke.py
          python phase2_runtime_smoke.py
          python phase1_acceptance_smoke.py
      - name: Diff check
        run: git diff --check
