name: DACK v35 121k independent physical QKEEP Qmull validation
on:
  push:
    branches: [dack-v35-early-action-regret-20261101]
    paths:
      - '.github/workflows/dack_v35_121k_validation.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  physical:
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        include:
          - {kind: K, start: 121000, seat: 0, stage: 0}
          - {kind: K, start: 121004, seat: 0, stage: 0}
          - {kind: K, start: 121008, seat: 0, stage: 0}
          - {kind: K, start: 121012, seat: 0, stage: 0}
          - {kind: K, start: 121016, seat: 0, stage: 0}
          - {kind: K, start: 121020, seat: 0, stage: 0}
          - {kind: K, start: 121024, seat: 0, stage: 0}
          - {kind: K, start: 121028, seat: 0, stage: 0}
          - {kind: K, start: 121032, seat: 0, stage: 0}
          - {kind: K, start: 121036, seat: 0, stage: 0}
          - {kind: K, start: 121040, seat: 0, stage: 0}
          - {kind: K, start: 121044, seat: 0, stage: 0}
          - {kind: K, start: 121048, seat: 0, stage: 0}
          - {kind: K, start: 121052, seat: 0, stage: 0}
          - {kind: K, start: 121056, seat: 0, stage: 0}
          - {kind: K, start: 121060, seat: 0, stage: 0}
          - {kind: K, start: 121064, seat: 0, stage: 0}
          - {kind: K, start: 121068, seat: 0, stage: 0}
          - {kind: K, start: 121072, seat: 0, stage: 0}
          - {kind: K, start: 121076, seat: 0, stage: 0}
          - {kind: K, start: 121080, seat: 0, stage: 0}
          - {kind: K, start: 121084, seat: 0, stage: 0}
          - {kind: K, start: 121088, seat: 0, stage: 0}
          - {kind: K, start: 121092, seat: 0, stage: 0}
          - {kind: K, start: 121096, seat: 0, stage: 0}
          - {kind: K, start: 121100, seat: 0, stage: 0}
          - {kind: K, start: 121104, seat: 0, stage: 0}
          - {kind: K, start: 121108, seat: 0, stage: 0}
          - {kind: K, start: 121112, seat: 0, stage: 0}
          - {kind: K, start: 121116, seat: 0, stage: 0}
          - {kind: K, start: 121120, seat: 0, stage: 0}
          - {kind: K, start: 121124, seat: 0, stage: 0}
          - {kind: C, start: 0, seat: 0, stage: 0}
          - {kind: C, start: 0, seat: 0, stage: 1}
          - {kind: C, start: 0, seat: 0, stage: 2}
          - {kind: C, start: 0, seat: 0, stage: 3}
          - {kind: C, start: 0, seat: 0, stage: 4}
          - {kind: C, start: 0, seat: 0, stage: 5}
          - {kind: C, start: 0, seat: 0, stage: 6}
          - {kind: C, start: 0, seat: 1, stage: 0}
          - {kind: C, start: 0, seat: 1, stage: 1}
          - {kind: C, start: 0, seat: 1, stage: 2}
          - {kind: C, start: 0, seat: 1, stage: 3}
          - {kind: C, start: 0, seat: 1, stage: 4}
          - {kind: C, start: 0, seat: 1, stage: 5}
          - {kind: C, start: 0, seat: 1, stage: 6}
          - {kind: C, start: 0, seat: 2, stage: 0}
          - {kind: C, start: 0, seat: 2, stage: 1}
          - {kind: C, start: 0, seat: 2, stage: 2}
          - {kind: C, start: 0, seat: 2, stage: 3}
          - {kind: C, start: 0, seat: 2, stage: 4}
          - {kind: C, start: 0, seat: 2, stage: 5}
          - {kind: C, start: 0, seat: 2, stage: 6}
          - {kind: C, start: 0, seat: 3, stage: 0}
          - {kind: C, start: 0, seat: 3, stage: 1}
          - {kind: C, start: 0, seat: 3, stage: 2}
          - {kind: C, start: 0, seat: 3, stage: 3}
          - {kind: C, start: 0, seat: 3, stage: 4}
          - {kind: C, start: 0, seat: 3, stage: 5}
          - {kind: C, start: 0, seat: 3, stage: 6}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Strict frozen history, feature and model interface audit
        run: |
          python -m py_compile dack_simulator/validation/v35_121k_true_keep.py dack_simulator/validation/v35_121k_true_mull.py dack_simulator/validation/v35_121k_pool.py
          python -m dack_simulator.validation.v34_frozen_v33b_continuation
          test -f models/dack_v35_early_action_regret_EXPERIMENTAL.json
      - name: Evaluate new independent 121k physical KEEP or full99 Qmull
        run: |
          if [ "${{ matrix.kind }}" = "K" ]; then
            python -u dack_simulator/validation/v35_121k_true_keep.py \
              --start ${{ matrix.start }} --out shards/v35_K_${{ matrix.start }}.json.gz
          else
            python -u dack_simulator/validation/v35_121k_true_mull.py \
              --seat ${{ matrix.seat }} --stage ${{ matrix.stage }} \
              --out shards/v35_C_${{ matrix.seat }}_${{ matrix.stage }}.json.gz
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dack-v35-121k-${{ matrix.kind }}-${{ matrix.start }}-${{ matrix.seat }}-${{ matrix.stage }}
          path: shards/v35_*.json.gz
          retention-days: 30
  pool:
    needs: physical
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: dack-v35-121k-*
          path: collected
          merge-multiple: true
      - name: Verify 60 physical shards and pool dual-source action regret
        run: |
          test "$(find collected -maxdepth 1 -name 'v35_K_*.json.gz' | wc -l)" -eq 32
          test "$(find collected -maxdepth 1 -name 'v35_C_*.json.gz' | wc -l)" -eq 28
          python -u dack_simulator/validation/v35_121k_pool.py
      - name: Archive unmodified 8960 beam160 physical evaluations
        run: |
          mkdir -p benchmark_results/v35_121k_physical_shards
          cp collected/v35_*.json.gz benchmark_results/v35_121k_physical_shards/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f benchmark_results/v35_121k_physical_shards benchmark_results/v35_121k_conditional_validation.json
          git commit -m "Archive v35 independent 121k conditional regret and physical-group uncertainty"
          git pull --rebase origin dack-v35-early-action-regret-20261101
          git push origin HEAD:dack-v35-early-action-regret-20261101
      - uses: actions/upload-artifact@v4
        with:
          name: dack-v35-121k-heldout-action-regret-report
          path: benchmark_results/v35_121k_conditional_validation.json
          retention-days: 30
