name: R5 parallel scaling baseline

on:
  push:
    branches: [r5-parallel-scaling-staging]
    paths:
      - 'rust/crates/urza-mc/examples/r5_scaling_probe.rs'
      - '.github/workflows/r5-parallel-scaling-baseline.yml'

jobs:
  scaling-baseline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r5-parallel-scaling-staging
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/rust/target/
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
      - name: Build release scaling probe
        run: cargo build -p urza-mc --example r5_scaling_probe --release --locked
      - name: Run scaling baseline
        run: ./target/release/examples/r5_scaling_probe
