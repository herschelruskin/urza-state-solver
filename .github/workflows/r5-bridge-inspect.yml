name: R5 bridge inspect

on:
  push:
    branches: [rust-engine-rebuild]
    paths:
      - ".github/workflows/r5-bridge-inspect.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rust-engine-rebuild
      - name: Inspect R5 bridge surfaces
        run: |
          set -euo pipefail
          echo '=== ACTION ENUM ==='
          n=$(grep -n '^pub enum Action' rust/crates/urza-rules/src/lib.rs | head -1 | cut -d: -f1)
          sed -n "${n},$((n+180))p" rust/crates/urza-rules/src/lib.rs
          echo '=== LEGAL CONTINGENT ==='
          n=$(grep -n '^pub fn legal_contingent_actions' rust/crates/urza-rules/src/lib.rs | head -1 | cut -d: -f1)
          sed -n "${n},$((n+360))p" rust/crates/urza-rules/src/lib.rs
          echo '=== APPLY ACTION ==='
          n=$(grep -n '^pub fn apply_action' rust/crates/urza-rules/src/lib.rs | head -1 | cut -d: -f1)
          sed -n "${n},$((n+260))p" rust/crates/urza-rules/src/lib.rs
          echo '=== R4 DATABASE ==='
          grep -n 'impl CardDatabase for R4CardDatabase\|pub struct R4CardDatabase\|fn card_id_by_name\|pub fn card_id_by_name' rust/crates/urza-cards/src/lib.rs
          echo '=== CORE PUBLIC METHODS ==='
          grep -n 'impl BattlefieldZone\|pub fn permanents\|impl CardZone\|pub fn cards\|impl TrueState' rust/crates/urza-core/src/*.rs | head -80
          echo '=== INFO RESOLUTION ==='
          grep -n 'pub fn resolve_canonical_object\|canonical_object_classes' rust/crates/urza-info/src/lib.rs | head -40
